<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Noto Sans CJK SC, Noto Serif CJK SC, WenQuanYi Micro Hei, sans-serif">
<rect width="900" height="600" fill="#ffffff"/>
<text x="450" y="34" font-size="22" text-anchor="middle" font-weight="bold">读 ADL 五步</text>
<text x="450" y="58" font-size="13" text-anchor="middle" fill="#555">每步对应片中帧；第 5 步是片尾口播提醒</text>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#557"/></marker></defs>

<rect x="20" y="80" width="160" height="150" rx="10" fill="#f3f6fb" stroke="#99a"/>
<text x="100" y="108" font-size="15" text-anchor="middle" font-weight="bold">① 添加</text>
<text x="100" y="134" font-size="12" text-anchor="middle">搜 accumulation</text>
<text x="100" y="154" font-size="12" text-anchor="middle">选内置</text>
<text x="100" y="172" font-size="12" text-anchor="middle">Accumulation/</text>
<text x="100" y="190" font-size="12" text-anchor="middle">Distribution</text>
<text x="100" y="218" font-size="11" text-anchor="middle" fill="#666">帧 03–04（0:27–0:30）</text>

<rect x="196" y="80" width="160" height="150" rx="10" fill="#f3f6fb" stroke="#99a"/>
<text x="276" y="108" font-size="15" text-anchor="middle" font-weight="bold">② 看设置</text>
<text x="276" y="134" font-size="12" text-anchor="middle">Timeframe = Chart</text>
<text x="276" y="154" font-size="12" text-anchor="middle">Wait for timeframe</text>
<text x="276" y="172" font-size="12" text-anchor="middle">closes 勾上</text>
<text x="276" y="192" font-size="12" text-anchor="middle" fill="#a33" font-weight="bold">没有 Length</text>
<text x="276" y="218" font-size="11" text-anchor="middle" fill="#666">帧 05（0:49）</text>

<rect x="372" y="80" width="160" height="150" rx="10" fill="#f3f6fb" stroke="#99a"/>
<text x="452" y="108" font-size="15" text-anchor="middle" font-weight="bold">③ 看方向</text>
<text x="452" y="134" font-size="12" text-anchor="middle">线往上 → 买压占上风</text>
<text x="452" y="156" font-size="12" text-anchor="middle">线往下 → 卖压</text>
<text x="452" y="182" font-size="12" text-anchor="middle">只看方向和高低点</text>
<text x="452" y="200" font-size="12" text-anchor="middle">不看绝对值</text>
<text x="452" y="218" font-size="11" text-anchor="middle" fill="#666">帧 10–11（2:04/2:10）</text>

<rect x="548" y="80" width="160" height="150" rx="10" fill="#f3f6fb" stroke="#99a"/>
<text x="628" y="108" font-size="15" text-anchor="middle" font-weight="bold">④ 和价格比</text>
<text x="628" y="134" font-size="12" text-anchor="middle">同向 → 趋势确认</text>
<text x="628" y="154" font-size="12" text-anchor="middle">价 HH + 线 LH</text>
<text x="628" y="172" font-size="12" text-anchor="middle">→ 看跌背离示意</text>
<text x="628" y="192" font-size="12" text-anchor="middle">「值得再查」</text>
<text x="628" y="218" font-size="11" text-anchor="middle" fill="#666">帧 12–16（2:16–4:04）</text>

<rect x="724" y="80" width="160" height="150" rx="10" fill="#f3f6fb" stroke="#99a"/>
<text x="804" y="108" font-size="15" text-anchor="middle" font-weight="bold">⑤ 别单独用</text>
<text x="804" y="134" font-size="12" text-anchor="middle">结合趋势分析</text>
<text x="804" y="154" font-size="12" text-anchor="middle">结合支撑 / 阻力</text>
<text x="804" y="182" font-size="12" text-anchor="middle">ADL 只是背景证据</text>
<text x="804" y="218" font-size="11" text-anchor="middle" fill="#666">片尾 Summary 口播</text>

<line x1="180" y1="155" x2="194" y2="155" stroke="#557" stroke-width="2" marker-end="url(#ar)"/>
<line x1="356" y1="155" x2="370" y2="155" stroke="#557" stroke-width="2" marker-end="url(#ar)"/>
<line x1="532" y1="155" x2="546" y2="155" stroke="#557" stroke-width="2" marker-end="url(#ar)"/>
<line x1="708" y1="155" x2="722" y2="155" stroke="#557" stroke-width="2" marker-end="url(#ar)"/>

<rect x="20" y="256" width="280" height="140" rx="8" fill="#eef8f0" stroke="#5a9"/>
<text x="40" y="284" font-size="15" font-weight="bold" fill="#1a6b3c">采用</text>
<text x="40" y="310" font-size="13">· 价量累积线的定义</text>
<text x="40" y="334" font-size="13">· 线涨偏买压、线跌偏卖压</text>
<text x="40" y="358" font-size="13">· 和价格同向当趋势确认背景</text>

<rect x="310" y="256" width="280" height="140" rx="8" fill="#fff6e0" stroke="#c9a227"/>
<text x="330" y="284" font-size="15" font-weight="bold" fill="#8a6a00">观望</text>
<text x="330" y="310" font-size="13">· 看跌背离当反转预警</text>
<text x="330" y="334" font-size="13">· 反向（看涨）背离：片中</text>
<text x="330" y="354" font-size="13">　画面不清，未成示意</text>

<rect x="600" y="256" width="284" height="140" rx="8" fill="#fbeaea" stroke="#c33"/>
<text x="620" y="284" font-size="15" font-weight="bold" fill="#a22">弃用</text>
<text x="620" y="310" font-size="13">· 54.x M 绝对读数当阈值</text>
<text x="620" y="334" font-size="13">· 一见背离 / 拐头就开仓</text>

<rect x="20" y="414" width="864" height="166" rx="8" fill="#fff8ee" stroke="#e08a1e" stroke-width="2" stroke-dasharray="7,5"/>
<text x="40" y="442" font-size="15" font-weight="bold" fill="#b25f00">（笔者补充）自己练习时的检查清单——非片中内容</text>
<text x="40" y="470" font-size="13">1. 先在价格图上判断趋势与关键支撑 / 阻力，再看 ADL 是否同向。</text>
<text x="40" y="496" font-size="13">2. 比较高低点时，用同一张图、同一周期；不同品种 / 起点的 ADL 绝对值不能横向比。</text>
<text x="40" y="522" font-size="13">3. 发现背离先记下来，回看历史同类情形价格后来怎么走，再决定要不要纳入规则。</text>
<text x="40" y="548" font-size="13">4. 期货的成交量按合约张数计，换合约 / 换数据源都可能让 ADL 整体平移（推算）。</text>
</svg>

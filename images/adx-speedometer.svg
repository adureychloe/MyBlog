<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="40" font-size="26" fill="#222" text-anchor="middle" font-weight="bold">ADX 是车速表，不是方向盘</text><rect x="30" y="70" width="430" height="250" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="245" y="105" font-size="20" fill="#1e7d3a" text-anchor="middle" font-weight="bold">量的是：趋势强不强</text><text x="55" y="150" font-size="17" fill="#222" text-anchor="start" font-weight="normal">急涨 → ADX 升高</text><text x="55" y="186" font-size="17" fill="#222" text-anchor="start" font-weight="normal">急跌 → ADX 也会升高</text><text x="55" y="222" font-size="17" fill="#222" text-anchor="start" font-weight="normal">横盘拉锯 → ADX 低</text><text x="55" y="258" font-size="17" fill="#222" text-anchor="start" font-weight="normal">（0:18 口播：不判断多空）</text><rect x="500" y="70" width="430" height="250" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2" /><text x="715" y="105" font-size="20" fill="#a02020" text-anchor="middle" font-weight="bold">不能用来：判断多空</text><text x="525" y="150" font-size="17" fill="#222" text-anchor="start" font-weight="normal">ADX 高 ≠ 该做多</text><text x="525" y="186" font-size="17" fill="#222" text-anchor="start" font-weight="normal">ADX 低 ≠ 该做空</text><text x="525" y="222" font-size="17" fill="#222" text-anchor="start" font-weight="normal">单靠 ADX 定方向 → 弃用</text><text x="525" y="258" font-size="17" fill="#222" text-anchor="start" font-weight="normal">TradingView 默认 14 / 14（1:04）</text><text x="40" y="360" font-size="16" fill="#222" text-anchor="start" font-weight="normal">片中唯一给出的阈值：低于 20 ≈ 弱趋势 / 震荡（3:01–3:19）。读数越高 ≈ 趋势越成形（2:51）。</text><rect x="30" y="395" width="900" height="110" rx="10" fill="#fff6ec" stroke="#e8892b" stroke-width="2" stroke-dasharray="8 5"/><text x="44" y="423" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">（笔者补充，非片中画面）常见教材会把 ADX 与 +DI / −DI 一起用来看方向，</text><text x="44" y="449" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">也常把 25 当分界。我看到的 0:00–6:14 画面里没有出现 +DI/−DI 线，也没有 25。</text><text x="44" y="475" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">片尾 6:14–8:04（约 1:50）未看。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="45" font-size="26" fill="#222" text-anchor="middle" font-weight="bold">用 ADX 的步骤（0:00–6:14 所见）</text><rect x="30.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="131.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">1 加指标</text><text x="131.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">搜索 adx</text><text x="131.25" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">默认 14/14</text><line x1="234.5" y1="205" x2="258.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="262.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="363.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">2 看水平</text><text x="363.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">&lt;20 弱趋势/震荡</text><text x="363.75" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">少追突破</text><line x1="467.0" y1="205" x2="491.0" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="495.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="596.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">3 看斜率</text><text x="596.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">升 = 加强</text><text x="596.25" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">降 = 减弱</text><line x1="699.5" y1="205" x2="723.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="727.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="828.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">4 交叉确认</text><text x="828.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">形态、支撑阻力</text><text x="828.75" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">均线（5:40）</text><text x="40" y="370" font-size="17" fill="#222" text-anchor="start" font-weight="normal">6:05 口播：ADX 是滞后指标，基于过去 14 天，用来确认已发展的趋势，不是预测。</text><text x="40" y="400" font-size="17" fill="#222" text-anchor="start" font-weight="normal">调小参数会更快（1:18），但片中没讲代价 → 观望。</text><rect x="30" y="470" width="900" height="110" rx="10" fill="#fff6ec" stroke="#e8892b" stroke-width="2" stroke-dasharray="8 5"/><text x="44" y="498" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">本文只覆盖 0:00–6:14；片尾约 1:50（6:14–8:04）因 YouTube 验证拦截未看，内容不推测。</text></svg>
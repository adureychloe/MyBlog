<text x="40" y="360" font-size="13">· 零线上下 = 动量方向</text>
<text x="40" y="382" font-size="13">· 柱色 = 相对前一根升降</text>
<text x="40" y="404" font-size="13">· 颜色可改、勿迷信色码</text>

<rect x="320" y="280" width="280" height="150" rx="8" fill="#fff8e8" stroke="#da0"/>

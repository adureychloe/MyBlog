<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Asia Sweep → London Push → NY 第二次动量（示意）</text>
  <text x="480" y="54" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">关键：纽约只预期「又一次放量」，不预设必须反转</text>

  <!-- price path background -->
  <rect x="50" y="80" width="860" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Asia box -->
  <rect x="80" y="140" width="200" height="140" rx="6" fill="#e0f2fe" fill-opacity="0.7" stroke="#38bdf8" stroke-dasharray="6 4"/>
  <text x="180" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#0369a1">Asia 箱体</text>
  <text x="70" y="155" font-family="system-ui,sans-serif" font-size="11" fill="#0369a1">Asia High</text>
  <text x="70" y="285" font-family="system-ui,sans-serif" font-size="11" fill="#0369a1">Asia Low</text>

  <!-- sweep wick down -->
  <path d="M160 210 L180 210 L185 290 L200 210 L220 210" fill="none" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="200" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0284c7">Sweep 扫下沿</text>
  <text x="200" y="328" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">刺破≠全日方向</text>

  <!-- London push arrow up -->
  <path d="M300 250 L340 200 L380 180 L440 140 L500 120" fill="none" stroke="#16a34a" stroke-width="3"/>
  <polygon points="500,120 488,128 496,136" fill="#16a34a"/>
  <rect x="340" y="95" width="130" height="28" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="405" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#166534">London Push</text>

  <!-- NY second momentum - two branches -->
  <path d="M520 125 L580 110 L640 95" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="640,95 628,92 630,104" fill="#d97706"/>
  <text x="640" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#b45309">延续</text>

  <path d="M520 125 L560 160 L620 220 L680 260" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="680,260 668,250 674,246" fill="#dc2626"/>
  <text x="700" y="270" font-family="system-ui,sans-serif" font-size="12" fill="#b91c1c">反转</text>

  <rect x="560" y="300" width="200" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="660" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#92400e">NY：第二次动量</text>
  <text x="660" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#78350f">别写成「必反转」脚本</text>

  <!-- don't guess box -->
  <rect x="80" y="360" width="280" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="220" y="383" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">✗ 亚洲箱体内无确认乱猜方向</text>

  <rect x="400" y="360" width="300" height="36" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="550" y="383" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">✓ 等扫边或开盘推力 + 大结构同向</text>

  <text x="480" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">示意路径 · 非每日必现三连 · 不对应单一品种实盘</text>
</svg>

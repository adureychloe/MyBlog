  <text x="425.5" y="317.4" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">事件 K 线（财报 / 大突破 / 投降日）</text>
  <text x="425.5" y="335.4" font-size="12" fill="#ea580c" text-anchor="start" font-weight="700">= 锚点：AVWAP 从这里开始算</text>
  <text x="80.0" y="118.0" font-size="12" fill="#475569" text-anchor="start" font-weight="400">灰虚线 = 普通 VWAP：每天从当天第一笔重新算</text>
  <text x="80.0" y="136.0" font-size="12" fill="#475569" text-anchor="start" font-weight="400">→ 跨过财报跳空就「断了连续性」（3:15 字幕：you lose the continuity）</text>
  <text x="650.0" y="348.0" font-size="12" fill="#0891b2" text-anchor="start" font-weight="700">青色 = Anchored VWAP：只认锚点之后的成交</text>
  <text x="650.0" y="367.0" font-size="12" fill="#0891b2" text-anchor="start" font-weight="700">价在线上：锚点后买入的这批人整体浮盈</text>
  <text x="650.0" y="386.0" font-size="12" fill="#0891b2" text-anchor="start" font-weight="700">价在线下：这批人被套，更容易恐慌卖出</text>
  <text x="480.0" y="456.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">读法是「持有者心理」：从锚点起所有人的平均成本在哪里，他们现在是赚是亏。</text>
  <text x="480.0" y="482.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">锚点可选：财报、重大突破、趋势起点、恐慌低点、IPO 日、季末/年末、大新闻日。</text>
</svg>

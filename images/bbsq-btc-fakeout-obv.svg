<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><text x="480" y="40" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">反例：BTCUSD 冲出上轨，OBV 不确认 → 反转跌破下轨（照 5:10 画面）</text><path d="M60,200 C200,120 300,90 420,110 C560,130 700,230 900,250" fill="none" stroke="#4a7bd0" stroke-width="2"/><path d="M60,330 C200,300 300,250 420,260 C560,280 700,350 900,360" fill="none" stroke="#4a7bd0" stroke-width="2"/><polyline points="80,290 150,240 220,200 260,160 300,130 340,105 380,140 450,180 520,220 600,280 680,320 760,340 880,320" fill="none" stroke="#333" stroke-width="2.5"/><path d="M240,150 L345,100" stroke="#2ecc71" stroke-width="5"/><text x="355" y="95" font-size="15" fill="#1e8449" text-anchor="start" font-weight="normal">价格：更高的高点</text><rect x="60" y="400" width="840" height="110" fill="#f7f7f7" stroke="#aaa"/><text x="75" y="425" font-size="15" fill="#222" text-anchor="start" font-weight="normal">OBV</text><polyline points="80,480 160,460 240,445 300,450 340,447 400,470 480,490 560,500 680,505 880,495" fill="none" stroke="#4a7bd0" stroke-width="2"/><path d="M240,443 L345,445" stroke="#2ecc71" stroke-width="5"/><text x="355" y="440" font-size="15" fill="#1e8449" text-anchor="start" font-weight="normal">OBV：没有抬高（不确认）</text><text x="560" y="388" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">随后反转、跌破下轨</text><text x="480" y="545" font-size="13" fill="#555" text-anchor="middle" font-weight="normal">画面图例：BB 45,129.47 / 50,774.23 / 39,484.71 · BBW 0.25 · OBV −41.886K（光标所在K线，非最新价）</text><text x="480" y="575" font-size="13" fill="#888" text-anchor="middle" font-weight="normal">走势线为示意性描摹，仅保留截图中两条绿线的相对关系；周期在画面上看不到</text></svg>
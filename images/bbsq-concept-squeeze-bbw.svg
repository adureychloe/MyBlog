<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><text x="480" y="40" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">布林带收口 = 低波动状态（不给方向）</text><path d="M60,120 C200,110 260,200 380,225 L520,228 C640,200 700,110 900,100" fill="none" stroke="#4a7bd0" stroke-width="3"/><path d="M60,360 C200,370 260,280 380,262 L520,260 C640,290 700,370 900,380" fill="none" stroke="#4a7bd0" stroke-width="3"/><path d="M60,240 L900,240" stroke="#e08a3c" stroke-width="2"/><ellipse cx="450" cy="244" rx="90" ry="45" fill="#f5b7b1" opacity="0.5"/><text x="450" y="310" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="bold">Squeeze：上下轨最窄</text><text x="120" y="105" font-size="15" fill="#4a7bd0" text-anchor="start" font-weight="normal">上轨 = 20SMA + 2σ</text><text x="120" y="395" font-size="15" fill="#4a7bd0" text-anchor="start" font-weight="normal">下轨 = 20SMA − 2σ</text><text x="740" y="232" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">中轨 20 SMA(close)</text><path d="M560,200 L660,140" stroke="#27ae60" stroke-width="3"/><path d="M560,290 L660,350" stroke="#c0392b" stroke-width="3"/><text x="670" y="140" font-size="16" fill="#27ae60" text-anchor="start" font-weight="normal">向上？</text><text x="670" y="360" font-size="16" fill="#c0392b" text-anchor="start" font-weight="normal">向下？</text><rect x="60" y="430" width="840" height="90" fill="#f7f7f7" stroke="#aaa"/><text x="80" y="460" font-size="16" fill="#222" text-anchor="start" font-weight="normal">BBW 面板：带宽在“自身历史低端”时 = 收口确认</text><path d="M80,480 C250,480 330,512 450,512 C570,512 650,480 880,478" fill="none" stroke="#2e8b57" stroke-width="2"/><text x="480" y="565" font-size="14" fill="#666" text-anchor="middle" font-weight="normal">示意图，不是真实K线；参数照片中设置框 BB(20, close, 2, 0)</text></svg>
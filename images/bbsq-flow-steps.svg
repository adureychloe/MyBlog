<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><text x="480" y="40" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">片中流程 4 步 + 片中没给的部分</text><rect x="60" y="70" width="560" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="75" y="107" font-size="16" fill="#222" text-anchor="start" font-weight="normal">① 认收口：带变窄 + BBW 处于自身历史低端</text><path d="M340,130 L340,155" stroke="#4a7bd0" stroke-width="3"/><rect x="60" y="155" width="560" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="75" y="192" font-size="16" fill="#222" text-anchor="start" font-weight="normal">② 看 OBV：吸筹偏上破 / 派发偏下破（外汇例：较低高点）</text><path d="M340,215 L340,240" stroke="#4a7bd0" stroke-width="3"/><rect x="60" y="240" width="560" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="75" y="277" font-size="16" fill="#222" text-anchor="start" font-weight="normal">③ 等K线“收盘”收在带外，不追盘中刺破</text><path d="M340,300 L340,325" stroke="#4a7bd0" stroke-width="3"/><rect x="60" y="325" width="560" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="75" y="362" font-size="16" fill="#222" text-anchor="start" font-weight="normal">④ 没有100%信号 → 必须有风险管理计划</text><rect x="650" y="70" width="280" height="170" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/><text x="662" y="98" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（笔者补充）片中没给：</text><text x="662" y="122" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">· 止损 / 目标位</text><text x="662" y="146" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">· 使用周期</text><text x="662" y="170" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">· BBW 数值阈值</text><rect x="650" y="260" width="280" height="150" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/><text x="662" y="288" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（笔者补充）常见止损：</text><text x="662" y="312" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">放在收口区间另一侧</text><text x="662" y="336" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">或中轨外；非片中，</text><text x="662" y="360" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">待回测</text><rect x="60" y="420" width="870" height="110" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/><text x="72" y="448" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（推算）核对：(50,774.23 − 39,484.71) ÷ 45,129.47 ≈ 0.250 = BTC 面板 BBW 0.25</text><text x="72" y="472" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">→ 该平台 BBW ≈ (上轨−下轨)/中轨；外汇 BBW 0.02 vs BTC 0.25 → BBW 不能跨品种比</text></svg>
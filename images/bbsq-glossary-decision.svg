<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="12">
  <rect width="960" height="600" fill="#fafafa"/>
  <text x="480" y="22" text-anchor="middle" font-size="15" font-weight="bold">布林带收口（Bollinger Squeeze）+ BBW + OBV：Soheil PKO 片中的判读流程</text>
  <text x="480" y="40" text-anchor="middle" font-size="11" fill="#555">结构示意，不按实际 K 线绘制；形状参照片中第一张外汇图（截图 00–06）。片中未给止损、目标、周期、BBW 数值阈值。</text>

  <!-- ===== Price panel ===== -->
  <rect x="40" y="60" width="530" height="245" fill="#fff" stroke="#ccc"/>
  <text x="46" y="76" font-size="11" fill="#333">BB (20, close, 2)：中轨 = 20 SMA（收盘价）；上/下轨 = 中轨 ± 2 × 标准差</text>
  <!-- squeeze zone -->
  <rect x="250" y="82" width="140" height="220" fill="#ffcdd2" opacity="0.45"/>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">收口 Squeeze：带变窄</text>
  <!-- band fill -->
  <polygon points="40,150 150,105 260,102 320,106 380,111 460,140 565,175 565,290 460,220 380,139 320,130 260,138 150,195 40,250" fill="#e3f2fd" opacity="0.8"/>
  <polyline points="40,150 150,105 260,102 320,106 380,111 460,140 565,175" fill="none" stroke="#1e88e5" stroke-width="2"/>
  <polyline points="40,250 150,195 260,138 320,130 380,139 460,220 565,290" fill="none" stroke="#1e88e5" stroke-width="2"/>
  <polyline points="40,200 150,150 260,120 320,118 380,125 460,180 565,232" fill="none" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="566" y="172" font-size="10" fill="#1e88e5" text-anchor="end">上轨</text>
  <text x="470" y="296" font-size="10" fill="#1e88e5">下轨</text>
  <text x="470" y="194" font-size="10" fill="#ef6c00">中轨 20 SMA</text>
  <!-- price (close) path -->
  <polyline points="40,205 100,170 150,140 200,128 260,115 290,112 320,120 350,114 380,124 405,170 430,196 460,223 500,240 560,252" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="60" y="290" font-size="10" fill="#333">黑线 = 价格（收盘）</text>
  <!-- close outside lower band marker -->
  <circle cx="405" cy="170" r="6" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <line x1="405" y1="176" x2="380" y2="250" stroke="#c62828" stroke-width="1"/>
  <text x="250" y="262" font-size="11" fill="#c62828" font-weight="bold">K 线收盘收在下轨之外</text>
  <text x="250" y="277" font-size="11" fill="#c62828">→ 片中的入场点（做空示范）</text>
  <!-- equal highs in consolidation -->
  <line x1="290" y1="108" x2="350" y2="110" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== BBW panel ===== -->
  <rect x="40" y="315" width="530" height="95" fill="#fff" stroke="#ccc"/>
  <text x="46" y="331" font-size="11" fill="#333">BBW (20, close, 2)：Bollinger BandWidth，量两条带的距离</text>
  <polyline points="40,345 150,355 260,392 320,400 380,396 460,360 565,338" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#c62828">BBW 低谷：处在「自身这段历史」的低端</text>

  <!-- ===== OBV panel ===== -->
  <rect x="40" y="420" width="530" height="120" fill="#fff" stroke="#ccc"/>
  <text x="46" y="436" font-size="11" fill="#333">OBV（On-Balance Volume，能量潮）：判断盘整中是吸筹还是派发</text>
  <polyline points="40,520 120,490 200,455 260,482 300,486 350,470 390,496 430,515 565,530" fill="none" stroke="#5e35b1" stroke-width="2"/>
  <line x1="200" y1="455" x2="350" y2="470" stroke="#c62828" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="200" cy="455" r="3" fill="#c62828"/><circle cx="350" cy="470" r="3" fill="#c62828"/>
  <text x="360" y="462" font-size="11" fill="#c62828">OBV 较低高点（lower high）</text>
  <text x="360" y="476" font-size="11" fill="#c62828">价格高点不降 → 背离 = 卖压累积</text>
  <line x1="250" y1="82" x2="250" y2="540" stroke="#c62828" stroke-width="0.8" stroke-dasharray="2,3"/>
  <line x1="390" y1="82" x2="390" y2="540" stroke="#c62828" stroke-width="0.8" stroke-dasharray="2,3"/>

  <!-- ===== Decision flow ===== -->
  <text x="765" y="70" text-anchor="middle" font-size="13" font-weight="bold">片中的决策流程</text>
  <g font-size="11">
    <rect x="600" y="82" width="330" height="62" rx="6" fill="#ffebee" stroke="#c62828"/>
    <text x="610" y="100" font-weight="bold">① 认出收口</text>
    <text x="610" y="116">布林带变窄 + BBW 处于自身历史低端 = 低波动</text>
    <text x="610" y="132">（低波动之后往往是高波动；收口本身不给方向）</text>
    <text x="765" y="158" text-anchor="middle" font-size="14">↓</text>

    <rect x="600" y="164" width="330" height="78" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="610" y="182" font-weight="bold">② 读 OBV（补充确认/预判方向）</text>
    <text x="610" y="198">盘整中 OBV 走高 = 吸筹 → 向上突破概率↑</text>
    <text x="610" y="214">盘整中 OBV 走低 / 较低高点背离 = 派发 → 向下概率↑</text>
    <text x="610" y="230" fill="#555">（片中：盘整期不适合用动量振荡器）</text>
    <text x="765" y="256" text-anchor="middle" font-size="14">↓</text>

    <rect x="600" y="262" width="330" height="62" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="610" y="280" font-weight="bold">③ 等 K 线「收盘」收在带外</text>
    <text x="610" y="296">收在上轨之外 → 偏向上涨；收在下轨之外 → 偏向下跌</text>
    <text x="610" y="312" fill="#555">（只是盘中刺破、没收盘在外，不算）</text>
    <text x="765" y="338" text-anchor="middle" font-size="14">↓</text>

    <rect x="600" y="344" width="330" height="44" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="610" y="362" font-weight="bold">④ 入场</text>
    <text x="610" y="378">片中示范：OBV 偏空 + 收盘跌出下轨 → 做空</text>

    <rect x="600" y="404" width="330" height="96" rx="6" fill="#fff8e1" stroke="#f9a825"/>
    <text x="610" y="422" font-weight="bold">⚠ 假突破（Bollinger 所说的 fake-out）</text>
    <text x="610" y="438">BTCUSD 例：价格先冲出上轨，但 OBV 没有确认</text>
    <text x="610" y="454">（价格更高的高点、OBV 不跟）→ 随后回落并跌破下轨</text>
    <text x="610" y="470">片尾：没有 100% 保证的信号，需要风险管理计划</text>
    <text x="610" y="486" fill="#555">（片中没给具体止损/目标规则）</text>
  </g>
  <text x="480" y="580" text-anchor="middle" font-size="10" fill="#777">来源：Soheil PKO《Bollinger Band Squeeze Trading Strategy》（6:17），2026-10-21 浏览器看片截图 00–10。仅供学习，不构成投资建议。</text>
</svg>

  <text x="480.0" y="545.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">净贷记 = 5 − 3 = $2  ·  最大亏 = 宽 10 − 贷记 2 = $8  ·  盈亏平衡 = 短腿 50 + 贷记 2 = $52</text>
  <text x="480.0" y="568.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">$100 时短 −$45、长 +$37 → 仍 −$8（长腿把上行亏封顶）</text>

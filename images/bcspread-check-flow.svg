<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="45" font-size="26" fill="#222" text-anchor="middle" font-weight="bold">下单前自检流程（用片中公式，不含买卖建议）</text><rect x="30.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="131.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">1 观点</text><text x="131.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">近月温和看涨？</text><text x="131.25" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">大涨预期→不适合</text><line x1="234.5" y1="205" x2="258.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="262.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="363.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">2 选行权</text><text x="363.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">低K + 高K</text><text x="363.75" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">同标的同到期</text><line x1="467.0" y1="205" x2="491.0" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="495.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="596.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">3 算三数</text><text x="596.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">MaxL = 借记</text><text x="596.25" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">MaxG = 宽−借记</text><text x="596.25" y="221" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">BE = 低K+借记</text><line x1="699.5" y1="205" x2="723.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="727.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="828.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">4 看希腊</text><text x="828.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">Theta/Vega 大体对冲</text><text x="828.75" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">临近到期仍有时间侵蚀</text><text x="40" y="370" font-size="17" fill="#222" text-anchor="start" font-weight="normal">第 4 步是片中定性说法（“largely offset”“fairly low”，4:13 / 4:58），没有给数值，所以只观望。</text><text x="40" y="400" font-size="17" fill="#222" text-anchor="start" font-weight="normal">反例：股价收在 40 以下 → 两腿都作废，亏掉全部借记（2:26）。</text></svg>
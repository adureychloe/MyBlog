<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="45" font-size="26" fill="#222" text-anchor="middle" font-weight="bold">怎么搭：买低行权 call + 卖高行权 call（同到期）</text><rect x="30.0" y="90" width="280.0" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="170.0" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">① 买 1 张 ITM call</text><text x="170.0" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">低行权（例 40）</text><text x="170.0" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">付出权利金</text><line x1="312.0" y1="205" x2="336.0" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="340.0" y="90" width="280.0" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="480.0" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">② 卖 1 张 OTM call</text><text x="480.0" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">高行权（例 45）</text><text x="480.0" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">收回部分权利金</text><line x1="622.0" y1="205" x2="646.0" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="650.0" y="90" width="280.0" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="790.0" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">= 净借记价差</text><text x="790.0" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">成本比裸买 call 低</text><text x="790.0" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">上行在 45 封顶</text><text x="40" y="370" font-size="17" fill="#222" text-anchor="start" font-weight="normal">对比裸买 call：上行不封顶，但更贵、时间损耗更大。</text><text x="40" y="400" font-size="17" fill="#222" text-anchor="start" font-weight="normal">片中定位：温和看涨、近月，口播约 2%–5% 的上涨幅度（0:37）。</text><text x="40" y="430" font-size="17" fill="#222" text-anchor="start" font-weight="normal">镜像：Bear Call（贷记、偏空）；同样偏多但收钱的是 Bull Put（贷记）。</text><rect x="30" y="470" width="900" height="110" rx="10" fill="#fff6ec" stroke="#e8892b" stroke-width="2" stroke-dasharray="8 5"/><text x="44" y="498" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">（笔者补充）实盘也有两腿都 OTM 的借记 call 垂直；片中口播提到可先从 OTM 建仓，</text><text x="44" y="524" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">但没有幻灯展开，这里不当成步骤。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="40" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">牛市看涨价差到期盈亏（对照片中 0:37 画面数字）</text><line x1="120" y1="300" x2="890" y2="300" stroke="#333" stroke-width="2"/><line x1="120" y1="70" x2="120" y2="470" stroke="#333" stroke-width="2"/><polyline points="120,440.0 340,440.0 615,90.0 890,90.0" fill="none" stroke="#e03b2f" stroke-width="4"/><line x1="340" y1="294" x2="340" y2="306" stroke="#333"/><text x="340" y="328" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">40</text><line x1="450" y1="294" x2="450" y2="306" stroke="#333"/><text x="450" y="328" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">42</text><line x1="615" y1="294" x2="615" y2="306" stroke="#333"/><text x="615" y="328" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">45</text><text x="110" y="95.0" font-size="16" fill="#222" text-anchor="end" font-weight="normal">+$300</text><text x="110" y="305" font-size="16" fill="#222" text-anchor="end" font-weight="normal">$0</text><text x="110" y="445.0" font-size="16" fill="#222" text-anchor="end" font-weight="normal">−$200</text><text x="890" y="288" font-size="15" fill="#222" text-anchor="end" font-weight="normal">到期股价</text><text x="128" y="82" font-size="15" fill="#222" text-anchor="start" font-weight="normal">盈亏</text><text x="175" y="426.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">最大亏损 = 借记</text><text x="625" y="76.0" font-size="15" fill="#1e7d3a" text-anchor="start" font-weight="normal">最大盈利 = 宽度 − 借记</text><text x="462" y="286" font-size="15" fill="#1d3f80" text-anchor="start" font-weight="normal">盈亏平衡 42 = 40 + 借记</text><rect x="560" y="350" width="370" height="130" rx="10" fill="#fff6ec" stroke="#e8892b" stroke-width="2" stroke-dasharray="8 5"/><text x="574" y="378" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">（推算）宽度 45−40 = $5</text><text x="574" y="404" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">×100 股 = $500/张</text><text x="574" y="430" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">$500 − 借记 $200 = $300</text><text x="574" y="456" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">与画面 +$300 吻合；片中未写“$5宽”</text><text x="40" y="520" font-size="15" fill="#666" text-anchor="start" font-weight="normal">示意数字来自片中教学图，非真实标的、非交易信号。</text></svg>
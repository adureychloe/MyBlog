<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
  <rect width="960" height="380" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700">BOS vs CHoCH（用收盘确认，别只看影线）</text>
  <text x="240" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">BOS：结构突破（延续）</text>
  <text x="720" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#c2410c">CHoCH：结构变性格（预警）</text>
  <rect x="40" y="70" width="400" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="520" y="70" width="400" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <polyline points="70,260 130,180 190,220 250,140 310,180 370,100" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="70" y1="140" x2="380" y2="140" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="90" y="132" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">前高</text>
  <text x="240" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">BOS 收盘突破前高 = 趋势延续</text>
  <polyline points="560,200 620,120 680,160 740,100 800,220 860,280" fill="none" stroke="#2563eb" stroke-width="3"/>
  <line x1="560" y1="160" x2="860" y2="160" stroke="#f97316" stroke-dasharray="6 4"/>
  <text x="570" y="152" font-family="system-ui,sans-serif" font-size="12" fill="#c2410c">重要 HL</text>
  <text x="720" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#b91c1c">CHoCH 收盘跌破 HL = 性格可能变了</text>
</svg>

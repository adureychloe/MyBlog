<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">开盒子前的检查单</text><text x="30" y="72" font-size="15" fill="#667">第 1–3 项对应白板青绿四条；第 4 项依 10:39 TOS tooltip；最后一项为笔者补充</text><rect x="60" y="90" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">1 是不是欧式期权？（Need European Options）</text><text x="72" y="139.2" font-size="16" fill="#222">片中演示标的为 S&amp;P 500 INDEX（SPX）</text><line x1="480" y1="177.2" x2="480" y2="191.2" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="193.2" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="219.2" font-size="16" fill="#222" font-weight="bold">2 流动性够不够？（Look for liquidity）</text><text x="72" y="242.39999999999998" font-size="16" fill="#222">利润本来就薄（High Collateral w/ Low Reward）</text><line x1="480" y1="280.4" x2="480" y2="294.4" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="296.4" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="322.4" font-size="16" fill="#222" font-weight="bold">3 现在的时机划算吗？（Timing is variable）</text><text x="72" y="345.59999999999997" font-size="16" fill="#222">不是任何时候都有划算的盒子</text><line x1="480" y1="383.59999999999997" x2="480" y2="397.59999999999997" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="399.59999999999997" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="425.59999999999997" font-size="16" fill="#222" font-weight="bold">4 看懂链上「100」：Shares per Contract（乘数），不是 100 张</text><text x="72" y="448.79999999999995" font-size="16" fill="#222">10:39 TOS tooltip「Shares per Contract and Dollar Value」</text><line x1="480" y1="486.79999999999995" x2="480" y2="500.79999999999995" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="502.79999999999995" width="840" height="87.2" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="528.8" font-size="16" fill="#222" font-weight="bold">（笔者补充）买卖价差与手续费要从利润里扣</text><text x="72" y="552.0" font-size="16" fill="#222">板例利润 $2,275 是白板数字，没写成本扣减</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
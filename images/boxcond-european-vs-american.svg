<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">反例：为什么第 1 条是「Need European」</text><text x="30" y="72" font-size="15" fill="#667">白板只写了 Need European Options；下面的机制解释全部是笔者补充</text><rect x="30" y="95" width="430" height="330" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="121" font-size="16" fill="#222" font-weight="bold">（笔者补充）欧式（如片中 SPX）</text><text x="42" y="144.2" font-size="16" fill="#222">只能到期行权</text><text x="42" y="167.39999999999998" font-size="16" fill="#222">到期按宽度结算</text><text x="42" y="190.59999999999997" font-size="16" fill="#222">四条腿到期前不会被拆开</text><text x="42" y="213.79999999999995" font-size="16" fill="#222">→ 盒子保持完整</text><rect x="500" y="95" width="430" height="330" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="512" y="121" font-size="16" fill="#222" font-weight="bold">（笔者补充）美式（如个股期权）</text><text x="512" y="144.2" font-size="16" fill="#222">短腿可能被提前指派</text><text x="512" y="167.39999999999998" font-size="16" fill="#222">一条腿变成股票仓</text><text x="512" y="190.59999999999997" font-size="16" fill="#222">盒子「裂开」，不再是</text><text x="512" y="213.79999999999995" font-size="16" fill="#222">锁定宽度的结构</text><text x="512" y="236.99999999999994" font-size="16" fill="#222">→ 不能再叫「近无风险」</text><rect x="30" y="445" width="900" height="120" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="42" y="471" font-size="16" fill="#222" font-weight="bold">弃用：在美式个股上硬做盒子却忽视提前指派</text><text x="42" y="494.2" font-size="16" fill="#222">（这是采用白板第 1 条之后的推论，不是视频口述）</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">做盒子前的四条（白板青绿字）</text><text x="30" y="72" font-size="15" fill="#667">依 4:05 定格帧重画；本片无字幕，只写白板上看得见的字</text><rect x="30" y="95" width="440" height="150" rx="10" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/><text x="42" y="122" font-size="17" fill="#222" font-weight="bold">1. Need European Options</text><text x="42" y="146.65" font-size="17" fill="#222">需要欧式期权（Need 有下划线）</text><rect x="490" y="95" width="440" height="150" rx="10" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/><text x="502" y="122" font-size="17" fill="#222" font-weight="bold">2. Look for liquidity</text><text x="502" y="146.65" font-size="17" fill="#222">找流动性</text><rect x="30" y="265" width="440" height="150" rx="10" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/><text x="42" y="292" font-size="17" fill="#222" font-weight="bold">3. Timing is variable</text><text x="42" y="316.65" font-size="17" fill="#222">时机不固定</text><rect x="490" y="265" width="440" height="150" rx="10" fill="#e8f8f5" stroke="#16a085" stroke-width="2"/><text x="502" y="292" font-size="17" fill="#222" font-weight="bold">4. Long = Loaning / Short = Borrowing</text><text x="502" y="316.65" font-size="17" fill="#222">多盒子 = 放贷；空盒子 = 借款</text><rect x="30" y="440" width="900" height="135" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="465" font-size="15" fill="#222" font-weight="bold">Purpose 栏同时写着：High Collateral w/ Low Reward</text><text x="42" y="486.75" font-size="15" fill="#222">占用大、单笔回报薄 —— 所以后面三条（欧式、流动性、时机）任何一条出问题，薄利都可能消失（笔者补充）</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
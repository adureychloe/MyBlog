<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">白板算例：先付 $997,725，到期拿回 $1,000,000</text><text x="30" y="72" font-size="15" fill="#667">数字全部来自 5:57–7:36 白板（Outlier Trading / Eric）</text><rect x="30" y="100" width="214" height="110" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="124" font-size="14" fill="#222" font-weight="bold">~18 DTE</text><text x="42" y="144.3" font-size="14" fill="#222">剩余天数</text><rect x="258" y="100" width="214" height="110" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="270" y="124" font-size="14" fill="#222" font-weight="bold">~1,000 wide</text><text x="270" y="144.3" font-size="14" fill="#222">两行权价宽度</text><rect x="486" y="100" width="214" height="110" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="498" y="124" font-size="14" fill="#222" font-weight="bold">$100,000 per lot</text><text x="498" y="144.3" font-size="14" fill="#222">每组盒子</text><rect x="714" y="100" width="214" height="110" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="726" y="124" font-size="14" fill="#222" font-weight="bold">$1,000,000 Loan value</text><text x="726" y="144.3" font-size="14" fill="#222">到期面值</text><rect x="30" y="230" width="214" height="110" rx="10" fill="#fffbe6" stroke="#b7950b" stroke-width="2"/><text x="42" y="254" font-size="14" fill="#222" font-weight="bold">$997,725 Loan</text><text x="42" y="274.3" font-size="14" fill="#222">开仓付出</text><rect x="258" y="230" width="214" height="110" rx="10" fill="#fffbe6" stroke="#b7950b" stroke-width="2"/><text x="270" y="254" font-size="14" fill="#222" font-weight="bold">$2,275 profit</text><text x="270" y="274.3" font-size="14" fill="#222">锁定利润</text><rect x="486" y="230" width="214" height="110" rx="10" fill="#fffbe6" stroke="#b7950b" stroke-width="2"/><text x="498" y="254" font-size="14" fill="#222" font-weight="bold">4.6% AROIC</text><text x="498" y="274.3" font-size="14" fill="#222">年化回报</text><rect x="714" y="230" width="214" height="110" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="726" y="256" font-size="16" fill="#222" font-weight="bold">Long = Loaning</text><text x="726" y="279.2" font-size="16" fill="#222">白板第 4 条</text><rect x="30" y="370" width="900" height="200" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="395" font-size="15" fill="#222" font-weight="bold">（推算）核对板上数字，板上没有写公式</text><text x="42" y="416.75" font-size="15" fill="#222">1000 × $100 = $100,000 / lot；10 × $100,000 = $1,000,000</text><text x="42" y="438.5" font-size="15" fill="#222">$1,000,000 − $997,725 = $2,275</text><text x="42" y="460.25" font-size="15" fill="#222">2,275 ÷ 997,725 ≈ 0.228%（18 天）；× 365/18 ≈ 4.62% ≈ 板上 4.6%</text><text x="42" y="482.0" font-size="15" fill="#222">→ 4.6% 是年化，不是 18 天赚 4.6%</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
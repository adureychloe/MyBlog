<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">读一个盒子算例的四步</text><text x="30" y="72" font-size="15" fill="#667">依白板 Purpose / Structure 顺序；第 3、4 步为笔者补充</text><rect x="60" y="90" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">1 认结构：同到期、同一对行权价的 debit call spread + debit put spread</text><text x="72" y="139.2" font-size="16" fill="#222">白板 Long + #Same expiry &amp; strikes</text><line x1="480" y1="203.0" x2="480" y2="217.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="219.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="245.0" font-size="16" fill="#222" font-weight="bold">2 找两个数：到期面值（Loan value）和开仓付出（Loan）</text><text x="72" y="268.2" font-size="16" fill="#222">板例 $1,000,000 与 $997,725</text><line x1="480" y1="332.0" x2="480" y2="346.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="348.0" width="840" height="113.0" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="374.0" font-size="16" fill="#222" font-weight="bold">3 （推算）利润 = 面值 − 付出；再按天数年化成 AROIC</text><text x="72" y="397.2" font-size="16" fill="#222">板例 $2,275 → 4.6% AROIC；板上没写公式</text><line x1="480" y1="461.0" x2="480" y2="475.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="477.0" width="840" height="113.0" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="503.0" font-size="16" fill="#222" font-weight="bold">4 （笔者补充）拿年化结果去和无风险利率比</text><text x="72" y="526.2" font-size="16" fill="#222">这就是 Purpose 第一条 Arbitrage via Risk Free Rate 的意思；具体怎么比，视频没给细节</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
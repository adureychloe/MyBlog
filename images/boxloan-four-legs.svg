<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">多盒子 = 借记 call 价差 + 借记 put 价差</text><text x="30" y="72" font-size="15" fill="#667">依 5:39 白板（Long / Same expiry &amp; strikes）与底部 SPX 17 MAR 23 4000/5000 链重画</text><rect x="30" y="95" width="430" height="210" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="121" font-size="16" fill="#222" font-weight="bold">Debit Call Spread</text><text x="42" y="144.2" font-size="16" fill="#222">买 4000 call</text><text x="42" y="167.39999999999998" font-size="16" fill="#222">卖 5000 call</text><text x="42" y="190.59999999999997" font-size="16" fill="#222">（17 MAR 23）</text><rect x="500" y="95" width="430" height="210" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/><text x="512" y="121" font-size="16" fill="#222" font-weight="bold">Debit Put Spread</text><text x="512" y="144.2" font-size="16" fill="#222">买 5000 put</text><text x="512" y="167.39999999999998" font-size="16" fill="#222">卖 4000 put</text><text x="512" y="190.59999999999997" font-size="16" fill="#222">（17 MAR 23）</text><text x="480" y="210" font-size="30" fill="#333" text-anchor="middle" font-weight="bold">+</text><rect x="30" y="325" width="900" height="95" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="351" font-size="16" fill="#222" font-weight="bold">白板：#Same expiry &amp; strikes  ·  Delta Neutral  ·  Expiry Value &gt; Premium Paid</text><rect x="30" y="440" width="900" height="135" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="465" font-size="15" fill="#222" font-weight="bold">（笔者补充）为什么到期一定值「宽度」</text><text x="42" y="486.75" font-size="15" fill="#222">无论 SPX 收在哪，call 价差和 put 价差总有一个值满宽、另一个归零（或两者合计 = 宽度），</text><text x="42" y="508.5" font-size="15" fill="#222">所以到期价值固定 = 1000 点 × $100 乘数。腿的买卖方向按标准多盒子写出，白板只写了价差名称。</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
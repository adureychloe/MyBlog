  <text x="667.0" y="90.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">合成</text>
  <text x="765.0" y="122.0" font-size="14.5" fill="#2563eb" text-anchor="middle" font-weight="700">Short put vertical</text>
  <text x="765.0" y="146.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">中性到看涨 · 风险和收益都封顶</text>
  <rect x="40.0" y="186.0" width="580.0" height="380.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330.0" y="210.0" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">XYZ 例（现价 $99）：卖 97 put、买 95 put，到期损益（每组）</text>

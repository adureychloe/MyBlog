  <text x="84.0" y="354.0" font-size="12" fill="#64748b" text-anchor="end" font-weight="400">0</text>
  <line x1="152.5" y1="347.0" x2="152.5" y2="353.0" stroke="#475569" stroke-width="1.2"/>
  <line x1="277.5" y1="347.0" x2="277.5" y2="353.0" stroke="#475569" stroke-width="1.2"/>
  <line x1="402.5" y1="347.0" x2="402.5" y2="353.0" stroke="#475569" stroke-width="1.2"/>
  <line x1="527.5" y1="347.0" x2="527.5" y2="353.0" stroke="#475569" stroke-width="1.2"/>

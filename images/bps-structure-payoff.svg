  <text x="527.5" y="516.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">99 现价</text>
  <polyline points="90.0,465.5 277.5,465.5 402.5,255.5 590.0,255.5" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round" stroke-opacity="1.0"/>
  <rect x="402.5" y="255.5" width="187.5" height="94.5" fill="#16a34a" fill-opacity="0.1" stroke="none"/>
  <rect x="90.0" y="350.0" width="187.5" height="115.5" fill="#dc2626" fill-opacity="0.1" stroke="none"/>
  <text x="496.2" y="245.5" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">最大盈利 +$90</text>
  <text x="496.2" y="277.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">= 收到的净权利金</text>
  <text x="183.8" y="487.5" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">最大亏损 −$110</text>
  <text x="183.8" y="505.5" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">两张都 ITM：被指派 / 行权</text>
  <circle cx="346.2" cy="350.0" r="5" fill="#ea580c"/>
  <rect x="196.2" y="364.0" width="140.0" height="40.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="266.2" y="381.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="700">盈亏平衡 ≈ 96.10</text>
  <text x="266.2" y="397.0" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="400">（推算：97 − 0.90）</text>
  <text x="330.0" y="545.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">形状对照 3:23 画面：左平（亏损封顶）— 斜坡 — 右平（盈利封顶）</text>
  <rect x="640.0" y="186.0" width="280.0" height="150.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="652.0" y="208.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700">算一遍（4:43、5:57 画面）</text>
  <text x="652.0" y="230.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">卖 97P：$1.50 × 100 = 收 $150</text>
  <text x="652.0" y="250.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">买 95P：$0.60 × 100 = 付 $60</text>
  <text x="652.0" y="270.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">净收：$150 − $60 = $90</text>
  <text x="652.0" y="290.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">最坏：−$9,700 + $9,500 = −$200</text>
  <text x="652.0" y="310.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">−$200 + $90 = −$110</text>
  <rect x="640.0" y="350.0" width="280.0" height="216.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="652.0" y="372.0" font-size="14" fill="#16a34a" text-anchor="start" font-weight="700">希腊字母（7:21–7:57）</text>
  <text x="652.0" y="394.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">Delta  为正：涨对你有利</text>
  <text x="652.0" y="413.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">Theta  为正：时间流逝对你有利</text>
  <text x="652.0" y="432.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">Vega   为负：IV 上升对你不利</text>
  <text x="652.0" y="451.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400"></text>
  <text x="652.0" y="470.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">指派（2:31、6:19）：临近到期、</text>
  <text x="652.0" y="489.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">股价停在 95 和 97 之间 → 短腿 ITM、</text>
  <text x="652.0" y="508.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">长腿 OTM，短腿可能被指派；</text>
  <text x="652.0" y="527.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">片中做法：两腿一起平</text>
  <text x="480.0" y="600.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">单张最大亏损 = （卖出行权价 − 买入行权价）× 100 − 收到的权利金 = (97 − 95) × 100 − 90 = $110</text>
  <text x="480.0" y="622.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">片中 12:46 的规则幻灯：(Short strike − Long strike) − Credit</text>
</svg>

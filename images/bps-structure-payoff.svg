  <rect x="355.0" y="74.0" width="54.0" height="22.0" rx="5" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
  <text x="382.0" y="90.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">买 Buy</text>
  <text x="460.0" y="122.0" font-size="14.5" fill="#2563eb" text-anchor="middle" font-weight="700">Long put（低行权）</text>
  <text x="460.0" y="146.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">倾向：看跌（当保险）</text>
  <text x="603.0" y="130.0" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="700">=</text>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">例题拆账 + 印刷文案勘误</text><rect x="30" y="60" width="400" height="250" rx="8" fill="#f5f7fa" stroke="#888" stroke-width="2" /><text x="50" y="90" font-size="17" fill="#222" text-anchor="start" font-weight="bold">片中例题（4:24 画面）</text><text x="50" y="125" font-size="16" fill="#222" text-anchor="start" font-weight="normal">股价 = $37</text><text x="50" y="155" font-size="16" fill="#222" text-anchor="start" font-weight="normal">买 1 张 40 PUT = $400（付出）</text><text x="50" y="185" font-size="16" fill="#222" text-anchor="start" font-weight="normal">卖 1 张 35 PUT = $100（收入）</text><text x="50" y="215" font-size="16" fill="#222" text-anchor="start" font-weight="normal">净借记 = $300</text><text x="50" y="260" font-size="15" fill="#1d4ed8" text-anchor="start" font-weight="normal">→ 一开仓就是"付钱"的价差（Debit）</text><rect x="470" y="60" width="400" height="250" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="490" y="90" font-size="17" fill="#b91c1c" text-anchor="start" font-weight="bold">画面印刷（弃用这种写法）</text><text x="490" y="125" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Max Loss = $300 (strike − credit)</text><text x="490" y="155" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Max Profit = $200 credit</text><text x="490" y="195" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="normal">问题：本例没有净"贷记"，</text><text x="490" y="220" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="normal">$200 不是 credit，括号也含混</text><rect x="30" y="340" width="840" height="150" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" /><text x="50" y="370" font-size="17" fill="#15803d" text-anchor="start" font-weight="bold">按画面结构改写成通用式</text><text x="50" y="405" font-size="15" fill="#222" text-anchor="start" font-weight="normal">最大亏损 = 净借记（$300）       盈亏平衡 = 长 put 行权 − 净借记（4:02 画面公式）</text><text x="50" y="440" font-size="15" fill="#222" text-anchor="start" font-weight="normal">最大盈利 = 行权宽度 − 净借记（$500 − $300 = $200，宽度由图轴推算）</text></svg>
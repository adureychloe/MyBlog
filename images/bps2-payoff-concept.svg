<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">熊市看跌价差到期盈亏（片中示意数字）</text><line x1="100" y1="260" x2="820" y2="260" stroke="#222" stroke-width="2" /><line x1="100" y1="80" x2="100" y2="470" stroke="#222" stroke-width="2" /><text x="110" y="90" font-size="14" fill="#222" text-anchor="start" font-weight="normal">盈亏</text><polyline points="120,140 300,140 550,440 800,440" fill="none" stroke="#dc2626" stroke-width="4" /><line x1="300" y1="254" x2="300" y2="266" stroke="#222" stroke-width="2" /><text x="300" y="285" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">35</text><line x1="400" y1="254" x2="400" y2="266" stroke="#222" stroke-width="2" /><text x="400" y="285" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">37</text><line x1="550" y1="254" x2="550" y2="266" stroke="#222" stroke-width="2" /><text x="550" y="285" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">40</text><text x="90" y="145" font-size="14" fill="#222" text-anchor="end" font-weight="normal">+$200</text><text x="90" y="265" font-size="14" fill="#222" text-anchor="end" font-weight="normal">$0</text><text x="90" y="445" font-size="14" fill="#222" text-anchor="end" font-weight="normal">−$300</text><text x="130" y="125" font-size="14" fill="#15803d" text-anchor="start" font-weight="normal">≤35：最大盈利 +$200（封顶）</text><text x="570" y="425" font-size="14" fill="#b91c1c" text-anchor="start" font-weight="normal">≥40：最大亏损 −$300 = 净借记</text><text x="410" y="240" font-size="14" fill="#1d4ed8" text-anchor="start" font-weight="bold">BE 37</text><text x="820" y="285" font-size="14" fill="#222" text-anchor="end" font-weight="normal">到期股价</text><rect x="560" y="90" width="320" height="100" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/><text x="572" y="114" font-size="15" fill="#c2410c" text-anchor="start" font-weight="bold">（推算）</text><text x="572" y="138" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">宽 40−35 = $5 → $500/张</text><text x="572" y="160" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">MaxG = 500 − 300 = $200</text><text x="572" y="182" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">BE = 40 − 3 = 37</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">从观点到建仓：片中流程</text><rect x="20" y="80" width="160" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="100" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">① 观点</text><text x="100" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">近月温和下跌</text><line x1="180" y1="130" x2="196" y2="130" stroke="#2563eb" stroke-width="3" /><rect x="196" y="80" width="160" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="276" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">② 买高行权</text><text x="276" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">ITM put（片中）</text><line x1="356" y1="130" x2="372" y2="130" stroke="#2563eb" stroke-width="3" /><rect x="372" y="80" width="160" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="452" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">③ 卖低行权</text><text x="452" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">OTM put 降成本</text><line x1="532" y1="130" x2="548" y2="130" stroke="#2563eb" stroke-width="3" /><rect x="548" y="80" width="160" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="628" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">④ 同标的同到期</text><text x="628" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">数量相等</text><line x1="708" y1="130" x2="724" y2="130" stroke="#2563eb" stroke-width="3" /><rect x="724" y="80" width="160" height="100" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="804" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">⑤ 先算三数</text><text x="804" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">MaxL / MaxG / BE</text><rect x="20" y="220" width="420" height="130" rx="8" fill="#f5f7fa" stroke="#888" stroke-width="2" /><text x="40" y="250" font-size="16" fill="#222" text-anchor="start" font-weight="bold">代价（0:54 画面）</text><text x="40" y="280" font-size="15" fill="#222" text-anchor="start" font-weight="normal">卖出下方 put 后，股价暴跌</text><text x="40" y="305" font-size="15" fill="#222" text-anchor="start" font-weight="normal">也只赚到封顶利润</text><rect x="460" y="220" width="420" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="480" y="250" font-size="16" fill="#222" text-anchor="start" font-weight="bold">观望（2:53–6:08 画面）</text><text x="480" y="280" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Theta/Vega "largely offset" 只是定性</text><text x="480" y="305" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Tips：略偏 OTM；$40 上方再买 call</text><rect x="20" y="380" width="860" height="110" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/><text x="32" y="404" font-size="15" fill="#c2410c" text-anchor="start" font-weight="bold">（笔者补充）</text><text x="32" y="428" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">也常见两腿都 OTM 的借记 put 垂直；片中正文是 ITM 长腿，tip 又说略偏 OTM，两种都只是示意。</text><text x="32" y="450" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">对照：Bull Call 同为借记垂直方向相反；Bear Call / Bull Put 是贷记价差。</text></svg>
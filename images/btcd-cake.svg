<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">BTC.D：加密市场这块蛋糕里，BTC 占多少</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><circle cx="180" cy="250" r="120" fill="#cfe9ff" stroke="#2e7d32" stroke-width="3"/><path d="M180,250 L180,130 A120,120 0 1 1 142.9,364.1 z" fill="#f7a823"/><text x="180" y="415" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">示例：BTC 占 55%</text><circle cx="500" cy="250" r="120" fill="#cfe9ff" stroke="#2e7d32" stroke-width="3"/><path d="M500,250 L500,130 A120,120 0 1 1 402.9,320.5 z" fill="#f7a823"/><text x="500" y="415" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">BTC.D ↑：BTC 那块变大</text><circle cx="820" cy="250" r="120" fill="#cfe9ff" stroke="#2e7d32" stroke-width="3"/><path d="M820,250 L820,130 A120,120 0 0 1 857.1,364.1 z" fill="#f7a823"/><text x="820" y="415" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">BTC.D ↓：ALT 那块变大</text><rect x="40" y="460" width="920" height="90" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="500" y="497" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">BTC.D = BTC 市值 ÷ 整个加密市场总市值</text><text x="500" y="530" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">片中：「BTC.D 就是在看这块蛋糕里面有多少比例是 BTC」（10–12 帧）</text><text x="60" y="585" font-size="16" fill="#222" text-anchor="start" font-weight="normal">■ 橙 = BTC　■ 蓝 = 其余（片中写 ALT）</text><text x="60" y="615" font-size="16" fill="#222" text-anchor="start" font-weight="normal">饼图比例为示例数据；片中 TradingView CRYPTOCAP:BTC.D 画面读数约 59.7%（02/17 帧）</text><text x="60" y="648" font-size="15" fill="#888" text-anchor="start" font-weight="normal">注：比例只是「份额」，BTC.D 下降不等于山寨币涨，见下文</text></svg>
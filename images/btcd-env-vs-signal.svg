<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">BTC.D 是天气预报，不是发令枪</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="40" y="80" width="440" height="330" rx="10" fill="#f3fbf3" stroke="#2e7d32" stroke-width="2"/><text x="260" y="120" font-size="21" fill="#2e7d32" text-anchor="middle" font-weight="bold">✅ 正确用法：看「环境」</text><text x="60" y="165" font-size="18" fill="#222" text-anchor="start" font-weight="bold">BTC.D ↑（BTC 相对占比 ↑）</text><text x="60" y="195" font-size="16" fill="#222" text-anchor="start" font-weight="normal">→ 作者：只找 BTC 的单子做（13 帧）</text><text x="60" y="245" font-size="18" fill="#222" text-anchor="start" font-weight="bold">BTC.D ↓（ALT 相对占比 ↑）</text><text x="60" y="275" font-size="16" fill="#222" text-anchor="start" font-weight="normal">→ 作者：开始比较注意 ALT 的市场方向</text><text x="60" y="302" font-size="16" fill="#555" text-anchor="start" font-weight="normal">（14/15 帧）</text><text x="60" y="355" font-size="16" fill="#2e7d32" text-anchor="start" font-weight="normal">它回答的是：「现在适不适合打小币？」</text><text x="60" y="385" font-size="14" fill="#888" text-anchor="start" font-weight="normal">（17 帧字幕）</text><rect x="520" y="80" width="440" height="330" rx="10" fill="#fff5f5" stroke="#ef5350" stroke-width="2"/><text x="740" y="120" font-size="21" fill="#ef5350" text-anchor="middle" font-weight="bold">❌ 错误用法：当「进场信号」</text><text x="540" y="170" font-size="18" fill="#222" text-anchor="start" font-weight="bold">「BTC.D 跌了 → 马上买山寨」</text><text x="540" y="220" font-size="16" fill="#555" text-anchor="start" font-weight="normal">片中画面原文（16 帧）：</text><text x="540" y="258" font-size="19" fill="#ef5350" text-anchor="start" font-weight="bold">「BTC.D ↓ ≠ ALT 一定漲」</text><text x="540" y="296" font-size="19" fill="#ef5350" text-anchor="start" font-weight="bold">「BTC.D 是『環境』</text><text x="540" y="328" font-size="19" fill="#ef5350" text-anchor="start" font-weight="bold">   不是『進場訊號』」</text><text x="540" y="380" font-size="16" fill="#222" text-anchor="start" font-weight="normal">进场还要看这个币自己的结构</text><rect x="40" y="440" width="920" height="220" rx="10" fill="#fff8ee" stroke="#f39c12" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="475" font-size="19" fill="#f39c12" text-anchor="start" font-weight="bold">（推算）为什么 BTC.D 下降不一定是山寨强？</text><text x="60" y="512" font-size="17" fill="#222" text-anchor="start" font-weight="normal">BTC.D = BTC 市值 ÷ 总市值。分母里也包含稳定币。</text><text x="60" y="544" font-size="17" fill="#222" text-anchor="start" font-weight="normal">示例数据：BTC 市值不变，稳定币增发让总市值变大 → BTC.D 下降，</text><text x="60" y="576" font-size="17" fill="#222" text-anchor="start" font-weight="normal">但山寨币可能一点没涨。不同网站对「总市值」的统计口径也不同，读数会有差异。</text><text x="60" y="612" font-size="17" fill="#222" text-anchor="start" font-weight="bold">所以 BTC.D 只能告诉你「份额」，不能告诉你「谁在涨」。</text><text x="60" y="642" font-size="14" fill="#888" text-anchor="start" font-weight="normal">以上为笔者推算，非片中内容</text></svg>
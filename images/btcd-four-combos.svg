<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">BTC 价格 × BTC.D 四种组合（笔者补充）</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="40" y="80" width="920" height="520" rx="10" fill="#fff8ee" stroke="#f39c12" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="115" font-size="18" fill="#f39c12" text-anchor="start" font-weight="bold">（笔者补充）片中只讲了 BTC.D 升/降，没和 BTC 价格组合</text><text x="70" y="160" font-size="18" fill="#222" text-anchor="start" font-weight="bold">组合</text><text x="360" y="160" font-size="18" fill="#222" text-anchor="start" font-weight="bold">常见解读</text><text x="650" y="160" font-size="18" fill="#222" text-anchor="start" font-weight="bold">对山寨币意味着</text><rect x="60" y="185" width="880" height="90" rx="10" fill="#fff" stroke="#ddd" stroke-width="2"/><text x="80" y="240" font-size="20" fill="#222" text-anchor="start" font-weight="bold">BTC ↑ + BTC.D ↑</text><text x="360" y="240" font-size="18" fill="#222" text-anchor="start" font-weight="normal">钱集中在 BTC</text><text x="650" y="240" font-size="18" fill="#222" text-anchor="start" font-weight="normal">BTC 领涨，山寨跟不上</text><rect x="60" y="285" width="880" height="90" rx="10" fill="#fff" stroke="#ddd" stroke-width="2"/><text x="80" y="340" font-size="20" fill="#222" text-anchor="start" font-weight="bold">BTC ↑ + BTC.D ↓</text><text x="360" y="340" font-size="18" fill="#222" text-anchor="start" font-weight="normal">山寨普涨的可能</text><text x="650" y="340" font-size="18" fill="#222" text-anchor="start" font-weight="normal">山寨可能跑赢 BTC</text><rect x="60" y="385" width="880" height="90" rx="10" fill="#fff" stroke="#ddd" stroke-width="2"/><text x="80" y="440" font-size="20" fill="#222" text-anchor="start" font-weight="bold">BTC ↓ + BTC.D ↑</text><text x="360" y="440" font-size="18" fill="#222" text-anchor="start" font-weight="normal">避险，山寨跌更狠</text><text x="650" y="440" font-size="18" fill="#222" text-anchor="start" font-weight="normal">山寨通常最危险</text><rect x="60" y="485" width="880" height="90" rx="10" fill="#fff" stroke="#ddd" stroke-width="2"/><text x="80" y="540" font-size="20" fill="#222" text-anchor="start" font-weight="bold">BTC ↓ + BTC.D ↓</text><text x="360" y="540" font-size="18" fill="#222" text-anchor="start" font-weight="normal">可能资金躲进稳定币</text><text x="650" y="540" font-size="18" fill="#222" text-anchor="start" font-weight="normal">要再看 USDT.D</text><text x="60" y="640" font-size="16" fill="#555" text-anchor="start" font-weight="normal">这是常见的经验读法，不是规律，也不是片中内容；需要自己用历史图验证。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">作者的六步选币流程：BTC.D 在第二步</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="40" y="90" width="280" height="140" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="180" y="150" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">① BTC</text><text x="180" y="190" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">先判断 BTC 方向</text><line x1="322" y1="160" x2="358" y2="160" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="360" y="90" width="280" height="140" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="500" y="150" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">② BTC.D</text><text x="500" y="190" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">看是不是打小币的环境</text><line x1="642" y1="160" x2="678" y2="160" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="680" y="90" width="280" height="140" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="820" y="150" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">③ 找小幣</text><text x="820" y="190" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">选候选币</text><rect x="40" y="290" width="280" height="140" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="180" y="350" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">④ 小幣自己的結構</text><text x="180" y="390" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">看这个币自己的走势</text><line x1="322" y1="360" x2="358" y2="360" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="360" y="290" width="280" height="140" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="500" y="350" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">⑤ AMD</text><text x="500" y="390" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">作者的模型，片中未解释</text><line x1="642" y1="360" x2="678" y2="360" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="680" y="290" width="280" height="140" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="820" y="350" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">⑥ 進場</text><text x="820" y="390" font-size="16" fill="#444" text-anchor="middle" font-weight="normal">最后才进场</text><path d="M880,232 L880,262 L180,262 L180,286" fill="none" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="500" width="920" height="160" rx="10" fill="#fff" stroke="#999" stroke-width="2"/><text x="60" y="535" font-size="19" fill="#222" text-anchor="start" font-weight="bold">读法：从大到小（自上而下）</text><text x="60" y="570" font-size="16" fill="#222" text-anchor="start" font-weight="normal">画面原文：①BTC → ②BTC.D → ③找小幣 → ④小幣自己的結構 → ⑤AMD → ⑥進場（22 帧）</text><text x="60" y="602" font-size="16" fill="#222" text-anchor="start" font-weight="normal">BTC.D 排在第 2 步：它决定「要不要去找小币」，不决定「买哪个、何时买」。</text><text x="60" y="634" font-size="15" fill="#888" text-anchor="start" font-weight="normal">片中 Discord 信号卡只是作者推广示例，本文不当证据。</text></svg>
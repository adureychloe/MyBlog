<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 664" width="820" height="664">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fb8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Source Han Sans SC',sans-serif;fill:#222} .t{font-size:22px;font-weight:700} .st{font-size:14px;fill:#2a7fb8} .s{font-size:13px} .m{font-size:15px} .b{font-weight:700} .red{fill:#c62828} .grn{fill:#2e7d32} .blu{fill:#2a7fb8} .org{fill:#b35c00} .gry{fill:#666} .wht{fill:#fff}</style>
<rect width="820" height="664" fill="#ffffff"/>
<text x="24" y="38" class="t">开 BWB 前的 5 步：先算被跳过那一侧最多亏多少</text>
<text x="24" y="62" class="st">白板 + 口播（2:46–9:29）；橙框为推算</text>
<rect x="50" y="80" width="720" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="62" y="104" class="m" text-anchor="start">① 先画普通蝶式</text>
<text x="62" y="128" class="m" text-anchor="start">买 1 / 卖 2 / 买 1，两翼等距；片中例付 $0.10 借记（2:46）</text>
<line x1="410" y1="144" x2="410" y2="164" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="50" y="166" width="720" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="62" y="190" class="m" text-anchor="start">② 挪远一只翼</text>
<text x="62" y="214" class="m" text-anchor="start">片中挪的是下方那张 put → 只要 $0.10，整笔变成 $0.30 贷记（5:26）</text>
<line x1="410" y1="230" x2="410" y2="250" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="50" y="252" width="720" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="62" y="276" class="m" text-anchor="start">③ 拆成两个垂直价差</text>
<text x="62" y="300" class="m" text-anchor="start">short put spread 收 $0.90（口播 6:37）+ long put spread 付 $0.60（推算）</text>
<line x1="410" y1="316" x2="410" y2="336" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="50" y="338" width="720" height="64" rx="8" fill="#fff7ee" stroke="#f28c28" stroke-width="2" stroke-dasharray="7 4"/>
<text x="62" y="362" class="m org" text-anchor="start">④ 算最坏情况（推算）</text>
<text x="62" y="386" class="m org" text-anchor="start">最大亏损 ≈（宽翼宽度 − 窄翼宽度）− 贷记；跌穿最低那档时发生</text>
<line x1="410" y1="402" x2="410" y2="422" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="50" y="424" width="720" height="64" rx="8" fill="#fff7ee" stroke="#f28c28" stroke-width="2" stroke-dasharray="7 4"/>
<text x="62" y="448" class="m org" text-anchor="start">⑤ 算最好情况（推算）</text>
<text x="62" y="472" class="m org" text-anchor="start">最大盈利 ≈ 窄翼宽度 + 贷记（到期正好在短行权价）；股价在所有行权价上方 → 留下 $0.30</text>
<rect x="50" y="512" width="720" height="118" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="62" y="536" class="s" text-anchor="start">TAKEAWAYS（白板 9:29）：</text>
<text x="62" y="556" class="s" text-anchor="start">· BWB is a variant of a traditional butterfly that has a higher POP</text>
<text x="62" y="576" class="s" text-anchor="start">· Technically, we are long a butterfly for a credit with a BWB</text>
<text x="62" y="596" class="s" text-anchor="start">· BWB offers a higher POP, and in turn has more risk</text>
<text x="62" y="616" class="s" text-anchor="start">· 第 4 条有一个词被打码，无法辨认，这里不猜</text>
<text x="804" y="652" text-anchor="end" class="s gry">仅供学习，不构成投资建议</text>
</svg>

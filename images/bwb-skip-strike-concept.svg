<text x="350" y="462" class="s" text-anchor="middle">左边那只翼挪远（跳过一档）→ 收钱开仓（贷记 CR）</text>
<rect x="40" y="484" width="740" height="60" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="52" y="508" class="s" text-anchor="start">片中是 put 版：三档都在现价（蓝圈）下方；绿 = 买入，红「2」= 卖出两张。</text>
<text x="52" y="528" class="s" text-anchor="start">白板全程没写行权价，所以本图只画相对位置、不标任何行权价数字。</text>
<text x="804" y="568" text-anchor="end" class="s gry">仅供学习，不构成投资建议</text>

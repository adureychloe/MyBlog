<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" font-family="Arial, sans-serif" font-size="12">
  <rect width="680" height="300" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold">BWB 拆解与开仓前检查（口播 + 推算）</text>
  <rect x="40" y="50" width="280" height="100" fill="#fff" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <text x="180" y="74" text-anchor="middle" font-weight="bold" fill="#c62828">Short put spread</text>
  <text x="180" y="98" text-anchor="middle">卖 $1.00 − 买 $0.10 = <tspan font-weight="bold">$0.90 CR</tspan></text>
  <text x="180" y="122" text-anchor="middle" font-size="11" fill="#555">口播：「short put spread for 90 cents」</text>
  <rect x="360" y="50" width="280" height="100" fill="#fff" stroke="#2e7d32" stroke-width="1.5" rx="4"/>
  <text x="500" y="74" text-anchor="middle" font-weight="bold" fill="#2e7d32">Long put spread</text>
  <text x="500" y="98" text-anchor="middle">买 $1.60 − 卖 $1.00 = <tspan font-weight="bold">$0.60 DB</tspan></text>
  <text x="500" y="122" text-anchor="middle" font-size="11" fill="#555">0.90 − 0.60 = <tspan font-weight="bold">$0.30 净贷记</tspan> ✔</text>
  <rect x="40" y="170" width="600" height="100" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="6 4" rx="4"/>
  <text x="340" y="196" text-anchor="middle" font-weight="bold" fill="#ef6c00">开仓前（橙框 = 推算 / 笔者补充，非白板）</text>
  <text x="60" y="222" font-size="12">1. 核贷记算术（本例 0.30 CR）　2. 先算「被跳过那侧」最坏亏损 ≈ 翼宽差 − 贷记</text>
  <text x="60" y="246" font-size="12">3. 口播 $300/$800 只是举例碎片，不要当板面数字　4. 贷记开仓 ≠ 没风险</text>
  <text x="340" y="288" text-anchor="middle" font-size="10" fill="#777">对照 10 / 11 / 13 帧 · 仅供学习，不构成投资建议</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" font-family="Arial, sans-serif" font-size="12">
  <rect width="680" height="400" fill="#fafafa"/>
  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="bold">Broken Wing Butterfly（BWB）= SKIP STRIKE BUTTERFLY（tastylive 白板，put 版）</text>
  <text x="340" y="40" text-anchor="middle" font-size="11" fill="#555">白板只写了权利金，没写行权价；现价圈 STOCK 在所有行权价右侧（三档 put 都在现价下方）</text>

  <!-- NORMAL row -->
  <text x="40" y="78" font-weight="bold" fill="#1565c0">NORMAL（普通蝶式）</text>
  <line x1="60" y1="120" x2="600" y2="120" stroke="#444" stroke-width="2"/>
  <rect x="168" y="96" width="24" height="20" fill="#2e7d32"/><text x="180" y="111" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <rect x="268" y="124" width="24" height="20" fill="#c62828"/><text x="280" y="139" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <text x="280" y="158" text-anchor="middle" fill="#c62828" font-weight="bold">×2</text>
  <rect x="368" y="96" width="24" height="20" fill="#2e7d32"/><text x="380" y="111" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <circle cx="500" cy="120" r="9" fill="none" stroke="#1565c0" stroke-width="4"/><text x="500" y="146" text-anchor="middle" font-weight="bold">STOCK</text>
  <text x="180" y="176" text-anchor="middle" fill="#2e7d32" font-weight="bold">买 $0.50</text>
  <text x="280" y="176" text-anchor="middle" fill="#c62828" font-weight="bold">卖 $1.00 ×2</text>
  <text x="380" y="176" text-anchor="middle" fill="#2e7d32" font-weight="bold">买 $1.60</text>
  <text x="560" y="176" text-anchor="middle" fill="#2e7d32" font-weight="bold">= $0.10 DB</text>
  <text x="340" y="196" text-anchor="middle" font-size="11" fill="#1565c0">LOW POP · BEARISH · LIMITED MINIMAL LOSS（两翼等距）</text>

  <!-- BWB row -->
  <text x="40" y="232" font-weight="bold" fill="#1565c0">BWB（把左翼往外挪，跳过一档）</text>
  <line x1="60" y1="270" x2="600" y2="270" stroke="#444" stroke-width="2"/>
  <line x1="120" y1="226" x2="370" y2="226" stroke="#2e7d32" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/></marker></defs>
  <rect x="108" y="246" width="24" height="20" fill="#2e7d32"/><text x="120" y="261" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <rect x="268" y="274" width="24" height="20" fill="#c62828"/><text x="280" y="289" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <text x="280" y="308" text-anchor="middle" fill="#c62828" font-weight="bold">×2</text>
  <rect x="368" y="246" width="24" height="20" fill="#2e7d32"/><text x="380" y="261" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <circle cx="500" cy="270" r="9" fill="none" stroke="#1565c0" stroke-width="4"/><text x="500" y="296" text-anchor="middle" font-weight="bold">STOCK</text>
  <text x="120" y="326" text-anchor="middle" fill="#2e7d32" font-weight="bold">买 $0.10</text>
  <text x="280" y="326" text-anchor="middle" fill="#c62828" font-weight="bold">卖 $1.00 ×2</text>
  <text x="380" y="326" text-anchor="middle" fill="#2e7d32" font-weight="bold">买 $1.60</text>
  <text x="560" y="326" text-anchor="middle" fill="#2e7d32" font-weight="bold">= $0.30 CR</text>
  <text x="340" y="346" text-anchor="middle" font-size="11" fill="#1565c0">HIGH POP · NEUTRAL - BULLISH · LIMITED LARGER LOSS</text>
  <text x="340" y="374" text-anchor="middle" font-size="10" fill="#777">算术核对：0.50+1.60−2.00 = 0.10 借记；0.10+1.60−2.00 = −0.30 → 0.30 贷记。行权价间距白板未写。</text>
  <text x="340" y="390" text-anchor="middle" font-size="10" fill="#777">出处：2026-10-15-browser/screenshots/01-broken-wing-butterfly/ 08、10 帧。仅供学习，不构成投资建议。</text>
</svg>

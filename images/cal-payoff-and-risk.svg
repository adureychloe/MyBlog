  <text x="60.0" y="472.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">笔者补充（片中没画出/没说出）：同行权价的多头日历，理论最大亏损一般约等于付出的借记（本例约 $220/张）。</text>
  <text x="60.0" y="494.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">片中也没讲何时平仓、财报前的 IV 结构、double calendar——这些不是片中规则。</text>

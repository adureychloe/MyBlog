<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="480.0" y="32.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">$15 和 $80 是怎么算出来的：先看 Theta 曲线，再做两道减法</text>
  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">左：3:55 Theta Decay 曲线（165C，90/60/30/0 天）· 右：4:21 开仓、5:15 情景 A、6:28 情景 B</text>
  <polyline points="90.0,400.0 90.0,118.6 94.4,121.8 99.8,125.6 105.9,129.9 112.8,134.8 120.2,140.1 128.2,145.8 136.6,151.7 145.4,158.0 154.4,164.4 163.6,170.9 172.8,177.5 182.0,184.1 191.1,190.5 200.0,196.9 208.5,203.0 216.7,208.9 224.6,214.6 232.5,220.3 240.4,226.0 248.3,231.7 256.2,237.4 264.2,243.1 272.1,248.8 280.0,254.6 287.9,260.3 295.8,266.1 303.8,271.9 311.7,277.7 319.6,283.6 327.5,289.4 335.4,295.3 343.3,301.3 351.5,307.5 360.0,314.0 368.9,320.8 378.0,327.8 387.2,335.0 396.4,342.2 405.6,349.4 414.6,356.4 423.4,363.3 431.8,369.9 439.8,376.2 447.2,382.1 454.1,387.5 460.2,392.3 465.6,396.5 470.0,400.0 470.0,400.0" fill="#dcfce7" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-opacity="1.0"/>
  <polyline points="90.0,118.6 94.4,121.8 99.8,125.6 105.9,129.9 112.8,134.8 120.2,140.1 128.2,145.8 136.6,151.7 145.4,158.0 154.4,164.4 163.6,170.9 172.8,177.5 182.0,184.1 191.1,190.5 200.0,196.9 208.5,203.0 216.7,208.9 224.6,214.6 232.5,220.3 240.4,226.0 248.3,231.7 256.2,237.4 264.2,243.1 272.1,248.8 280.0,254.6 287.9,260.3 295.8,266.1 303.8,271.9 311.7,277.7 319.6,283.6 327.5,289.4 335.4,295.3 343.3,301.3 351.5,307.5 360.0,314.0 368.9,320.8 378.0,327.8 387.2,335.0 396.4,342.2 405.6,349.4 414.6,356.4 423.4,363.3 431.8,369.9 439.8,376.2 447.2,382.1 454.1,387.5 460.2,392.3 465.6,396.5 470.0,400.0" fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round" stroke-opacity="1.0"/>
  <line x1="90.0" y1="400.0" x2="480.0" y2="400.0" stroke="#334155" stroke-width="1.5"/>
  <line x1="90.0" y1="100.0" x2="90.0" y2="400.0" stroke="#334155" stroke-width="1.5"/>
  <text x="285.0" y="440.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">距离到期的天数（Time Until Expiration）→ 0</text>
  <text x="96.0" y="92.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">时间价值（每张）</text>
  <circle cx="90.0" cy="118.6" r="5" fill="#065f46" stroke="#065f46" stroke-width="2"/>
  <text x="90.0" y="420.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">90 天</text>
  <circle cx="216.7" cy="208.9" r="5" fill="#065f46" stroke="#065f46" stroke-width="2"/>
  <text x="216.7" y="420.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">60 天</text>
  <circle cx="343.3" cy="301.3" r="5" fill="#065f46" stroke="#065f46" stroke-width="2"/>
  <text x="343.3" y="420.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">30 天</text>
  <circle cx="470.0" cy="400.0" r="5" fill="#065f46" stroke="#065f46" stroke-width="2"/>
  <text x="470.0" y="420.0" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">0 天</text>
  <text x="98.0" y="108.6" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">$670</text>
  <text x="216.7" y="194.9" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">$455</text>
  <text x="353.3" y="291.3" font-size="15" fill="#0f172a" text-anchor="start" font-weight="700">$235</text>
  <text x="466.0" y="388.0" font-size="15" fill="#0f172a" text-anchor="end" font-weight="700">$0</text>
  <text x="153.3" y="330.0" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">−$215</text>
  <text x="280.0" y="360.0" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">−$220</text>
  <text x="406.7" y="388.0" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">−$235</text>
  <text x="285.0" y="470.0" font-size="12" fill="#065f46" text-anchor="middle" font-weight="400">每过 30 天掉的越来越多：越接近到期，时间价值蒸发越快</text>
  <rect x="182.7" y="220.9" width="68.0" height="22.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="216.7" y="236.9" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">买这张</text>
  <rect x="309.3" y="313.3" width="68.0" height="22.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="343.3" y="329.3" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">卖这张</text>
  <rect x="520.0" y="78.0" width="400.0" height="104.0" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="540.0" y="102.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">开仓（4:21）</text>
  <text x="540.0" y="126.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">卖 ~30 天 165C：收 $235</text>
  <text x="540.0" y="146.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">买 ~60 天 165C：付 $455</text>
  <text x="540.0" y="170.0" font-size="14" fill="#2563eb" text-anchor="start" font-weight="700">净借记 = 455 − 235 = $220</text>
  <rect x="520.0" y="194.0" width="400.0" height="132.0" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="540.0" y="218.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">情景 A：30 天后，IV 与股价都不变（5:15）</text>
  <text x="540.0" y="242.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">卖出的近月 → $0（时间价值走完）</text>
  <text x="540.0" y="262.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">买入的远月 → 剩 $235（变成「30 天」那张）</text>
  <text x="540.0" y="290.0" font-size="16" fill="#16a34a" text-anchor="start" font-weight="700">利润 = 235 − 220 = $15</text>
  <text x="540.0" y="312.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">另一种算法：近月白赚 +235，远月掉 −220，合计 +15</text>
  <rect x="520.0" y="338.0" width="400.0" height="132.0" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="540.0" y="362.0" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700">情景 B：IV 上升、股价不动（6:28）</text>
  <text x="540.0" y="386.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">卖出的近月 → $0</text>
  <text x="540.0" y="406.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">买入的远月被抬到 $300（画面写「$300?」，是假设）</text>
  <text x="540.0" y="434.0" font-size="16" fill="#2563eb" text-anchor="start" font-weight="700">利润 = 300 − 220 = $80</text>
  <text x="540.0" y="456.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">远月对 IV 更敏感（Vega 大）→ 这是「多波动率」的仓位</text>
  <text x="480.0" y="510.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">报价 × 100 股：Dec 17 那张 165C bid 2.35 → 一张 $235。</text>
  <text x="480.0" y="534.0" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">$15 / $80 都建立在「股价刚好不动」的假设上，是教学算例，不是期望收益。</text>
</svg>

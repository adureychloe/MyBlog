<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><text x="480" y="40" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">套息交易：借便宜的钱，放到收益高的地方（白板 2:48–4:44）</text><rect x="60" y="110" width="330" height="150" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2" /><text x="225" y="150" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="bold">LIABILITY 负债</text><text x="225" y="190" font-size="20" fill="#222" text-anchor="middle" font-weight="normal">BORROW 1m JPY</text><text x="225" y="225" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">利率 0%</text><rect x="570" y="110" width="330" height="150" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2" /><text x="735" y="150" font-size="20" fill="#1e8449" text-anchor="middle" font-weight="bold">ASSET 资产</text><text x="735" y="190" font-size="19" fill="#222" text-anchor="middle" font-weight="normal">AUD INVESTMENT = 13,333</text><text x="735" y="225" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">收益 4.75%</text><path d="M395,185 L560,185" stroke="#333" stroke-width="3"/><polygon points="560,177 575,185 560,193" fill="#333"/><text x="480" y="170" font-size="17" fill="#222" text-anchor="middle" font-weight="normal">75 JPY = 1 AUD</text><text x="480" y="310" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">赚中间的利差（pocket the differential）；口播：看起来像 “money for nothing”</text><rect x="60" y="345" width="840" height="110" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/><text x="72" y="373" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（推算）1,000,000 ÷ 75 = 13,333.33 → 白板取整 13,333</text><text x="72" y="397" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（推算）一年利息 ≈ 13,333 × 4.75% ≈ 633 AUD；白板本身没算利息</text><text x="72" y="421" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">片中“对冲基金可加杠杆 gear up”只是口播，没有任何杠杆数字</text><text x="480" y="500" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">负债是日元、资产是澳元 → 币种错配（“币种错配”为笔者用词，白板只写 LIABILITY / ASSET）</text><text x="480" y="560" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">约15年前的教学例：0% / 4.75% / 75 / 65 均为当年数字，不是今天的利率汇率</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><text x="480" y="40" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">出事：日元走强 75 → 65，资产没少，却还不起债（白板 5:08–6:02）</text><rect x="60" y="90" width="400" height="110" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="260" y="130" font-size="19" fill="#222" text-anchor="middle" font-weight="normal">之前：75 JPY = 1 AUD</text><text x="260" y="170" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">13,333 AUD ≈ 100 万 JPY</text><rect x="500" y="90" width="400" height="110" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2" /><text x="700" y="130" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="normal">之后：65 JPY = 1 AUD</text><text x="700" y="170" font-size="18" fill="#222" text-anchor="middle" font-weight="normal">13,333 AUD × 65 = 866,645 JPY</text><rect x="120" y="250" width="120" height="200" fill="#e74c3c"/><text x="180" y="475" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">负债 1,000,000</text><rect x="320" y="277" width="120" height="173" fill="#27ae60"/><text x="380" y="475" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">资产 866,645</text><rect x="320" y="250" width="120" height="27" fill="none" stroke="#e67e22" stroke-width="2" stroke-dasharray="6,4"/><rect x="500" y="240" width="400" height="190" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/><text x="512" y="268" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（推算）缺口 = 1,000,000 − 866,645</text><text x="512" y="292" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">        = 133,355 JPY（约负债 13.3%）</text><text x="512" y="316" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（推算）日元对澳元升值 ≈ 15.4%</text><text x="512" y="340" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（推算）一年利息 ≈ 633 AUD ≈ 4.1万 JPY</text><text x="512" y="364" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">→ 远小于汇兑缺口；白板未写这些</text><text x="480" y="540" font-size="15" fill="#555" text-anchor="middle" font-weight="normal">白板与口播只给 866,645 &lt; 1m 负债，然后讲 margin call；缺口数字是笔者推算</text></svg>
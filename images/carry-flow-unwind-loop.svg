<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><text x="480" y="40" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">平仓连锁：为什么日元越涨越快（口播 6:02 起）</text><rect x="330" y="70" width="300" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="480" y="107" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">① 融资货币（日元）走强</text><rect x="620" y="170" width="300" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="770" y="207" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">② 资产换回日元不够还债</text><rect x="560" y="300" width="300" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="710" y="337" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">③ Margin call 追加保证金</text><rect x="100" y="300" width="300" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="250" y="337" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">④ 再借钱 / 卖资产买日元 = unwind</text><rect x="40" y="170" width="300" height="60" rx="8" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="190" y="207" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">⑤ 大家同时抢日元 → 日元更强</text><line x1="630" y1="100" x2="720" y2="170" stroke="#333" stroke-width="2.5"/><circle cx="720" cy="170" r="5" fill="#333"/><line x1="770" y1="230" x2="710" y2="300" stroke="#333" stroke-width="2.5"/><circle cx="710" cy="300" r="5" fill="#333"/><line x1="560" y1="330" x2="400" y2="330" stroke="#333" stroke-width="2.5"/><circle cx="400" cy="330" r="5" fill="#333"/><line x1="200" y1="300" x2="190" y2="230" stroke="#333" stroke-width="2.5"/><circle cx="190" cy="230" r="5" fill="#333"/><line x1="190" y1="170" x2="330" y2="100" stroke="#333" stroke-width="2.5"/><circle cx="330" cy="100" r="5" fill="#333"/><rect x="40" y="400" width="880" height="110" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/><text x="52" y="428" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">（笔者补充）“15y ago + this disaster + 二战以来” → 推算为 2011年3月东日本大地震后日元急升、G7 干预；</text><text x="52" y="452" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">片中没说出地震或 G7。（笔者补充）2024年8月日元套息平仓是后来的类比。</text><text x="52" y="476" font-size="15" fill="#b35400" text-anchor="start" font-weight="normal">片尾 “my money is on the…” 被截断，主讲结论未知，本文不补完</text><text x="480" y="560" font-size="14" fill="#888" text-anchor="middle" font-weight="normal">①–⑤ 来自口播与白板；圆环为示意</text></svg>
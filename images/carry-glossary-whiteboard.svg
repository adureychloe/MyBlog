<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="13">
  <rect width="960" height="620" fill="#fafafa"/>
  <text x="480" y="26" text-anchor="middle" font-size="16" font-weight="bold">日元套息交易（Yen Carry Trade）：MoneyWeek 白板例子原样复刻</text>
  <text x="480" y="46" text-anchor="middle" font-size="11" fill="#555">彩色方框里的大字 = 白板原文（截图 00–06）；小字为中文解释/口播；标「推算」的不是白板上写的。片中没给任何杠杆倍数，图中不画。</text>

  <!-- ===== Step 1: original board ===== -->
  <rect x="30" y="64" width="440" height="400" rx="8" fill="#fff" stroke="#90a4ae"/>
  <text x="250" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">① 开仓：WHAT IS A YEN CARRY TRADE?</text>

  <rect x="80" y="104" width="340" height="64" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="250" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#c62828">BORROW 1m JPY  0%</text>
  <text x="250" y="154" text-anchor="middle" font-size="12" fill="#c62828">LIABILITY 负债（借来的日元，利率 0%）</text>

  <line x1="250" y1="170" x2="250" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="262" y="196" font-size="15" font-weight="bold" fill="#37474f">75 JPY = 1 AUD</text>
  <text x="262" y="212" font-size="11" fill="#777">（按这个汇率把日元换成澳元）</text>

  <rect x="80" y="222" width="340" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="250" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#2e7d32">AUD INVESTMENT = 13,333</text>
  <text x="250" y="272" text-anchor="middle" font-size="15" fill="#2e7d32">4.75%</text>
  <text x="250" y="292" text-anchor="middle" font-size="12" fill="#2e7d32">ASSET 资产（澳元，收 4.75% 利息）</text>

  <text x="250" y="330" text-anchor="middle" font-size="12" fill="#37474f">口播算法：1,000,000 JPY ÷ 75 = 13,333 AUD</text>
  <text x="250" y="352" text-anchor="middle" font-size="12" fill="#37474f">赚的是两边利息的差（0% 借 → 4.75% 收）</text>
  <text x="250" y="374" text-anchor="middle" font-size="12" fill="#37474f">片中口播：看起来像 "money for nothing"</text>
  <text x="250" y="404" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">隐患：负债是日元、资产是澳元 → 币种错配（我的补充用词）</text>
  <text x="250" y="426" text-anchor="middle" font-size="11" fill="#777">融资货币 Funding = JPY；目标货币 Target = AUD</text>

  <!-- ===== arrow between ===== -->
  <line x1="476" y1="264" x2="514" y2="264" stroke="#555" stroke-width="3" marker-end="url(#arr)"/>
  <text x="495" y="250" text-anchor="middle" font-size="11" fill="#555">日元</text>
  <text x="495" y="290" text-anchor="middle" font-size="11" fill="#555">走强</text>

  <!-- ===== Step 2: yen strengthens ===== -->
  <rect x="520" y="64" width="410" height="400" rx="8" fill="#fff" stroke="#90a4ae"/>
  <text x="725" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">② 日元走强：75 被改成 65</text>

  <text x="725" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">65 JPY = 1 AUD</text>
  <text x="725" y="146" text-anchor="middle" font-size="11" fill="#777">（白板上原来的 75 被改写成 65：1 澳元现在只换得到 65 日元）</text>

  <text x="725" y="186" text-anchor="middle" font-size="16" fill="#37474f">13,333 AUD × 65</text>
  <rect x="580" y="200" width="290" height="50" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="2"/>
  <text x="725" y="232" text-anchor="middle" font-size="20" font-weight="bold" fill="#e65100">= 866,645 JPY</text>
  <text x="725" y="270" text-anchor="middle" font-size="12" fill="#2e7d32">资产现在只值这么多日元（白板方框圈住）</text>

  <text x="725" y="304" text-anchor="middle" font-size="14" fill="#c62828">vs  负债仍是 1,000,000 JPY</text>

  <rect x="560" y="320" width="330" height="56" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-dasharray="5,3"/>
  <text x="725" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#616161">缺口 133,355 JPY（推算）</text>
  <text x="725" y="362" text-anchor="middle" font-size="11" fill="#757575">1,000,000 − 866,645；白板上没写这个数</text>

  <text x="725" y="402" text-anchor="middle" font-size="12" fill="#37474f">片中口播：放贷方可能 margin call（追加保证金）</text>
  <text x="725" y="422" text-anchor="middle" font-size="12" fill="#37474f">→ 再借钱或卖资产去凑日元 = 套息平仓 unwind</text>
  <text x="725" y="442" text-anchor="middle" font-size="12" fill="#37474f">→ 大家一起找日元 → 日元更强（自我强化）</text>

  <!-- ===== loop ===== -->
  <rect x="30" y="482" width="900" height="120" rx="8" fill="#fff" stroke="#90a4ae"/>
  <text x="480" y="506" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">③ 平仓连锁（片中口播，白板未画）</text>
  <g font-size="12">
    <rect x="50" y="524" width="190" height="56" rx="6" fill="#fff8e1" stroke="#e65100"/>
    <text x="145" y="548" text-anchor="middle">融资货币（日元）走强</text>
    <text x="145" y="566" text-anchor="middle" fill="#777">资产换回的日元不够还</text>
    <line x1="242" y1="552" x2="272" y2="552" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="276" y="524" width="190" height="56" rx="6" fill="#ffebee" stroke="#c62828"/>
    <text x="371" y="548" text-anchor="middle">Margin call</text>
    <text x="371" y="566" text-anchor="middle" fill="#777">放贷方要求补钱</text>
    <line x1="468" y1="552" x2="498" y2="552" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="502" y="524" width="190" height="56" rx="6" fill="#e3f2fd" stroke="#1e88e5"/>
    <text x="597" y="548" text-anchor="middle">卖资产 / 再借 → 买日元</text>
    <text x="597" y="566" text-anchor="middle" fill="#777">= Unwind 套息平仓</text>
    <line x1="694" y1="552" x2="724" y2="552" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="728" y="524" width="190" height="56" rx="6" fill="#fff8e1" stroke="#e65100"/>
    <text x="823" y="548" text-anchor="middle">日元被推得更高</text>
    <text x="823" y="566" text-anchor="middle" fill="#777">回到第一格，循环</text>
  </g>
  <text x="480" y="598" text-anchor="middle" font-size="10" fill="#777">来源：MoneyWeek《What is the yen carry trade?》Tim Bennett 白板（约 15 年前的教学例，利率为当年水平）。仅供学习，不构成投资建议。</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
</svg>

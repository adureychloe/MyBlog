<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="620" fill="#ffffff"/>
<text x="450" y="32" font-size="20" text-anchor="middle" font-weight="bold">±100 带示意（非实盘副图）</text>
<text x="450" y="54" font-size="13" text-anchor="middle" fill="#555">片中只有白板 · 本图为（笔者补充）示意，不是存档帧截图复原</text>

<!-- schematic oscillator -->
<rect x="40" y="78" width="500" height="360" rx="8" fill="#111" stroke="#333"/>
<text x="290" y="108" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">CCI 刻度示意（无界）</text>

<!-- bands -->
<rect x="80" y="130" width="360" height="70" fill="#3a2a2a"/>
<text x="260" y="160" font-size="13" fill="#f88" text-anchor="middle">&gt; +100　超买 / 加速上涨</text>
<text x="260" y="182" font-size="12" fill="#caa" text-anchor="middle">板书双写，语义并置</text>

<line x1="80" y1="200" x2="440" y2="200" stroke="#e05a3c" stroke-width="2"/>
<text x="455" y="205" font-size="13" fill="#fff">+100</text>

<rect x="80" y="200" width="360" height="140" fill="#2a3a44" opacity="0.85"/>
<text x="260" y="270" font-size="14" fill="#cde" text-anchor="middle">−100 &lt; CCI &lt; +100</text>
<text x="260" y="294" font-size="13" fill="#9ab" text-anchor="middle">震荡 / 常态带</text>

<line x1="80" y1="340" x2="440" y2="340" stroke="#e05a3c" stroke-width="2"/>
<text x="455" y="345" font-size="13" fill="#fff">−100</text>

<rect x="80" y="340" width="360" height="70" fill="#2a3a2a"/>
<text x="260" y="370" font-size="13" fill="#8f8" text-anchor="middle">&lt; −100　超跌 / 准备进场</text>
<text x="260" y="392" font-size="12" fill="#aca" text-anchor="middle">贴合片题「超跌反弹」</text>

<!-- wiggly unbounded line -->
<path d="M100,280 L140,250 L180,220 L210,170 L240,210 L280,260 L320,300 L350,360 L390,390 L420,300" fill="none" stroke="#5ec8d8" stroke-width="2.5"/>
<text x="100" y="420" font-size="11" fill="#888">线可穿出 ±100（CCI 无 0–100 上界）</text>

<!-- right: counterexample -->
<rect x="560" y="78" width="310" height="200" rx="8" fill="#fdecea" stroke="#d66"/>
<text x="580" y="110" font-size="15" font-weight="bold" fill="#a33">反例 · 机械反向开仓</text>
<text x="580" y="140" font-size="13">一碰 +100 就做空、</text>
<text x="580" y="164" font-size="13">一碰 −100 就做多</text>
<text x="580" y="196" font-size="13" fill="#555">与板书「加速上涨」冲突；</text>
<text x="580" y="220" font-size="13" fill="#555">片中无实盘例、无回测</text>
<text x="580" y="252" font-size="14" font-weight="bold" fill="#a33">→ 弃用</text>

<rect x="560" y="298" width="310" height="140" rx="8" fill="#fff8e6" stroke="#da6"/>
<text x="580" y="330" font-size="15" font-weight="bold" fill="#8a5a00">观望</text>
<text x="580" y="358" font-size="13">&lt; −100 直接当买入时机</text>
<text x="580" y="382" font-size="13">&gt; +100 当「加速上涨」顺势</text>
<text x="580" y="414" font-size="12" fill="#555">片题导向 / 语义双关，需自定规则</text>

<rect x="40" y="460" width="830" height="140" rx="8" fill="#fff7ec" stroke="#e8890c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="60" y="492" font-size="14" fill="#b35c00" font-weight="bold">（笔者补充）与同日 MFI 对照</text>
<text x="60" y="520" font-size="13" fill="#b35c00">MFI：有界 0–100，且用到成交量；CCI：无界，纯价格（典型价）。</text>
<text x="60" y="546" font-size="13" fill="#b35c00">本图曲线与色带均为示意；片中从未出现软件副图。</text>
<text x="60" y="572" font-size="13" fill="#b35c00">MD 逐步算例数字因像素不清，本文省略，不臆造。</text>
</svg>

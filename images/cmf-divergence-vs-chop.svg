<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="640" fill="#ffffff"/>
<text x="450" y="32" font-size="20" text-anchor="middle" font-weight="bold">正例：看跌背离 · 反例：震荡市贴零轴</text>
<text x="450" y="54" font-size="13" text-anchor="middle" fill="#555">左对照帧 10（5:00 Divergences）· 右对照帧 12/13（Choppy PA 灰框）</text>

<!-- LEFT: divergence -->
<rect x="20" y="72" width="420" height="420" rx="8" fill="#fafafa" stroke="#99a"/>
<text x="40" y="98" font-size="15" font-weight="bold" fill="#8a2020">正例示意 · 看跌背离（观望）</text>
<text x="40" y="118" font-size="12" fill="#666">价格更高高点 + CMF 更低高点</text>

<rect x="40" y="130" width="380" height="140" fill="#fff" stroke="#ccc"/>
<text x="50" y="148" font-size="12" fill="#444">价格</text>
<path d="M60,240 L120,200 L180,210 L240,170 L300,155 L360,145" fill="none" stroke="#333" stroke-width="2"/>
<line x1="120" y1="200" x2="300" y2="155" stroke="#c33" stroke-width="2.5"/>
<circle cx="120" cy="200" r="5" fill="#c33"/>
<circle cx="300" cy="155" r="5" fill="#c33"/>
<text x="200" y="175" font-size="12" fill="#c33" font-weight="bold">HH ↑</text>

<rect x="40" y="285" width="380" height="160" fill="#fff" stroke="#ccc"/>
<text x="50" y="305" font-size="12" fill="#1a7a3c">CMF −0.00</text>
<line x1="60" y1="370" x2="400" y2="370" stroke="#888" stroke-dasharray="4,3"/>
<path d="M60,320 L120,300 L180,330 L240,345 L300,360 L360,380" fill="none" stroke="#1a9a4a" stroke-width="2.5"/>
<line x1="120" y1="300" x2="300" y2="360" stroke="#c33" stroke-width="2.5"/>
<circle cx="120" cy="300" r="5" fill="#c33"/>
<circle cx="300" cy="360" r="5" fill="#c33"/>
<text x="190" y="340" font-size="12" fill="#c33" font-weight="bold">LH ↓</text>
<text x="50" y="430" font-size="11" fill="#555">红线结构对照帧 10；曲线手绘</text>

<!-- RIGHT: chop -->
<rect x="460" y="72" width="420" height="420" rx="8" fill="#fafafa" stroke="#99a"/>
<text x="480" y="98" font-size="15" font-weight="bold" fill="#1a6b3c">反例语境 · 震荡贴零（采用降权）</text>
<text x="480" y="118" font-size="12" fill="#666">灰框横盘时 CMF 贴着 0 小幅扭</text>

<rect x="480" y="130" width="380" height="140" fill="#fff" stroke="#ccc"/>
<text x="490" y="148" font-size="12" fill="#444">价格</text>
<rect x="520" y="160" width="200" height="90" fill="#ccc" opacity="0.35" stroke="#888"/>
<path d="M500,220 L540,200 L580,215 L620,205 L660,218 L700,210 L740,225 L820,230" fill="none" stroke="#333" stroke-width="2"/>
<text x="560" y="210" font-size="12" fill="#555">灰框 = 横盘</text>

<rect x="480" y="285" width="380" height="160" fill="#fff" stroke="#ccc"/>
<text x="490" y="305" font-size="12" fill="#1a7a3c">CMF −0.14（帧 13 标签）</text>
<line x1="500" y1="365" x2="840" y2="365" stroke="#888" stroke-dasharray="4,3"/>
<path d="M500,360 L540,355 L580,370 L620,358 L660,372 L700,362 L740,368 L780,360 L820,366" fill="none" stroke="#1a9a4a" stroke-width="2.5"/>
<text x="560" y="350" font-size="12" fill="#555">贴着零轴扭动</text>
<text x="490" y="430" font-size="11" fill="#555">对照帧 12/13；单独判方向很弱</text>

<!-- bottom verdicts -->
<rect x="20" y="510" width="420" height="110" rx="8" fill="#fff8e6" stroke="#da6"/>
<text x="40" y="540" font-size="14" font-weight="bold" fill="#8a5a00">观望：背离作反转预警</text>
<text x="40" y="566" font-size="13">帧 10 图示清楚，可回测；片中无完整规则、</text>
<text x="40" y="588" font-size="13">无胜率。一见背离就逆势开仓 → 弃用。</text>

<rect x="460" y="510" width="420" height="110" rx="8" fill="#eef8f0" stroke="#5a9"/>
<text x="480" y="540" font-size="14" font-weight="bold" fill="#1a6b3c">采用：震荡市降低单独权重</text>
<text x="480" y="566" font-size="13">灰框 + 近零轴摆动画面直接支持。</text>
<text x="480" y="588" font-size="13">零轴穿越当自动买卖 → 弃用（无规则表）。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
  <rect width="960" height="620" fill="#fff"/>
  <text x="480.0" y="30.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">保护性领口：持股 + 买 Put（地板）+ 卖 Call（抵保费）</text>
  <text x="480.0" y="52.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">对照片中 2:39 Hedging 定义、3:09 Put 定义、9:19 Protective Collar 黑板</text>
  <rect x="30.0" y="72.0" width="280.0" height="130.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="40.0" y="62.0" width="70.0" height="22.0" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
  <text x="75.0" y="78.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">对冲</text>
  <text x="170.0" y="108.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Hedging（2:39）</text>
  <text x="170.0" y="132.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">用反向/抵消仓位</text>
  <text x="170.0" y="152.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">降低已有资产的</text>
  <text x="170.0" y="172.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">潜在亏损</text>
  <rect x="340.0" y="72.0" width="280.0" height="130.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <rect x="350.0" y="62.0" width="100.0" height="22.0" rx="5" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
  <text x="400.0" y="78.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">保护性 Put</text>
  <text x="480.0" y="108.0" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Protective Put（3:09）</text>
  <text x="480.0" y="132.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">持股 + 买一张 put</text>
  <text x="480.0" y="152.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">= 付费买「地板」</text>
  <text x="480.0" y="172.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">下行损失被买断</text>
  <rect x="650.0" y="72.0" width="280.0" height="130.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="660.0" y="62.0" width="90.0" height="22.0" rx="5" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
  <text x="705.0" y="78.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">领口 Collar</text>
  <text x="790.0" y="108.0" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="700">Protective Collar（9:19）</text>
  <text x="790.0" y="132.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">持股 + 买 put</text>
  <text x="790.0" y="152.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">+ 卖 call 抵 put 成本</text>
  <text x="790.0" y="172.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">几乎零成本，但上涨封顶</text>
  <rect x="30.0" y="220.0" width="900.0" height="100.0" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480.0" y="248.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">9:19 黑板定义拆开写</text>
  <rect x="50.0" y="262.0" width="200.0" height="42.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="150.0" y="289.0" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">① 持股 Stock</text>
  <text x="270.0" y="289.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">+</text>
  <rect x="290.0" y="262.0" width="220.0" height="42.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="400.0" y="289.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">② 买 Put（地板）</text>
  <text x="530.0" y="289.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">+</text>
  <rect x="550.0" y="262.0" width="240.0" height="42.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1"/>
  <text x="670.0" y="289.0" font-size="14" fill="#ea580c" text-anchor="middle" font-weight="700">③ 卖 Call（抵保费）</text>
  <text x="810.0" y="289.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">=</text>
  <rect x="830.0" y="262.0" width="80.0" height="42.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="870.0" y="289.0" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">领口</text>
  <rect x="30.0" y="340.0" width="560.0" height="240.0" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="310.0" y="365.0" font-size="13.5" fill="#0f172a" text-anchor="middle" font-weight="700">领口到期形状（概念示意）</text>
  <line x1="70.0" y1="480.0" x2="560.0" y2="480.0" stroke="#475569" stroke-width="1.4"/>
  <line x1="70.0" y1="380.0" x2="70.0" y2="550.0" stroke="#475569" stroke-width="1.4"/>
  <polyline points="90.0,510.0 200.0,510.0 380.0,420.0 530.0,420.0" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linejoin="round" stroke-opacity="1.0"/>
  <line x1="200.0" y1="380.0" x2="200.0" y2="550.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="380.0" y1="380.0" x2="380.0" y2="550.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="200.0" y="568.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Put 行权价</text>
  <text x="200.0" y="582.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">（地板）</text>
  <text x="380.0" y="568.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">Call 行权价</text>
  <text x="380.0" y="582.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">（天花板）</text>
  <text x="145.0" y="500.0" font-size="11.5" fill="#dc2626" text-anchor="middle" font-weight="700">下行有地板</text>
  <text x="455.0" y="410.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="700">上涨被封顶</text>
  <text x="310.0" y="395.0" font-size="11.5" fill="#16a34a" text-anchor="middle" font-weight="400">中间：股价涨，组合跟着赚</text>
  <rect x="610.0" y="340.0" width="320.0" height="240.0" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="770.0" y="365.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">（笔者补充）</text>
  <text x="630.0" y="395.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">领口 = 保护性 put</text>
  <text x="630.0" y="418.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">+ 备兑看涨（covered call）</text>
  <text x="630.0" y="441.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">的组合视角。</text>
  <text x="630.0" y="472.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">卖 call 那腿和车轮第三步</text>
  <text x="630.0" y="494.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">同类，但目的是降保费，</text>
  <text x="630.0" y="516.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">不是「主动收租循环」。</text>
  <text x="630.0" y="548.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">片中黑板只讲结构，</text>
  <text x="630.0" y="568.0" font-size="12" fill="#64748b" text-anchor="start" font-weight="400">没说和车轮的关系。</text>
</svg>

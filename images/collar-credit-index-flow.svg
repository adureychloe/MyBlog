<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
  <rect width="960" height="570" fill="#fff"/>
  <text x="480.0" y="28.0" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="700">从领口净贷记到指数 Put 雨伞：三步走完</text>
  <text x="480.0" y="50.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">对照 11:26 领口表、12:13 地板卡、14:39–14:49 组合对冲、16:17 缺点卡</text>
  <rect x="20.0" y="68.0" width="300.0" height="220.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <rect x="30.0" y="58.0" width="70.0" height="24.0" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="1"/>
  <text x="65.0" y="75.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">Step 1</text>
  <text x="170.0" y="100.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">领口几乎零成本（11:26）</text>
  <text x="170.0" y="128.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">短 525C bid ≈ 17.65</text>
  <text x="170.0" y="150.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">长 490P ask = 17.50</text>
  <text x="170.0" y="178.0" font-size="16" fill="#16a34a" text-anchor="middle" font-weight="700">Net Cr 0.15</text>
  <text x="170.0" y="205.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">附近：505C 9.85 / 510C 7.15</text>
  <text x="170.0" y="225.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">515C 4.65 / 520C 2.30</text>
  <text x="170.0" y="252.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="400">call 越近 → 贷记越大、封顶越近</text>
  <text x="170.0" y="272.0" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">（均为教学链上数字）</text>
  <line x1="325.0" y1="178.0" x2="355.0" y2="178.0" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="360.0" y="68.0" width="280.0" height="220.0" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="370.0" y="58.0" width="70.0" height="24.0" rx="5" fill="#16a34a" stroke="#16a34a" stroke-width="1"/>
  <text x="405.0" y="75.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">Step 2</text>
  <text x="500.0" y="100.0" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">有效地板（12:13）</text>
  <text x="500.0" y="135.0" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">$490 + $0.15</text>
  <text x="500.0" y="165.0" font-size="18" fill="#16a34a" text-anchor="middle" font-weight="700">= $490.15</text>
  <text x="500.0" y="200.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">净贷记摊到地板上</text>
  <text x="500.0" y="222.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">略抬高保护线</text>
  <rect x="380.0" y="240.0" width="240.0" height="38.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="500.0" y="264.0" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="700">（推算）封顶≈525.15</text>
  <line x1="645.0" y1="178.0" x2="675.0" y2="178.0" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="680.0" y="68.0" width="260.0" height="220.0" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="690.0" y="58.0" width="70.0" height="24.0" rx="5" fill="#ea580c" stroke="#ea580c" stroke-width="1"/>
  <text x="725.0" y="75.0" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">Step 3</text>
  <text x="810.0" y="100.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">指数 Put 雨伞</text>
  <text x="810.0" y="128.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">SPY $643.74（14:08）</text>
  <text x="810.0" y="150.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">QQQ $570.07（14:14）</text>
  <text x="810.0" y="178.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">$300k → 4–5 张 SPY put</text>
  <text x="810.0" y="200.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">（14:39）</text>
  <text x="810.0" y="228.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">1 QQQ put ≈ $57,000</text>
  <text x="810.0" y="250.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">保护（14:49）</text>
  <text x="810.0" y="272.0" font-size="11.5" fill="#ea580c" text-anchor="middle" font-weight="400">口播 40–50% 仅观望</text>
  <rect x="20.0" y="310.0" width="920.0" height="90.0" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="480.0" y="340.0" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">缺点（16:17 红字卡）</text>
  <text x="480.0" y="370.0" font-size="13.5" fill="#334155" text-anchor="middle" font-weight="400">CAPPED PROFITS（利润封顶）  ·  LIMITED PROTECTION WINDOWS（保护窗口有限，到期即失效）</text>
  <rect x="20.0" y="420.0" width="450.0" height="120.0" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="245.0" y="448.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">（推算）1 QQQ put ≈ $57,000</text>
  <text x="245.0" y="475.0" font-size="13" fill="#334155" text-anchor="middle" font-weight="400">≈ 报价 $570 × 100</text>
  <text x="245.0" y="500.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">与「一张合约 = 100 股名义」一致</text>
  <text x="245.0" y="525.0" font-size="11.5" fill="#64748b" text-anchor="middle" font-weight="400">片中卡未展开此算式</text>
  <rect x="490.0" y="420.0" width="450.0" height="120.0" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="715.0" y="448.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">（笔者补充）基差风险</text>
  <text x="715.0" y="475.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">SPY/QQQ 跌幅可能小于</text>
  <text x="715.0" y="500.0" font-size="12.5" fill="#334155" text-anchor="middle" font-weight="400">你的个股组合跌幅；</text>
  <text x="715.0" y="525.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">4–5 张只是片中示意，不是公式</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">看到一条期货曲线时的判读步骤</text><rect x="25" y="80" width="200" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="125" y="115" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold">① 认对象</text><text x="125" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">纵轴是价格吗？</text><text x="125" y="180" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">若是 IV → 不是本片</text><line x1="225" y1="145" x2="243" y2="145" stroke="#2563eb" stroke-width="3" /><rect x="243" y="80" width="200" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="343" y="115" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold">② 找现货点</text><text x="343" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">NOW / cash 在哪</text><text x="343" y="180" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">片中 $2,500</text><line x1="443" y1="145" x2="461" y2="145" stroke="#2563eb" stroke-width="3" /><rect x="461" y="80" width="200" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="561" y="115" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold">③ 看斜率</text><text x="561" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">向右上 / 向右下</text><text x="561" y="180" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">Contango / Backw.</text><line x1="661" y1="145" x2="679" y2="145" stroke="#2563eb" stroke-width="3" /><rect x="679" y="80" width="200" height="130" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="779" y="115" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold">④ 想原因</text><text x="779" y="150" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">高出部分≈持有成本</text><text x="779" y="180" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">仓储·保险·利息</text><rect x="25" y="240" width="850" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="45" y="272" font-size="15" fill="#222" text-anchor="start" font-weight="normal">片中没给：3M/6M 价格、升水点数、年化持有成本 → 无法从画面计算</text><text x="45" y="302" font-size="15" fill="#222" text-anchor="start" font-weight="normal">片中也没讲：基差、便利收益——本文不展开</text><rect x="25" y="350" width="850" height="140" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/><text x="37" y="374" font-size="15" fill="#c2410c" text-anchor="start" font-weight="bold">（笔者补充）</text><text x="37" y="398" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">中文常把期货 Contango 叫"升水/正向市场"，Backwardation 叫"贴水/反向市场"。</text><text x="37" y="420" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">Cost of Carry（持有成本）≠ Carry Trade（套息交易），名字像，机制不同。</text><text x="37" y="442" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">片子 2011 年出品：铝、可可、牛、铜、金、油荒等例子不代表 2026 行情。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">白板上的两条价格曲线（MoneyWeek 原片形状）</text><line x1="90" y1="330" x2="90" y2="90" stroke="#222" stroke-width="2" /><line x1="90" y1="330" x2="430" y2="330" stroke="#222" stroke-width="2" /><text x="80" y="100" font-size="13" fill="#222" text-anchor="end" font-weight="normal">PRICE</text><line x1="90.0" y1="325" x2="90.0" y2="335" stroke="#222" stroke-width="2" /><text x="90.0" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">NOW</text><line x1="243.0" y1="325" x2="243.0" y2="335" stroke="#222" stroke-width="2" /><text x="243.0" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">3M</text><line x1="396.0" y1="325" x2="396.0" y2="335" stroke="#222" stroke-width="2" /><text x="396.0" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">6M</text><polyline points="90,250 400,140" fill="none" stroke="#2563eb" stroke-width="3" /><text x="80" y="255" font-size="14" fill="#222" text-anchor="end" font-weight="normal">$2,500</text><text x="250" y="380" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Contango：远期价 &gt; 现货（2:52）</text><line x1="520" y1="330" x2="520" y2="90" stroke="#222" stroke-width="2" /><line x1="520" y1="330" x2="860" y2="330" stroke="#222" stroke-width="2" /><text x="510" y="100" font-size="13" fill="#222" text-anchor="end" font-weight="normal">PRICE</text><line x1="520.0" y1="325" x2="520.0" y2="335" stroke="#222" stroke-width="2" /><text x="520.0" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">NOW</text><line x1="673.0" y1="325" x2="673.0" y2="335" stroke="#222" stroke-width="2" /><text x="673.0" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">3M</text><line x1="826.0" y1="325" x2="826.0" y2="335" stroke="#222" stroke-width="2" /><text x="826.0" y="352" font-size="13" fill="#222" text-anchor="middle" font-weight="normal">6M</text><polyline points="520,95 820,215" fill="none" stroke="#dc2626" stroke-width="3" /><circle cx="687" cy="162" r="5" fill="#222"/><circle cx="795" cy="205" r="5" fill="#222"/><text x="690" y="380" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">Backwardation：现货 &gt; 远期（4:17–5:22）</text><text x="250" y="410" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">板上唯一数字 $2,500；3M/6M 无价格</text><text x="690" y="410" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">板上无任何美元标签</text><rect x="60" y="440" width="780" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="450" y="476" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">横轴是交割时间、纵轴是期货/远期"价格"——不是波动率</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">同名不同物：价格曲线 vs IV 期限结构</text><rect x="30" y="70" width="400" height="300" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="50" y="100" font-size="18" fill="#1e3a8a" text-anchor="start" font-weight="bold">本片讲的：期货 Contango</text><text x="50" y="140" font-size="15" fill="#222" text-anchor="start" font-weight="normal">对象：同一商品不同交割月的价格</text><text x="50" y="174" font-size="15" fill="#222" text-anchor="start" font-weight="normal">比较：远期价 vs 现货（cash）</text><text x="50" y="208" font-size="15" fill="#222" text-anchor="start" font-weight="normal">升水原因（口播）：持有成本</text><text x="50" y="242" font-size="15" fill="#222" text-anchor="start" font-weight="normal">  仓储 + 保险 + 损失的利息</text><text x="50" y="276" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Backwardation：现货更贵</text><text x="50" y="310" font-size="15" fill="#222" text-anchor="start" font-weight="normal">  口播例：油荒/急需实物（观望）</text><rect x="470" y="70" width="400" height="300" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/><text x="482" y="94" font-size="15" fill="#c2410c" text-anchor="start" font-weight="bold">（笔者补充）IV Contango</text><text x="482" y="118" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">对象：期权隐含波动率 IV</text><text x="482" y="140" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">比较：远月 IV vs 近月 IV</text><text x="482" y="162" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">IV Contango：远月 IV 更高</text><text x="482" y="184" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">IV Backwardation：近月 IV 更高</text><text x="482" y="206" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal"></text><text x="482" y="228" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">本片完全没有讲这部分，</text><text x="482" y="250" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">只为防混淆而补充。</text><rect x="30" y="400" width="840" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="50" y="432" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="normal">弃用：把本片结论直接套到 VIX/期权 IV 上；把听写的 $25,000 / $2,600 当板上数字</text><text x="50" y="465" font-size="15" fill="#b91c1c" text-anchor="start" font-weight="normal">听到"contango"先问一句：说的是价格，还是 IV？</text></svg>
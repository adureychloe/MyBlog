<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#111">延续优先于反转（学生向对比）</text>

  <!-- left: continuation -->
  <rect x="30" y="50" width="440" height="350" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="250" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#166534">默认剧本：延续</text>
  <text x="250" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#15803d">趋势继续，直到收盘改写结构</text>

  <!-- uptrend with pullback continuation -->
  <polyline points="70,280 120,200 170,240 220,150 270,190 330,110 390,145" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="170" cy="240" r="6" fill="#16a34a"/>
  <text x="180" y="255" font-family="system-ui,sans-serif" font-size="11" fill="#166534">HL 回撤</text>
  <circle cx="270" cy="190" r="6" fill="#16a34a"/>
  <text x="280" y="205" font-family="system-ui,sans-serif" font-size="11" fill="#166534">微确认</text>
  <circle cx="330" cy="110" r="6" fill="#2563eb"/>
  <text x="340" y="105" font-family="system-ui,sans-serif" font-size="11" fill="#1d4ed8">BOS 延续</text>

  <rect x="60" y="300" width="380" height="80" rx="10" fill="#fff" stroke="#86efac"/>
  <text x="250" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#166534">条件少、默认做</text>
  <text x="250" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">主趋势清晰 + 守结构回撤 + 扳机</text>

  <!-- right: reversal -->
  <rect x="490" y="50" width="440" height="350" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="710" y="82" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c2410c">例外剧本：反转</text>
  <text x="710" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9a3412">要额外证据，不能标签一出就反手</text>

  <!-- structure break then reverse -->
  <polyline points="530,160 580,110 630,150 690,90 750,200 820,280 870,240" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="530" y1="150" x2="880" y2="150" stroke="#f97316" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="540" y="142" font-family="system-ui,sans-serif" font-size="11" fill="#c2410c">重要 HL</text>
  <circle cx="750" cy="200" r="6" fill="#c2410c"/>
  <text x="760" y="195" font-family="system-ui,sans-serif" font-size="11" fill="#c2410c">CHoCH</text>
  <text x="820" y="300" font-family="system-ui,sans-serif" font-size="11" fill="#9a3412">+ 收盘确认</text>

  <rect x="520" y="300" width="380" height="80" rx="10" fill="#fff" stroke="#fdba74"/>
  <text x="710" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#c2410c">条件多、谨慎做</text>
  <text x="710" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">收盘改写结构 + 回到道氏三步复核</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">CVD：Absorption 可研 · Exhaustion 标 Not Tradeable</text>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">CVD = 累计（主动买 − 主动卖）· 作者纪律（Koenz ~0:52 / 5:07）</text>

  <rect x="40" y="75" width="440" height="340" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="260" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#166534">Absorption · Tradeable</text>
  <rect x="70" y="135" width="380" height="100" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="260" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#166534">多头吸收</text>
  <text x="260" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">价格：Higher Low</text>
  <text x="260" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">CVD：Lower Low</text>
  <rect x="70" y="255" width="380" height="100" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="260" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#166534">空头吸收</text>
  <text x="260" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">价格：Lower High</text>
  <text x="260" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">CVD：Higher High</text>
  <text x="260" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#166534">限价单在「吃」主动单 → 可研究</text>

  <rect x="500" y="75" width="420" height="340" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="710" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#991b1b">Exhaustion · Not Tradeable</text>
  <rect x="530" y="135" width="360" height="100" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="710" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">多头耗竭对照</text>
  <text x="710" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">价格 LL + CVD HL</text>
  <text x="710" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">一律标不做</text>
  <rect x="530" y="255" width="360" height="100" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="710" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">空头耗竭对照</text>
  <text x="710" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">价格 HH + CVD LH</text>
  <text x="710" y="335" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">一律标不做</text>
  <text x="710" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#991b1b">别把一切背离当反转</text>

  <text x="480" y="450" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">先分类，再谈下单 · 需价格结构确认 · 例图语境常 5m / 1h</text>
</svg>

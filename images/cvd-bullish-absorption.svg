<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">多头吸收示意：价 HL vs CVD LL（Tradeable）</text>
  <text x="480" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">教学示意，非实盘报价 · 对照画面 ~1:43</text>

  <!-- Price panel -->
  <rect x="40" y="70" width="440" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="260" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">价格</text>
  <polyline points="90,200 160,140 230,220 300,160 380,190" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="230" cy="220" r="8" fill="#22c55e"/>
  <circle cx="380" cy="190" r="8" fill="#22c55e"/>
  <text x="230" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">低点①</text>
  <text x="380" y="220" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">低点② 更高</text>
  <text x="260" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#166534">Higher Low</text>

  <!-- CVD panel -->
  <rect x="500" y="70" width="420" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="710" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f172a">CVD</text>
  <polyline points="550,180 620,130 690,240 760,150 860,270" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="690" cy="240" r="8" fill="#ef4444"/>
  <circle cx="860" cy="270" r="8" fill="#ef4444"/>
  <text x="690" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#b91c1c">CVD 低①</text>
  <text x="860" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#b91c1c">CVD 低② 更低</text>
  <text x="710" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Lower Low</text>

  <text x="480" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">努力（卖压累计）↑ 结果（价格）没创新低 → 吸收叙事 · 仍要结构位确认</text>
</svg>

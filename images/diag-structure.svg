  <text x="52.0" y="389.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">买 Aug 21（52 天）70 Call @6.50</text>
  <text x="52.0" y="409.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">现价约 72.7 → 70 是价内（ITM）</text>
  <text x="52.0" y="429.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">Delta ≈ 0.62（4:00）</text>
  <text x="52.0" y="449.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">单独持有：Theta ≈ −4.56（4:13）</text>
  <text x="52.0" y="469.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">→ 每天被时间磨掉一点</text>
  <rect x="340.0" y="345.0" width="285.0" height="150.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>

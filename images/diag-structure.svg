  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">对照片中 0:30 / 1:53 / 3:25 / 4:13 / 5:26 画面重画；NFLX 为片中教学数字，不是报价</text>

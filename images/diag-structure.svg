  <text x="52.0" y="532.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">笔者补充（非片中原话）</text>
  <text x="52.0" y="552.0" font-size="12" fill="#7c2d12" text-anchor="start" font-weight="400">「单做垂直 Theta ≈ 0」按片中口吻记录；严格说同到期垂直价差的净 Theta 往往很小，但不一定精确为零，笔者没有独立验证这个公式。</text>
  <text x="52.0" y="570.0" font-size="12" fill="#7c2d12" text-anchor="start" font-weight="400">片中全程没有损益图，所以本文不画对角价差的到期损益曲线。</text>

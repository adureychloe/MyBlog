  <text x="652.0" y="389.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">净借记 6.50 − 2.16 ≈ 4.25</text>
  <text x="652.0" y="409.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">= 每张 $425，BP 占用 $425</text>
  <text x="652.0" y="429.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">Theta：−4.56 → 约 +5.13</text>
  <text x="652.0" y="449.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">红条：POSITIVE THETA MEANS</text>
  <text x="652.0" y="469.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">TIME IS ON YOUR SIDE</text>

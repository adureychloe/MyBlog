  <text x="352.0" y="389.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">卖 Jul 17（17 天）76 Call ≈ 2.16</text>
  <text x="352.0" y="409.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">76 高于现价 → 虚值（OTM）</text>
  <text x="352.0" y="429.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">Delta ≈ 0.38（5:26）</text>
  <text x="352.0" y="449.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">近月 IVx 58.1% vs 远月 46.1%（3:25）</text>
  <text x="352.0" y="469.0" font-size="12.5" fill="#334155" text-anchor="start" font-weight="400">→「短期权付钱让你等待」（3:07）</text>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
  <rect width="960" height="380" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">十字星先当中性：犹豫，不是自动反转</text>
  <rect x="60" y="60" width="840" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <!-- preceding candles -->
  <rect x="140" y="140" width="28" height="80" fill="#86efac" stroke="#166534" stroke-width="2"/>
  <line x1="154" y1="120" x2="154" y2="240" stroke="#166534" stroke-width="2"/>
  <rect x="200" y="120" width="28" height="70" fill="#86efac" stroke="#166534" stroke-width="2"/>
  <line x1="214" y1="100" x2="214" y2="210" stroke="#166534" stroke-width="2"/>
  <!-- doji -->
  <line x1="300" y1="100" x2="300" y2="260" stroke="#64748b" stroke-width="2.5"/>
  <line x1="275" y1="180" x2="325" y2="180" stroke="#64748b" stroke-width="3"/>
  <rect x="288" y="174" width="24" height="12" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="300" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#475569">Doji 十字星</text>
  <!-- question marks / neutral -->
  <text x="420" y="150" font-family="system-ui,sans-serif" font-size="28" fill="#94a3b8">？</text>
  <text x="480" y="175" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#334155">多空暂时平衡</text>
  <text x="480" y="200" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">= 犹豫 / 观察</text>
  <text x="480" y="225" font-family="system-ui,sans-serif" font-size="14" fill="#b91c1c">≠ 自动反转信号</text>
  <!-- next candle placeholder -->
  <rect x="620" y="130" width="36" height="100" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="638" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">等下一根确认</text>
  <path d="M340 180 L400 180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M560 180 L610 180" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/></marker></defs>
  <text x="480" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">把 Doji 标成「观察」，等收盘或价值区触发再升级为 Entry</text>
</svg>

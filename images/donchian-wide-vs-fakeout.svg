<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="620" fill="#ffffff"/>
<text x="450" y="32" font-size="22" text-anchor="middle" font-weight="bold">宽通道 vs 窄盘整 vs「冲出去又回来」</text>
<text x="450" y="56" font-size="13" text-anchor="middle" fill="#555">对照帧 05 / 06 / 08 / 09 · 片中明说：通道本身不确认突破</text>

<!-- left wide -->
<rect x="30" y="74" width="280" height="280" rx="8" fill="#fafafa" stroke="#5a9"/>
<text x="170" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#1a6b3c">宽 = 波动更大</text>
<text x="170" y="120" font-size="11" text-anchor="middle" fill="#555">帧 05 · Wide Channel</text>
<!-- wide channel box -->
<rect x="70" y="140" width="160" height="160" fill="#4a9fd8" opacity="0.12" stroke="#4a9fd8" stroke-width="2"/>
<line x1="70" y1="140" x2="230" y2="140" stroke="#4a9fd8" stroke-width="2"/>
<line x1="70" y1="300" x2="230" y2="300" stroke="#4a9fd8" stroke-width="2"/>
<line x1="70" y1="220" x2="230" y2="220" stroke="#d4892a" stroke-width="1.5"/>
<!-- double arrow -->
<line x1="250" y1="145" x2="250" y2="295" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="258" y="220" font-size="11">宽</text>
<path d="M90,260 L120,230 L150,245 L180,200 L210,215" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="50" y="330" font-size="12">高低点离得远</text>
<text x="50" y="348" font-size="12" fill="#555">Higher Volatility</text>

<!-- mid tight -->
<rect x="320" y="74" width="280" height="280" rx="8" fill="#fafafa" stroke="#99a"/>
<text x="460" y="100" font-size="14" text-anchor="middle" font-weight="bold">窄 = 区间更紧</text>
<text x="460" y="120" font-size="11" text-anchor="middle" fill="#555">帧 06 · tighter range</text>
<rect x="380" y="190" width="160" height="70" fill="#4a9fd8" opacity="0.12" stroke="#4a9fd8" stroke-width="2"/>
<line x1="380" y1="190" x2="540" y2="190" stroke="#4a9fd8" stroke-width="2"/>
<line x1="380" y1="260" x2="540" y2="260" stroke="#4a9fd8" stroke-width="2"/>
<line x1="380" y1="225" x2="540" y2="225" stroke="#d4892a" stroke-width="1.5"/>
<path d="M400,240 L430,220 L460,235 L490,215 L520,230" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="340" y="330" font-size="12">高低点挤在一起</text>
<text x="340" y="348" font-size="12" fill="#555">盘整 / consolidating 背景</text>

<!-- right fakeout -->
<rect x="610" y="74" width="260" height="280" rx="8" fill="#fff8f8" stroke="#c66"/>
<text x="740" y="100" font-size="14" text-anchor="middle" font-weight="bold" fill="#a33">冲出又回来</text>
<text x="740" y="120" font-size="11" text-anchor="middle" fill="#555">帧 08–09 · 不确认突破</text>
<rect x="640" y="150" width="200" height="120" fill="#ccc" opacity="0.25" stroke="#888" stroke-dasharray="4,3"/>
<text x="740" y="175" font-size="12" text-anchor="middle" fill="#666">Consolidating</text>
<line x1="640" y1="200" x2="840" y2="200" stroke="#4a9fd8" stroke-width="2"/>
<path d="M660,230 L700,210 L740,190 L760,160 L780,195 L820,220" fill="none" stroke="#c43" stroke-width="2"/>
<text x="750" y="155" font-size="11" fill="#a33">刺出上轨</text>
<text x="640" y="300" font-size="12" fill="#a33">很快回到通道内</text>
<text x="640" y="330" font-size="12" font-weight="bold" fill="#a33">→ 碰轨入场：弃用</text>
<text x="640" y="348" font-size="11" fill="#555">No Breakout Confirmation</text>

<!-- bottom -->
<rect x="30" y="380" width="840" height="100" rx="8" fill="#fff0f0" stroke="#c66"/>
<text x="50" y="410" font-size="14" font-weight="bold" fill="#a33">片中原话要点：通道不确认突破</text>
<text x="50" y="436" font-size="13">帧 08 大字「No Breakout Confirmation」；帧 09 灰框 Consolidating + 口播「冲出上轨又回到通道」。</text>
<text x="50" y="460" font-size="13" fill="#555">把触碰/突破轨道直接当入场信号 → 弃用。可对照假突破相关旧文。</text>

<rect x="30" y="500" width="840" height="100" rx="8" fill="#fff7ec" stroke="#e8890c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="50" y="530" font-size="14" fill="#b35c00">（推算 / 笔者补充）——不是片中原话</text>
<text x="50" y="556" font-size="13" fill="#b35c00">推算：窄通道之后常有人期待变盘——片中只说「窄 = 紧」，没有给统计。</text>
<text x="50" y="580" font-size="13" fill="#b35c00">笔者补充：短片 2:48，无入场、止损、回测；不能当完整策略说明书。</text>
</svg>

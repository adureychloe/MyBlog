<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="sans-serif" font-size="13">
<rect width="720" height="470" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold">操作流程（示意）</text>
<rect x="160" y="45" width="400" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" /><text x="175" y="70">1 标出15min区间与前期高点</text>
<line x1="360" y1="85" x2="360" y2="105" stroke="#555"/>
<rect x="160" y="105" width="400" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" /><text x="175" y="130">2 等K线刺破高点、长上影、实体收回</text>
<line x1="360" y1="145" x2="360" y2="165" stroke="#555"/>
<rect x="160" y="165" width="400" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" /><text x="175" y="190">3 记录影线高点，等第二次冲高</text>
<line x1="360" y1="205" x2="360" y2="225" stroke="#555"/>
<rect x="160" y="225" width="400" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" /><text x="175" y="250">4 第二次冲高没过高点 → 看跌倾向</text>
<line x1="360" y1="265" x2="360" y2="285" stroke="#555"/>
<rect x="160" y="285" width="400" height="40" rx="6" fill="#fff7ed" stroke="#f57c00" stroke-dasharray="6,4"/><text x="175" y="310">（笔者补充）5 确认：收盘跌破回落低点</text>
<line x1="360" y1="325" x2="360" y2="345" stroke="#555"/>
<rect x="160" y="345" width="400" height="40" rx="6" fill="#fff7ed" stroke="#f57c00" stroke-dasharray="6,4"/><text x="175" y="370">（笔者补充）6 风控：止损在影线高点上方</text>
<line x1="360" y1="385" x2="360" y2="405" stroke="#555"/>
<rect x="160" y="405" width="400" height="40" rx="6" fill="#fff7ed" stroke="#f57c00" stroke-dasharray="6,4"/><text x="175" y="430">（笔者补充）7 参考成交量与更大周期</text>
</svg>
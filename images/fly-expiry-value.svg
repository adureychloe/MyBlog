  <text x="696" y="286" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">1220</text>
  <text x="770" y="286" font-size="12" fill="#334155" text-anchor="start" font-weight="400">中轴（最大）</text>
  <text x="916" y="286" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="700">$20</text>

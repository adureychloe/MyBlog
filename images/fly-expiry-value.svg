  <text x="770" y="140" font-size="12" fill="#64748b" text-anchor="start" font-weight="700">怎么算</text>
  <text x="916" y="140" font-size="12" fill="#64748b" text-anchor="end" font-weight="700">价值</text>
  <text x="696" y="166" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">&lt;1200</text>
  <text x="770" y="166" font-size="12" fill="#334155" text-anchor="start" font-weight="400">全部虚值</text>

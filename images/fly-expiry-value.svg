  <text x="916" y="346" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="700">$9</text>
  <text x="696" y="376" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">1238</text>
  <text x="770" y="376" font-size="12" fill="#334155" text-anchor="start" font-weight="400">38 − 2×18</text>
  <text x="916" y="376" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="700">$2</text>
  <text x="696" y="406" font-size="13" fill="#0f172a" text-anchor="start" font-weight="400">1240</text>
  <text x="770" y="406" font-size="12" fill="#334155" text-anchor="start" font-weight="400">40 − 2×20</text>
  <text x="916" y="406" font-size="13" fill="#1d4ed8" text-anchor="end" font-weight="700">$0</text>
  <text x="805" y="452" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">1222 起两张卖出的 1220C 进入实值，</text>
  <text x="805" y="470" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">每多涨 $1 要还回 $2，价值开始回落</text>
  <text x="480.0" y="516" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">读法：越靠近 1220 越值钱，两翼之外归零。净盈亏 = 到期价值 − 付出的 debit。</text>
  <text x="480.0" y="540" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">例：debit $1 时，1220 到期净赚 $19（19:1 的来源）；1238 到期净赚约 $1；低于 1200 亏掉 $1。</text>

  <rect x="70" y="360" width="370" height="100" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="255" y="388" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">Long 1200/1220 call spread</text>
  <text x="255" y="412" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">+1200C  −1220C</text>
  <text x="255" y="436" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">看涨垂直：赚「涨到 1220」这段</text>
  <text x="480" y="418" font-size="28" fill="#0f172a" text-anchor="middle" font-weight="700">+</text>
  <rect x="520" y="360" width="370" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="705" y="388" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">Short 1220/1240 call spread</text>
  <text x="705" y="412" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="400">−1220C  +1240C</text>
  <text x="705" y="436" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">卖出垂直：「涨过 1220」开始还回去</text>
  <text x="480.0" y="496" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">两个 1220C 合起来就是中间的「−2」；两个垂直同宽（20）、共享中轴 1220。</text>

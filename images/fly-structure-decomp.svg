  <circle cx="710" cy="250" r="6" fill="#166534"/>
  <text x="710" y="274" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">1240</text>
  <line x1="262" y1="285" x2="468" y2="285" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="468" y1="285" x2="262" y2="285" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="492" y1="285" x2="698" y2="285" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

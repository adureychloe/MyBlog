  <text x="830" y="272" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">比例永远 1 : 2 : 1</text>
  <text x="830" y="292" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">两侧距离对称</text>

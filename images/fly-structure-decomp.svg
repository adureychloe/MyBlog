  <text x="250" y="212" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">买 1 张 1200C</text>
  <circle cx="250" cy="250" r="6" fill="#166534"/>
  <text x="250" y="274" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">1200</text>

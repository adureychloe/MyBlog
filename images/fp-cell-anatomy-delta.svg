<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="480.0" y="32" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">读一根 Footprint K 线：左 Bid × 右 Ask，顶上是总量和 Delta</text>
  <text x="480.0" y="55" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">逐格照抄 ATAS 片中 ~5:15 / ~6:33 那根「72 / −30」K 线 · Delta = Asks − Bids（片中公式）</text>
  <text x="240.0" y="110" font-size="22" fill="#2563eb" text-anchor="middle" font-weight="700">72</text>
  <text x="240.0" y="136" font-size="18" fill="#dc2626" text-anchor="middle" font-weight="700">−30</text>
  <rect x="150" y="150" width="180" height="272" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="173" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">0</text>
  <text x="240.0" y="173" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="173" font-size="15" fill="#166534" text-anchor="start" font-weight="400">1</text>
  <text x="220" y="207" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">1</text>
  <text x="240.0" y="207" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="207" font-size="15" fill="#166534" text-anchor="start" font-weight="400">3</text>
  <text x="220" y="241" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">4</text>
  <text x="240.0" y="241" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="241" font-size="15" fill="#166534" text-anchor="start" font-weight="400">2</text>
  <text x="220" y="275" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">4</text>
  <text x="240.0" y="275" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="275" font-size="15" fill="#166534" text-anchor="start" font-weight="400">4</text>
  <rect x="152" y="288" width="176" height="30" fill="#fef3c7"/>
  <text x="220" y="309" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="700">26</text>
  <text x="240.0" y="309" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="309" font-size="15" fill="#166534" text-anchor="start" font-weight="700">7</text>
  <text x="220" y="343" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">7</text>
  <text x="240.0" y="343" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="343" font-size="15" fill="#166534" text-anchor="start" font-weight="400">2</text>
  <text x="220" y="377" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">5</text>
  <text x="240.0" y="377" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="377" font-size="15" fill="#166534" text-anchor="start" font-weight="400">1</text>
  <text x="220" y="411" font-size="15" fill="#b91c1c" text-anchor="end" font-weight="400">4</text>
  <text x="240.0" y="411" font-size="14" fill="#64748b" text-anchor="middle" font-weight="400">×</text>
  <text x="260" y="411" font-size="15" fill="#166534" text-anchor="start" font-weight="400">1</text>
  <text x="195" y="444" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">Bids</text>
  <text x="285" y="444" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Asks</text>
  <line x1="200" y1="104" x2="175" y2="104" stroke="#2563eb" stroke-width="1.2"/>
  <text x="170" y="108" font-size="11" fill="#2563eb" text-anchor="end" font-weight="400">总成交量（蓝）</text>
  <line x1="205" y1="131" x2="175" y2="131" stroke="#dc2626" stroke-width="1.2"/>
  <text x="170" y="128" font-size="11" fill="#dc2626" text-anchor="end" font-weight="400">Delta</text>
  <text x="170" y="142" font-size="11" fill="#dc2626" text-anchor="end" font-weight="400">（红负/绿正）</text>
  <line x1="335" y1="303" x2="358" y2="303" stroke="#b45309" stroke-width="1.2"/>
  <text x="362" y="293" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">26 × 7：这一价位</text>
  <text x="362" y="311" font-size="11" fill="#b45309" text-anchor="start" font-weight="400">26 手成交在 Bid（主动卖）</text>
  <text x="362" y="327" font-size="11" fill="#b45309" text-anchor="start" font-weight="400">7 手成交在 Ask（主动买）</text>
  <rect x="560" y="90" width="370" height="300" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="745" y="118" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">自己算一遍（数字全来自画面）</text>
  <text x="580" y="150" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="400">Bids 合计 = 0+1+4+4+26+7+5+4 = 51</text>
  <text x="580" y="178" font-size="13" fill="#166534" text-anchor="start" font-weight="400">Asks 合计 = 1+3+2+4+7+2+1+1 = 21</text>
  <text x="580" y="214" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">总量 = 51 + 21 = 72  ✓（烛顶蓝字）</text>
  <text x="580" y="244" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">Delta = Asks − Bids = 21 − 51 = −30  ✓</text>
  <line x1="580" y1="264" x2="910" y2="264" stroke="#e2e8f0" stroke-width="1"/>
  <text x="580" y="290" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700">名词对照：</text>
  <text x="580" y="314" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· Bid 列 = 成交在买价 = 卖方主动砸</text>
  <text x="580" y="336" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· Ask 列 = 成交在卖价 = 买方主动吃</text>
  <text x="580" y="358" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· Delta 可以是正、负或 0（片中 ~6:33）</text>
  <rect x="560" y="405" width="370" height="70" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="745" y="432" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700">同一画面另两根：75 / +3，67 / −9</text>
  <text x="745" y="456" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">Delta 接近 0 = 双方大致打平，不要硬读方向</text>
  <text x="480.0" y="520" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">读格纪律：先看每格左右谁大，再看烛顶 Delta，最后才看颜色——颜色只是这些数字的「皮肤」。</text>
  <text x="480.0" y="544" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">注：不同平台/口径对 Delta 的定义可能略有差异，本文以片中「Delta = Asks − Bids」为准。</text>
</svg>

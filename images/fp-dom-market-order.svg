  <text x="390" y="106" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">Ask 挂单</text>
  <rect x="200" y="120" width="120" height="30" fill="#e2e8f0"/>
  <text x="260" y="140" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">5851.25</text>

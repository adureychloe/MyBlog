  <rect x="200" y="154" width="120" height="30" fill="#e2e8f0"/>
  <text x="260" y="174" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">5851.00</text>
  <rect x="330" y="154" width="120" height="30" fill="#fee2e2"/>
  <text x="390" y="174" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">…</text>
  <rect x="200" y="188" width="120" height="30" fill="#e2e8f0"/>
  <text x="260" y="208" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">5850.75</text>
  <rect x="330" y="188" width="120" height="30" fill="#fee2e2"/>
  <text x="390" y="208" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">…</text>
  <rect x="200" y="222" width="120" height="30" fill="#fde68a"/>
  <text x="260" y="242" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">5850.50</text>
  <rect x="330" y="222" width="120" height="30" fill="#fecaca"/>
  <text x="390" y="242" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">40</text>
  <rect x="200" y="256" width="120" height="30" fill="#e2e8f0"/>
  <text x="260" y="276" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">5850.25</text>
  <rect x="330" y="256" width="120" height="30" fill="#fee2e2"/>
  <text x="390" y="276" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="400">…</text>
  <rect x="200" y="290" width="120" height="30" fill="#e2e8f0"/>
  <text x="260" y="310" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">5850.00</text>
  <rect x="70" y="290" width="120" height="30" fill="#dcfce7"/>
  <text x="130" y="310" font-size="12" fill="#166534" text-anchor="middle" font-weight="400">…</text>
  <rect x="200" y="324" width="120" height="30" fill="#e2e8f0"/>
  <text x="260" y="344" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="400">5849.75</text>
  <rect x="70" y="324" width="120" height="30" fill="#dcfce7"/>

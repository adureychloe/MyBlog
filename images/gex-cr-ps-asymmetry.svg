<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">GEX 不对称：Call Resistance 减速 · Put Support 加速</text>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">启发式场景图，非方向圣杯 · 对照画面 Asymmetry ~36:36</text>

  <rect x="40" y="75" width="440" height="310" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="260" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">正 Gamma 区</text>
  <text x="260" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">对冲倾向阻尼波动</text>
  <!-- slowing curve toward CR -->
  <path d="M80,320 Q200,280 320,200 T420,140" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <line x1="420" y1="100" x2="420" y2="340" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b45309">Call Resistance</text>
  <text x="260" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">靠近 CR → 常「减速」</text>

  <rect x="500" y="75" width="420" height="310" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="710" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#991b1b">负 Gamma 区</text>
  <text x="710" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">对冲倾向放大波动</text>
  <path d="M540,140 Q600,180 660,240 T800,340" fill="none" stroke="#ef4444" stroke-width="3"/>
  <line x1="800" y1="100" x2="800" y2="350" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="95" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">Put Support</text>
  <text x="710" y="360" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">靠近 PS → 常「加速」风险</text>

  <text x="480" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">先分清正/负 gamma 区，再读墙 · 仓位在负 gamma 近 PS 时更谨慎</text>
</svg>

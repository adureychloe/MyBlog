<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">平均 K 线是「平均过」的 K 线，不是真实成交价</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="40" y="80" width="440" height="380" rx="10" fill="#fff" stroke="#999" stroke-width="2"/><rect x="520" y="80" width="440" height="380" rx="10" fill="#fff" stroke="#999" stroke-width="2"/><text x="260" y="115" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">普通 K 线（真实价格）</text><text x="740" y="115" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">平均 K 线 Heikin Ashi</text><line x1="81.0" y1="330" x2="81.0" y2="420" stroke="#26a69a" stroke-width="2"/><rect x="70" y="360" width="22" height="40" fill="#26a69a"/><line x1="125.0" y1="340" x2="125.0" y2="400" stroke="#ef5350" stroke-width="2"/><rect x="114" y="360" width="22" height="20" fill="#ef5350"/><line x1="169.0" y1="300" x2="169.0" y2="390" stroke="#26a69a" stroke-width="2"/><rect x="158" y="320" width="22" height="60" fill="#26a69a"/><line x1="213.0" y1="290" x2="213.0" y2="360" stroke="#ef5350" stroke-width="2"/><rect x="202" y="320" width="22" height="25" fill="#ef5350"/><line x1="257.0" y1="260" x2="257.0" y2="355" stroke="#26a69a" stroke-width="2"/><rect x="246" y="280" width="22" height="65" fill="#26a69a"/><line x1="301.0" y1="270" x2="301.0" y2="330" stroke="#ef5350" stroke-width="2"/><rect x="290" y="300" width="22" height="20" fill="#ef5350"/><line x1="345.0" y1="230" x2="345.0" y2="330" stroke="#26a69a" stroke-width="2"/><rect x="334" y="250" width="22" height="70" fill="#26a69a"/><line x1="389.0" y1="240" x2="389.0" y2="290" stroke="#ef5350" stroke-width="2"/><rect x="378" y="250" width="22" height="20" fill="#ef5350"/><line x1="433.0" y1="190" x2="433.0" y2="280" stroke="#26a69a" stroke-width="2"/><rect x="422" y="210" width="22" height="60" fill="#26a69a"/><line x1="561.0" y1="350" x2="561.0" y2="400" stroke="#26a69a" stroke-width="2"/><rect x="550" y="365" width="22" height="25" fill="#26a69a"/><line x1="605.0" y1="330" x2="605.0" y2="385" stroke="#26a69a" stroke-width="2"/><rect x="594" y="350" width="22" height="22" fill="#26a69a"/><line x1="649.0" y1="315" x2="649.0" y2="360" stroke="#26a69a" stroke-width="2"/><rect x="638" y="330" width="22" height="28" fill="#26a69a"/><line x1="693.0" y1="298" x2="693.0" y2="342" stroke="#26a69a" stroke-width="2"/><rect x="682" y="312" width="22" height="30" fill="#26a69a"/><line x1="737.0" y1="278" x2="737.0" y2="326" stroke="#26a69a" stroke-width="2"/><rect x="726" y="292" width="22" height="34" fill="#26a69a"/><line x1="781.0" y1="268" x2="781.0" y2="309" stroke="#26a69a" stroke-width="2"/><rect x="770" y="280" width="22" height="29" fill="#26a69a"/><line x1="825.0" y1="248" x2="825.0" y2="295" stroke="#26a69a" stroke-width="2"/><rect x="814" y="262" width="22" height="33" fill="#26a69a"/><line x1="869.0" y1="238" x2="869.0" y2="279" stroke="#26a69a" stroke-width="2"/><rect x="858" y="250" width="22" height="29" fill="#26a69a"/><line x1="913.0" y1="220" x2="913.0" y2="265" stroke="#26a69a" stroke-width="2"/><rect x="902" y="232" width="22" height="33" fill="#26a69a"/><text x="260" y="445" font-size="17" fill="#555" text-anchor="middle" font-weight="normal">红绿交替、回调看着吓人</text><text x="740" y="445" font-size="17" fill="#555" text-anchor="middle" font-weight="normal">颜色连贯、趋势一眼可见</text><rect x="40" y="480" width="440" height="190" rx="10" fill="#fff5f5" stroke="#ef5350" stroke-width="2"/><text x="60" y="515" font-size="18" fill="#ef5350" text-anchor="start" font-weight="bold">片中原话要点（04/05 帧）</text><text x="60" y="550" font-size="18" fill="#222" text-anchor="start" font-weight="normal">• 「Heikin Ashi 并不是真实价格」</text><text x="60" y="582" font-size="18" fill="#222" text-anchor="start" font-weight="normal">• 要同时看真实 K 线，不只看 HA</text><text x="60" y="614" font-size="18" fill="#222" text-anchor="start" font-weight="normal">• 作用：找到 K 线的「平均值」</text><text x="60" y="650" font-size="14" fill="#888" text-anchor="start" font-weight="normal">示意图，K 线形状为示例，非片中数据</text><rect x="520" y="480" width="440" height="190" rx="10" fill="#fff8ee" stroke="#f39c12" stroke-width="2" stroke-dasharray="8 5"/><text x="540" y="515" font-size="18" fill="#f39c12" text-anchor="start" font-weight="bold">（笔者补充）TradingView 文档公式</text><text x="540" y="548" font-size="17" fill="#222" text-anchor="start" font-weight="normal">HA收 = (开+高+低+收) ÷ 4</text><text x="540" y="578" font-size="17" fill="#222" text-anchor="start" font-weight="normal">HA开 = (上一根HA开 + 上一根HA收) ÷ 2</text><text x="540" y="608" font-size="17" fill="#222" text-anchor="start" font-weight="normal">HA高 = max(高, HA开, HA收)</text><text x="540" y="638" font-size="17" fill="#222" text-anchor="start" font-weight="normal">HA低 = min(低, HA开, HA收)</text></svg>
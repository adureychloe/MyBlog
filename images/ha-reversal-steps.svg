<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">HA 反转确认：十字星 + 两根反向 K 线</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><line x1="95.0" y1="110" x2="95.0" y2="200" stroke="#ef5350" stroke-width="2"/><rect x="80" y="120" width="30" height="70" fill="#ef5350"/><line x1="145.0" y1="180" x2="145.0" y2="275" stroke="#ef5350" stroke-width="2"/><rect x="130" y="190" width="30" height="70" fill="#ef5350"/><line x1="195.0" y1="250" x2="195.0" y2="335" stroke="#ef5350" stroke-width="2"/><rect x="180" y="260" width="30" height="60" fill="#ef5350"/><line x1="245.0" y1="290" x2="245.0" y2="365" stroke="#ef5350" stroke-width="2"/><rect x="230" y="322" width="30" height="6" fill="#ef5350"/><line x1="295.0" y1="250" x2="295.0" y2="335" stroke="#26a69a" stroke-width="2"/><rect x="280" y="290" width="30" height="40" fill="#26a69a"/><line x1="345.0" y1="205" x2="345.0" y2="292" stroke="#26a69a" stroke-width="2"/><rect x="330" y="240" width="30" height="52" fill="#26a69a"/><text x="215" y="390" font-size="16" fill="#f39c12" text-anchor="middle" font-weight="bold">十字星</text><text x="295" y="390" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">1</text><text x="345" y="390" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">2</text><text x="230" y="420" font-size="16" fill="#222" text-anchor="middle" font-weight="normal">下跌 → 十字星 → 两根绿 K（只有上影线）</text><text x="230" y="445" font-size="14" fill="#888" text-anchor="middle" font-weight="normal">示意形状，对应片中 17–19 帧</text><rect x="500" y="80" width="460" height="95" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="520" y="113" font-size="20" fill="#222" text-anchor="start" font-weight="bold">① 先有一段明显趋势</text><text x="520" y="145" font-size="16" fill="#444" text-anchor="start" font-weight="normal">下跌例：连续红 K（17 帧）</text><line x1="730" y1="177" x2="730" y2="189" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="500" y="200" width="460" height="95" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="520" y="233" font-size="20" fill="#222" text-anchor="start" font-weight="bold">② 出现十字星</text><text x="520" y="265" font-size="16" fill="#444" text-anchor="start" font-weight="normal">两侧都有影线的小实体（15 帧）</text><line x1="730" y1="297" x2="730" y2="309" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="500" y="320" width="460" height="95" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="520" y="353" font-size="20" fill="#222" text-anchor="start" font-weight="bold">③ 等两根反方向 K 线</text><text x="520" y="385" font-size="16" fill="#444" text-anchor="start" font-weight="normal">片中标 1、2（16 帧）</text><line x1="730" y1="417" x2="730" y2="429" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="500" y="440" width="460" height="110" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="520" y="473" font-size="20" fill="#222" text-anchor="start" font-weight="bold">④ 影线只在新方向一侧</text><text x="520" y="505" font-size="16" fill="#444" text-anchor="start" font-weight="normal">反转向上：只有上影线（19 帧）</text><text x="520" y="533" font-size="16" fill="#444" text-anchor="start" font-weight="normal">反转向下：只有下影线（21 帧）</text><rect x="40" y="500" width="420" height="170" rx="10" fill="#fff8ee" stroke="#f39c12" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="535" font-size="18" fill="#f39c12" text-anchor="start" font-weight="bold">（笔者补充）注意</text><text x="60" y="568" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 等两根确认，入场离底部已有距离 → 滞后</text><text x="60" y="598" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 盘整里十字星成串出现，容易反复假信号</text><text x="60" y="628" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 片中没讲止损止盈，规则不能直接照做</text></svg>
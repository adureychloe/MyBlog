<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">HA + Stochastic 组合做多：四步流程（片中示例）</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="40" y="90" width="210" height="150" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="145" y="125" font-size="18" fill="#1e66d0" text-anchor="middle" font-weight="bold">第 1 步</text><text x="145" y="165" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Stochastic 在</text><text x="145" y="190" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">下边界下方交叉</text><text x="145" y="222" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">且有下行动能（28/29 帧）</text><line x1="252" y1="165" x2="278" y2="165" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="280" y="90" width="210" height="150" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="385" y="125" font-size="18" fill="#1e66d0" text-anchor="middle" font-weight="bold">第 2 步</text><text x="385" y="165" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">下行趋势变得很弱</text><text x="385" y="222" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">然后等十字星出现（30 帧）</text><line x1="492" y1="165" x2="518" y2="165" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="520" y="90" width="210" height="150" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="625" y="125" font-size="18" fill="#1e66d0" text-anchor="middle" font-weight="bold">第 3 步</text><text x="625" y="165" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">等两根大的</text><text x="625" y="190" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">绿色 HA K 线</text><text x="625" y="222" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">顶部只有影线（31/32 帧）</text><line x1="732" y1="165" x2="758" y2="165" stroke="#555" stroke-width="3" marker-end="url(#a)"/><rect x="760" y="90" width="210" height="150" rx="10" fill="#f2f7ff" stroke="#1e66d0" stroke-width="2"/><text x="865" y="125" font-size="18" fill="#1e66d0" text-anchor="middle" font-weight="bold">第 4 步</text><text x="865" y="165" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">入场做多</text><text x="865" y="222" font-size="14" fill="#555" text-anchor="middle" font-weight="normal">空单则全部镜像</text><rect x="40" y="270" width="430" height="180" rx="10" fill="#fff5f5" stroke="#ef5350" stroke-width="2"/><text x="60" y="305" font-size="18" fill="#ef5350" text-anchor="start" font-weight="bold">片中原话 / 画面</text><text x="60" y="340" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 三窗格：价格 / HA / Stochastic（22 帧）</text><text x="60" y="370" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 「和多数指标一样，这个指标本身</text><text x="60" y="398" font-size="16" fill="#222" text-anchor="start" font-weight="normal">   单独使用并不是很好」（25 帧）</text><text x="60" y="430" font-size="16" fill="#888" text-anchor="start" font-weight="normal">• 参数标签画面太糊，本文不写具体数字</text><rect x="510" y="270" width="450" height="180" rx="10" fill="#fff8ee" stroke="#f39c12" stroke-width="2" stroke-dasharray="8 5"/><text x="530" y="305" font-size="18" fill="#f39c12" text-anchor="start" font-weight="bold">（笔者补充）片中没给的东西</text><text x="530" y="340" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 止损：可考虑真实 K 线的近期低点下方</text><text x="530" y="370" font-size="16" fill="#888" text-anchor="start" font-weight="normal">  （未回测，不是片中内容）</text><text x="530" y="400" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 止盈、胜率、适用周期：片中都没有</text><text x="530" y="430" font-size="16" fill="#222" text-anchor="start" font-weight="normal">• 先在 TradingView 回放里验证再说</text><rect x="40" y="480" width="920" height="180" rx="10" fill="#fff" stroke="#999" stroke-width="2"/><text x="60" y="515" font-size="18" fill="#222" text-anchor="start" font-weight="bold">一句话记住（笔者补充）</text><text x="60" y="555" font-size="18" fill="#222" text-anchor="start" font-weight="normal">Stochastic 负责「跌够了没有」，HA 负责「趋势真的掉头了没有」。</text><text x="60" y="595" font-size="18" fill="#222" text-anchor="start" font-weight="normal">两个都满足才考虑行动；下单、止损的价位一律看真实 K 线，不看 HA 价位。</text><text x="60" y="635" font-size="14" fill="#888" text-anchor="start" font-weight="normal">（笔者的归纳，依据片中「HA 不是真实价格」「Stochastic 单独用不好」）</text></svg>
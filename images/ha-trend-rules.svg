<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="700" fill="#fbfaf7"/>
<text x="500" y="46" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">读 HA 趋势：看颜色 + 实体大小 + 影线在哪一侧</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect x="30" y="80" width="290" height="590" rx="10" fill="#fff" stroke="#1b8a7f" stroke-width="2"/><text x="175" y="115" font-size="20" fill="#1b8a7f" text-anchor="middle" font-weight="bold">✅ 强上涨</text><line x1="73.0" y1="335" x2="73.0" y2="400" stroke="#26a69a" stroke-width="2"/><rect x="60" y="350" width="26" height="50" fill="#26a69a"/><line x1="113.0" y1="285" x2="113.0" y2="352" stroke="#26a69a" stroke-width="2"/><rect x="100" y="300" width="26" height="52" fill="#26a69a"/><line x1="153.0" y1="240" x2="153.0" y2="302" stroke="#26a69a" stroke-width="2"/><rect x="140" y="255" width="26" height="47" fill="#26a69a"/><line x1="193.0" y1="195" x2="193.0" y2="257" stroke="#26a69a" stroke-width="2"/><rect x="180" y="210" width="26" height="47" fill="#26a69a"/><line x1="233.0" y1="155" x2="233.0" y2="212" stroke="#26a69a" stroke-width="2"/><rect x="220" y="170" width="26" height="42" fill="#26a69a"/><line x1="273.0" y1="125" x2="273.0" y2="172" stroke="#26a69a" stroke-width="2"/><rect x="260" y="140" width="26" height="32" fill="#26a69a"/><text x="175" y="480" font-size="20" fill="#1b8a7f" text-anchor="middle" font-weight="bold">绿 + 大实体 + 无下影线</text><text x="50" y="515" font-size="16" fill="#222" text-anchor="start" font-weight="normal">影线只在上方</text><text x="50" y="545" font-size="16" fill="#222" text-anchor="start" font-weight="normal">片中例：一串连续绿 K（12 帧）</text><text x="50" y="575" font-size="16" fill="#222" text-anchor="start" font-weight="normal">持仓时少被小回调吓出场</text><rect x="355" y="80" width="290" height="590" rx="10" fill="#fff" stroke="#ef5350" stroke-width="2"/><text x="500" y="115" font-size="20" fill="#ef5350" text-anchor="middle" font-weight="bold">✅ 强下跌</text><line x1="398.0" y1="150" x2="398.0" y2="215" stroke="#ef5350" stroke-width="2"/><rect x="385" y="150" width="26" height="50" fill="#ef5350"/><line x1="438.0" y1="200" x2="438.0" y2="265" stroke="#ef5350" stroke-width="2"/><rect x="425" y="200" width="26" height="50" fill="#ef5350"/><line x1="478.0" y1="250" x2="478.0" y2="315" stroke="#ef5350" stroke-width="2"/><rect x="465" y="250" width="26" height="50" fill="#ef5350"/><line x1="518.0" y1="300" x2="518.0" y2="365" stroke="#ef5350" stroke-width="2"/><rect x="505" y="300" width="26" height="50" fill="#ef5350"/><line x1="558.0" y1="350" x2="558.0" y2="410" stroke="#ef5350" stroke-width="2"/><rect x="545" y="350" width="26" height="45" fill="#ef5350"/><line x1="598.0" y1="395" x2="598.0" y2="445" stroke="#ef5350" stroke-width="2"/><rect x="585" y="395" width="26" height="35" fill="#ef5350"/><text x="500" y="480" font-size="20" fill="#ef5350" text-anchor="middle" font-weight="bold">红 + 大实体 + 无上影线</text><text x="375" y="515" font-size="16" fill="#222" text-anchor="start" font-weight="normal">影线只在下方</text><text x="375" y="545" font-size="16" fill="#222" text-anchor="start" font-weight="normal">片中：「所有 K 线必须是红色」</text><text x="375" y="575" font-size="16" fill="#222" text-anchor="start" font-weight="normal">且有较大实体（13 帧）</text><rect x="680" y="80" width="290" height="590" rx="10" fill="#fff" stroke="#f39c12" stroke-width="2" stroke-dasharray="8 5"/><text x="825" y="115" font-size="20" fill="#f39c12" text-anchor="middle" font-weight="bold">⚠ 反例：盘整（笔者补充）</text><line x1="723.0" y1="240" x2="723.0" y2="330" stroke="#26a69a" stroke-width="2"/><rect x="710" y="260" width="26" height="40" fill="#26a69a"/><line x1="763.0" y1="230" x2="763.0" y2="320" stroke="#ef5350" stroke-width="2"/><rect x="750" y="262" width="26" height="28" fill="#ef5350"/><line x1="803.0" y1="225" x2="803.0" y2="330" stroke="#26a69a" stroke-width="2"/><rect x="790" y="250" width="26" height="40" fill="#26a69a"/><line x1="843.0" y1="235" x2="843.0" y2="315" stroke="#ef5350" stroke-width="2"/><rect x="830" y="252" width="26" height="33" fill="#ef5350"/><line x1="883.0" y1="230" x2="883.0" y2="330" stroke="#26a69a" stroke-width="2"/><rect x="870" y="255" width="26" height="30" fill="#26a69a"/><line x1="923.0" y1="240" x2="923.0" y2="320" stroke="#ef5350" stroke-width="2"/><rect x="910" y="257" width="26" height="23" fill="#ef5350"/><text x="825" y="480" font-size="20" fill="#f39c12" text-anchor="middle" font-weight="bold">颜色乱翻、上下都有影线</text><text x="700" y="515" font-size="16" fill="#222" text-anchor="start" font-weight="normal">趋势规则不成立</text><text x="700" y="545" font-size="16" fill="#222" text-anchor="start" font-weight="normal">此时 HA 信号容易反复打脸</text><text x="700" y="575" font-size="16" fill="#222" text-anchor="start" font-weight="normal">示例形状，非片中画面</text></svg>
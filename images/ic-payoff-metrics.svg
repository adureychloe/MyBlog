<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">IC 要一起看：PoP · MaxP/MaxL · EV · 止盈</text>
  <text x="480" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">平台演示快照数字 · 勿当当前报价 · SPY/TLT/XBI 来自画面</text>

  <!-- payoff sketch -->
  <rect x="40" y="70" width="500" height="240" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="290" y="98" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f172a">教学盈亏形状（示意）</text>
  <polyline points="70,250 140,250 180,120 400,120 440,250 510,250" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <line x1="70" y1="200" x2="510" y2="200" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="290" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">两短期权之间 = MaxP 区</text>
  <text x="100" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">穿翼→MaxL</text>
  <text x="480" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#991b1b">穿翼→MaxL</text>

  <rect x="560" y="70" width="360" height="240" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="740" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">画面例（节选）</text>
  <text x="580" y="130" font-family="system-ui,sans-serif" font-size="12" fill="#334155">教学：MaxP $200 / MaxL −$300</text>
  <text x="580" y="155" font-family="system-ui,sans-serif" font-size="12" fill="#334155">SPY 窄翼：MaxP $88 / MaxL −$112</text>
  <text x="580" y="180" font-family="system-ui,sans-serif" font-size="12" fill="#334155">　　PoP 38% · EV 可偏负</text>
  <text x="580" y="205" font-family="system-ui,sans-serif" font-size="12" fill="#334155">TLT：PoP 63% · MaxL $361</text>
  <text x="580" y="230" font-family="system-ui,sans-serif" font-size="12" fill="#334155">XBI 平仓：credit $1.09→$0.65</text>
  <text x="580" y="255" font-family="system-ui,sans-serif" font-size="12" fill="#166534">约 40% 止盈目标例</text>
  <text x="580" y="285" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">翼变宽 → 信用与 MaxL 常同升</text>

  <rect x="40" y="330" width="880" height="100" rx="12" fill="#fefce8" stroke="#fde047"/>
  <text x="480" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#854d0e">高 PoP ≠ 好交易</text>
  <text x="480" y="395" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">PoP 必须与 MaxL / EV / Reward-Risk 同屏看 · 弃用「只看胜率」</text>
</svg>

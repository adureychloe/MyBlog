<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Iron Condor vs Short Strangle：定义风险 vs 未定义</text>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">教学对照 · Option Alpha ~4:00 / ~4:20</text>

  <rect x="40" y="75" width="440" height="310" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="260" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#166534">Iron Condor（有保护翼）</text>
  <text x="260" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">空头 Put 垂直 + 空头 Call 垂直</text>
  <text x="260" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">教学例行权：90 / 95 / 105 / 110</text>
  <rect x="90" y="195" width="340" height="120" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="260" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#166534">Max Profit ≈ $200</text>
  <text x="260" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#991b1b">Max Loss ≈ −$300</text>
  <text x="260" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">BE ≈ $93 / $107</text>
  <text x="260" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#166534">风险有上限 · 定义风险</text>

  <rect x="500" y="75" width="420" height="310" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="710" y="110" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#991b1b">Short Strangle（无翼）</text>
  <text x="710" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">只卖 Put + 卖 Call</text>
  <rect x="550" y="175" width="320" height="120" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="710" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#166534">信用更高（例约 $500）</text>
  <text x="710" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">BE≈90 / 110</text>
  <text x="710" y="275" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">最大亏损未定义</text>
  <text x="710" y="350" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">弃用：为冲信用去裸卖</text>

  <text x="480" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">自检：两侧有没有长翼保护？没有就不是 IC</text>
</svg>

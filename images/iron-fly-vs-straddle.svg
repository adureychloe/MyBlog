<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" font-family="Arial, sans-serif" font-size="12">
  <rect width="680" height="280" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold">Iron Fly vs Short Straddle（白板对比板 · 10/21/15）</text>
  <rect x="40" y="50" width="280" height="180" fill="#fff" stroke="#00838f" stroke-width="2" rx="6"/>
  <text x="180" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#00838f">Iron Fly</text>
  <text x="60" y="108" font-size="12">利润：更靠近到期才兑现</text>
  <text x="60" y="132" font-size="12">ROC <tspan fill="#2e7d32" font-weight="bold">↑</tspan>　POP <tspan fill="#c62828" font-weight="bold">↓</tspan></text>
  <text x="60" y="156" font-size="12" font-weight="bold" fill="#2e7d32">Defined Risk（有两翼）</text>
  <text x="60" y="180" font-size="11" fill="#555">净贷记更少 → BE 更靠中间</text>
  <text x="60" y="204" font-size="11" fill="#555">LOWER RISK = LOWER CREDIT</text>
  <rect x="360" y="50" width="280" height="180" fill="#fff" stroke="#c62828" stroke-width="2" rx="6"/>
  <text x="500" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Short Straddle</text>
  <text x="380" y="108" font-size="12">利润：可较快兑现</text>
  <text x="380" y="132" font-size="12">ROC <tspan fill="#c62828" font-weight="bold">↓</tspan>　POP <tspan fill="#2e7d32" font-weight="bold">↑</tspan></text>
  <text x="380" y="156" font-size="12" font-weight="bold" fill="#c62828">Undefined Risk（无翼）</text>
  <text x="380" y="180" font-size="11" fill="#555">权利金更高，两边都不封顶</text>
  <text x="380" y="204" font-size="11" fill="#555">去掉 75P / 85C = 裸短跨式</text>
  <text x="340" y="260" text-anchor="middle" font-size="10" fill="#777">对照 11-vs-straddle-full-0845.png · 仅供学习，不构成投资建议</text>
</svg>

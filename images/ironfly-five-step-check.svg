<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 624" width="820" height="624">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fb8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Source Han Sans SC',sans-serif;fill:#222} .t{font-size:22px;font-weight:700} .st{font-size:14px;fill:#2a7fb8} .s{font-size:13px} .m{font-size:15px} .b{font-weight:700} .red{fill:#c62828} .grn{fill:#2e7d32} .blu{fill:#2a7fb8} .org{fill:#b35c00} .gry{fill:#666} .wht{fill:#fff}</style>
<rect width="820" height="624" fill="#ffffff"/>
<text x="24" y="38" class="t">开一笔 Iron Fly 前的 5 步检查（按白板例）</text>
<text x="24" y="62" class="st">例：75 / 80 / 80 / 85，$0.60 / $3.50 / $0.40（教学价，2015）</text>
<rect x="60" y="80" width="700" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="72" y="104" class="m" text-anchor="start">① 选中间</text>
<text x="72" y="128" class="m" text-anchor="start">在现价 80 同价卖出 put + call，收 $3.50（1:28）</text>
<line x1="410" y1="144" x2="410" y2="164" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="166" width="700" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="72" y="190" class="m" text-anchor="start">② 装两翼</text>
<text x="72" y="214" class="m" text-anchor="start">买更虚值的 75 put（$0.60）和 85 call（$0.40）</text>
<line x1="410" y1="230" x2="410" y2="250" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="252" width="700" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="72" y="276" class="m" text-anchor="start">③ 算净贷记</text>
<text x="72" y="300" class="m" text-anchor="start">3.50 − 0.60 − 0.40 = $2.50 CR ✔（白板）</text>
<line x1="410" y1="316" x2="410" y2="336" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="338" width="700" height="64" rx="8" fill="#fff7ee" stroke="#f28c28" stroke-width="2" stroke-dasharray="7 4"/>
<text x="72" y="362" class="m org" text-anchor="start">④ 算边界（推算）</text>
<text x="72" y="386" class="m org" text-anchor="start">BE 77.50 / 82.50；最大亏损 $2.50/股；白板上都没写</text>
<line x1="410" y1="402" x2="410" y2="422" stroke="#2a7fb8" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="424" width="700" height="64" rx="8" fill="#f5f9fc" stroke="#2a7fb8" stroke-width="1.5"/>
<text x="72" y="448" class="m" text-anchor="start">⑤ 想清楚管理</text>
<text x="72" y="472" class="m" text-anchor="start">片中只说利润「更靠近到期才兑现」；没有止盈% / DTE / Delta 规则</text>
<rect x="60" y="512" width="700" height="74" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="72" y="536" class="s" text-anchor="start">口播旁证（CC，非白板数字）：put 一般比 call 贵（skew，1:46）；</text>
<text x="72" y="556" class="s" text-anchor="start">股价到 81、短 call 在 80 → 合约有 $2 内在价值（5:05）。</text>
<text x="72" y="576" class="s" text-anchor="start">ASR 把 butterfly 听成「beef and」（0:22），以白板为准。</text>
<text x="804" y="612" text-anchor="end" class="s gry">仅供学习，不构成投资建议</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fb8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Source Han Sans SC',sans-serif;fill:#222} .t{font-size:22px;font-weight:700} .st{font-size:14px;fill:#2a7fb8} .s{font-size:13px} .m{font-size:15px} .b{font-weight:700} .red{fill:#c62828} .grn{fill:#2e7d32} .blu{fill:#2a7fb8} .org{fill:#b35c00} .gry{fill:#666} .wht{fill:#fff}</style>
<rect width="820" height="560" fill="#ffffff"/>
<text x="24" y="38" class="t">正例 vs 反例：Iron Fly 对比裸卖跨式（Straddle）</text>
<text x="24" y="62" class="st">白板：IRON FLY VS STRADDLE（7:45–10:58）</text>
<rect x="40" y="84" width="350" height="250" rx="10" fill="#f1f8f1" stroke="#2e7d32" stroke-width="1.5"/>
<text x="215" y="114" class="m b" text-anchor="middle">IRON FLY（有两翼）</text>
<text x="60" y="150" class="m" text-anchor="start">Profits realized closer to expiration</text>
<text x="60" y="172" class="s gry" text-anchor="start">利润更靠近到期才兑现</text>
<text x="60" y="208" class="m" text-anchor="start">ROC ↑（资本回报更高）</text>
<text x="60" y="244" class="m" text-anchor="start">POP ↓（胜率更低）</text>
<text x="60" y="280" class="m" text-anchor="start">Defined Risk 定义风险</text>
<rect x="430" y="84" width="350" height="250" rx="10" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
<text x="605" y="114" class="m b" text-anchor="middle">STRADDLE（短跨式，无翼）</text>
<text x="450" y="150" class="m" text-anchor="start">Profits can be realized quickly</text>
<text x="450" y="172" class="s gry" text-anchor="start">利润可较快兑现</text>
<text x="450" y="208" class="m" text-anchor="start">ROC ↓</text>
<text x="450" y="244" class="m" text-anchor="start">POP ↑</text>
<text x="450" y="280" class="m" text-anchor="start">Undefined Risk 未定义风险</text>
<text x="400" y="214" class="t blu" text-anchor="middle">VS</text>
<rect x="40" y="348" width="350" height="74" rx="8" fill="#f1f8f1" stroke="#2e7d32" stroke-width="1.5"/>
<text x="52" y="372" class="s" text-anchor="start">收的钱（白板）：净 $2.50 CR</text>
<text x="52" y="392" class="s" text-anchor="start">口播：股价涨到 90 也仍是 defined risk</text>
<text x="52" y="412" class="s" text-anchor="start">——因为买了 85 call（6:45）</text>
<rect x="430" y="348" width="350" height="74" rx="8" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
<text x="442" y="372" class="s" text-anchor="start">收的钱（白板）：80 同价卖 put + call = $3.50</text>
<text x="442" y="392" class="s" text-anchor="start">多收的钱 = 少了两翼保护</text>
<rect x="40" y="436" width="740" height="84" rx="8" fill="#fff7ee" stroke="#f28c28" stroke-width="2" stroke-dasharray="7 4"/>
<text x="52" y="460" class="s org" text-anchor="start">（笔者补充）裸跨式涨到 90：短 80 call 没有 85 call 保护，越涨亏越多；跌也同理。</text>
<text x="52" y="479" class="s org" text-anchor="start">（笔者补充）ROC ↑：定义风险占用的资金通常更少；POP ↓：净贷记更少，盈亏平衡往中间收。</text>
<text x="52" y="498" class="s org" text-anchor="start">片中只给了箭头方向，没有任何平台 POP / ROC 数字。</text>
<text x="804" y="548" text-anchor="end" class="s gry">仅供学习，不构成投资建议</text>
</svg>

  <text x="90.0" y="440.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">读法：第一个到期只剩 3 天，IV 31.6；第二个就掉到 22.9；中段最低约 19.0；远端回到约 22.8。</text>
  <text x="90.0" y="461.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">4:37 字幕在讲「correction going on or anything like that the possible reason for the high…」，作者最后给的原因没截到。</text>
  <text x="90.0" y="482.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">同一天同一标的，前端「恐慌」、后段「正常」可以同时存在——看形状要看整条线，不只看两端。</text>

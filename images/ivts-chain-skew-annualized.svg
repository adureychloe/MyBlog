  <text x="560.0" y="412.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">卖 put 要承担被行权 / 标的大跌的风险，</text>
  <text x="560.0" y="432.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">一年里也不可能每 3 天都原样复制一次。</text>

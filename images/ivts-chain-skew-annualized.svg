  <text x="570.0" y="240.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">① 190 put Bid 0.90 ÷ 现价 193.12 ≈ 0.466% ≈ 0.47%</text>
  <text x="570.0" y="262.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">② 一年里有几个 3 天：365 ÷ 3 = 121.6667</text>
  <text x="570.0" y="284.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">③ 0.466% × 121.6667 ≈ 56.70%</text>

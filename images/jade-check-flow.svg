<svg xmlns="http://www.w3.org/2000/svg" width="800" height="448" viewBox="0 0 800 448" font-family="sans-serif" font-size="14"><rect width="800" height="448" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">步骤：开 Jade Lizard 前的两道算术</text><rect x="60" y="50" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="75" font-weight="bold">① 定结构</text><text x="80" y="98" font-size="12">现价下方卖 put；现价上方卖 call、再往上买 call（同一到期）</text><path d="M400 112 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 122 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="132" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="157" font-weight="bold">② 校验：总贷记 ＞ call 价差宽度</text><text x="80" y="180" font-size="12">例 0.71 + 0.32 = 1.03 ＞ 96 − 95 = 1.00 → 上方无风险才成立</text><path d="M400 194 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 204 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="214" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="239" font-weight="bold">③ 算下方 BE = put 行权价 − 总贷记</text><text x="80" y="262" font-size="12">例 80 − 1.03 = 78.97（推算，白板未写）</text><path d="M400 276 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 286 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="296" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="321" font-weight="bold">④ 按「被指派接货」评估下方</text><text x="80" y="344" font-size="12">裸 put 的保证金、跌穿后的接货成本——片中未讲管理规则</text><rect x="60" y="378" width="680" height="50" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="80" y="408" fill="#b35c00" font-size="12">（笔者补充）贷记不够宽度时上方仍有风险；70/30 与「&lt;$75」是经验规则，列为观望</text></svg>
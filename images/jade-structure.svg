<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" font-family="sans-serif" font-size="14"><rect width="800" height="390" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">概念：Jade Lizard = 卖 put + 虚值 call 价差（tastylive 白板例）</text><line x1="60" y1="150" x2="740" y2="150" stroke="#333" stroke-width="2"/><circle cx="150" cy="150" r="9" fill="#c0392b"/><text x="138" y="130" font-weight="bold">80</text><text x="128" y="180" >卖 put</text><circle cx="330" cy="150" r="9" fill="#4a6fa5"/><text x="318" y="130" font-weight="bold">90</text><text x="308" y="180" >现价</text><circle cx="480" cy="150" r="9" fill="#c0392b"/><text x="468" y="130" font-weight="bold">95</text><text x="458" y="180" >卖 call</text><circle cx="560" cy="150" r="9" fill="#27ae60"/><text x="548" y="130" font-weight="bold">96</text><text x="538" y="180" >买 call</text><text x="130" y="210" fill="#c0392b" font-weight="bold">+$0.71</text><text x="470" y="210" fill="#c0392b" font-weight="bold">95/96 价差净收 0.32</text><rect x="250" y="230" width="300" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="270" y="262" font-weight="bold">总贷记 $1.03 ＞ 宽度 $1.00</text><text x="60" y="310" font-size="12">白板：SHORT PUT + OTM CALL SPREAD；配比约 SHORT PUT 70% CR / CALL SPREAD 30% CR（2015 录制教学例）</text><rect x="60" y="325" width="680" height="45" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="75" y="353" fill="#b35c00" font-size="13">（推算）0.71/1.03≈68.9%、0.32/1.03≈31.1%；0.32 为整个价差净收入（两腿单价片中未给）</text></svg>
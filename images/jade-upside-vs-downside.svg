<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="sans-serif" font-size="14"><rect width="800" height="320" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">正例 vs 反例：上方封住了，下方没有</text><rect x="40" y="50" width="340" height="220" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/><text x="60" y="80" font-weight="bold">上方（白板写了）</text><text x="60" y="110" >NO RISK TO THE UPSIDE</text><text x="60" y="138" font-size="13">到期若 ITM，call 价差最多值 $1.00</text><text x="60" y="162" font-size="13">但我们收了 $1.03</text><rect x="55" y="180" width="310" height="75" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="65" y="205" fill="#b35c00" font-size="12">（推算）到期 100：put 作废 +0.71，</text><text x="65" y="225" fill="#b35c00" font-size="12">价差亏 1.00 → 合计 +$0.03/股</text><text x="65" y="245" fill="#b35c00" font-size="12">（≈ $3/组）</text><rect x="420" y="50" width="340" height="220" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="440" y="80" font-weight="bold" fill="#c0392b">下方（真实风险！）</text><text x="440" y="110" font-size="13">口播：会被以 80 指派买股，</text><text x="440" y="132" font-size="13">用 80 减掉贷记就是盈亏平衡</text><rect x="435" y="145" width="310" height="115" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="445" y="170" fill="#b35c00" font-size="13" font-weight="bold">（推算）下方 BE = 80 − 1.03 = 78.97</text><text x="445" y="192" fill="#b35c00" font-size="12">白板与字幕都没有写出 78.97</text><text x="445" y="214" fill="#b35c00" font-size="12">（推算）跌破 80 后每跌 $1 多亏 $1；</text><text x="445" y="236" fill="#b35c00" font-size="12">理论最坏（归零）−$78.97/股</text><text x="400" y="300" text-anchor="middle" font-weight="bold">反例误读：「上方无风险」≠「整笔无风险」——下方就是一张裸卖 put</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="560" fill="#fff"/>
<text x="450" y="38" font-size="24" text-anchor="middle" font-weight="bold">碰上轨 ≠ 做空，碰下轨 ≠ 超卖</text>

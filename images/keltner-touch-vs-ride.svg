<text x="480" y="500" font-size="14">大涨段：通道变宽，价格沿上轨一路走（帧 30/31）</text>
<text x="40" y="470" font-size="14">字幕（6:03–6:21）：doesn't automatically mean</text>
<text x="40" y="490" font-size="14">time to short / overbought / oversold</text>
<rect x="40" y="510" width="820" height="40" rx="6" fill="#fff7ec" stroke="#e8890c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="450" y="536" font-size="14" fill="#b35c00" text-anchor="middle">（笔者补充）示意图为手绘简化，非真实价格；片中没给进场、止损规则</text>

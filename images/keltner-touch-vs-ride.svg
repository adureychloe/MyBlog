<path d="M40,300 L240,220 L410,280" fill="none" stroke="#d4a017" stroke-width="2"/>
<circle cx="240" cy="238" r="10" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="60" y="380" font-size="15">「碰上轨 → 超买 → 必回落」</text>
<text x="60" y="404" font-size="15">这种读法片中明确否定</text>
<path d="M490,420 C560,400 600,330 650,280 C700,220 760,160 840,110" fill="none" stroke="#d4a017" stroke-width="2"/>

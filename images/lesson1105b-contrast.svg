<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="640" fill="#fff"/>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold">错误做法 vs 正确做法</text>
<rect x="40" y="70" width="420" height="400" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="250" y="105" font-size="19" text-anchor="middle" fill="#c53030" font-weight="bold">✗ 错误</text>
<text x="60" y="150" font-size="15">· 看到夜盘大涨，开盘就追进去</text>
<text x="60" y="190" font-size="15">· 开盘大波动里反复进出</text>
<text x="60" y="230" font-size="15">· 夜盘留下的仓位硬扛开盘卖压</text>
<text x="60" y="270" font-size="15">· 被来回扫，越做越乱</text>
<rect x="500" y="70" width="420" height="400" rx="8" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
<text x="710" y="105" font-size="19" text-anchor="middle" fill="#2f855a" font-weight="bold">✓ 正确（原话）</text>
<text x="520" y="150" font-size="15">· 大波动的时候不要去做</text>
<text x="520" y="190" font-size="15">· 如果有仓位，先平掉</text>
<text x="520" y="230" font-size="15">· 等亚盘时间结束之后</text>
<text x="520" y="270" font-size="15">· 重新入场</text>
<rect x="40" y="495" width="880" height="110" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8,5"/>
<text x="60" y="530" font-size="16" fill="#dd6b20" font-weight="bold">（笔者补充）</text>
<text x="60" y="560" font-size="14">「重新入场」不是「一定入场」：结束后重新看方向，符合计划才做，否则继续空仓。</text>
<text x="60" y="587" font-size="14">平仓是为了躲开不可控的波动，不是判断方向。</text>
</svg>

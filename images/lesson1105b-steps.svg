<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="640" fill="#fff"/>
<text x="480" y="40" font-size="22" text-anchor="middle" font-weight="bold">步骤流：夜盘大涨后的第二天怎么做</text>
<g font-size="15">
<rect x="40" y="70" width="440" height="80" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="102" font-weight="bold">1. 开盘前：夜盘是不是大涨？</text><text x="60" y="130" font-size="14">是 → 预期开盘有一波卖压</text>
<rect x="40" y="170" width="440" height="80" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="202" font-weight="bold">2. 有仓位？先平掉</text><text x="60" y="230" font-size="14">不带仓进开盘大波动</text>
<rect x="40" y="270" width="440" height="80" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="302" font-weight="bold">3. 大波动时：不要去做</text><text x="60" y="330" font-size="14">管住手，不开新仓</text>
<rect x="40" y="370" width="440" height="80" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="402" font-weight="bold">4. 亚盘时间结束之后：重新入场</text><text x="60" y="430" font-size="14">从头按计划找机会</text>
<rect x="500" y="70" width="420" height="380" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8,5"/>
<text x="520" y="105" fill="#dd6b20" font-weight="bold">（笔者补充）</text>
<text x="520" y="145" font-size="14">· 「大涨」的标准提前写死，别临场感觉</text>
<text x="520" y="180" font-size="14">· 亚盘时段大致对应东京交易时段；</text>
<text x="520" y="205" font-size="14">  具体时间以交易所/券商公布为准</text>
<text x="520" y="240" font-size="14">· 重新入场前：先定方向、止损、仓位</text>
<text x="520" y="275" font-size="14">· 事后记录：这次开盘有没有卖压，</text>
<text x="520" y="300" font-size="14">  等待是否让自己更从容</text>
</g>
<text x="480" y="510" font-size="18" text-anchor="middle" font-weight="bold">一句话：夜盘大涨，开盘先让一让。</text>
</svg>

  <text x="60.0" y="518.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">字幕说 CHoCH 是「第二个信号」，第一个信号是什么没截到。图中把「FVG 被打穿」编为 ②，是笔者的推断，不是片中原话。</text>
  <text x="60.0" y="538.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">这一帧的阳线实体其实收在前高之上（按开场定义更像 Run），之后才被吞回——所以「收上去」也要看后续守不守得住。</text>

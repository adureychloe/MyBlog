  <text x="445.0" y="134.0" font-size="12" fill="#7dd3fc" text-anchor="end" font-weight="700">Swing High（ERL）</text>
  <line x1="130.0" y1="345.0" x2="450.0" y2="345.0" stroke="#38bdf8" stroke-width="2"/>
  <text x="445.0" y="366.0" font-size="12" fill="#7dd3fc" text-anchor="end" font-weight="700">Swing Low（ERL）</text>
  <text x="405.0" y="228.0" font-size="12" fill="#fde047" text-anchor="start" font-weight="700">FVG（IRL）</text>
  <text x="60.0" y="392.0" font-size="11" fill="#cbd5e1" text-anchor="start" font-weight="400">字幕：…this is what the price uses as fuel to attack</text>

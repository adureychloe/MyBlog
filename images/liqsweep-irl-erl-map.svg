  <text x="600.0" y="318.0" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">① 留下 FVG</text>
  <circle cx="690.0" cy="230.0" r="8" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="682.0" y="214.0" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">② 拿 ERL（前高）</text>
  <circle cx="712.0" cy="285.0" r="8" fill="none" stroke="#a16207" stroke-width="2"/>
  <text x="730.0" y="314.0" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">③ 回到 FVG 加油</text>
  <circle cx="800.0" cy="172.0" r="8" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text x="790.0" y="156.0" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">④ 再拿下一个 ERL</text>
  <text x="710.0" y="104.0" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">IRL → ERL → IRL → ERL</text>
  <text x="520.0" y="392.0" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">字幕：fair value gap that can be used as fuel to create the next leg</text>
  <text x="60.0" y="446.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">ERL（External Range Liquidity）= 波段高点 / 波段低点：区间外沿，止损单堆在外面。</text>
  <text x="60.0" y="467.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">IRL（Internal Range Liquidity）= 区间内部未回补的 FVG：价格回来「加油」的地方。</text>
  <text x="60.0" y="488.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">趋势里价格在两者之间来回：回补 IRL → 去拿 ERL → 留下新 FVG → 回补 → 再拿下一个 ERL。</text>
</svg>

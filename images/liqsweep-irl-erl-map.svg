  <text x="480.0" y="32.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">两种流动性：ERL 在区间外沿，IRL 是区间里的 FVG</text>
  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">左：Step 1（~0:55）重画 · 右：Step 3 标题「IRL → ERL → IRL → ERL」（~5:30）节奏示意；无价格</text>

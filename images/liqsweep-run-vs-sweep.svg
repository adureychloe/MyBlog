<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect width="960" height="480" fill="#fff"/>
  <text x="480.0" y="32.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Run 还是 Sweep：只看这根 K 线的实体收在哪</text>
  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">片中开场分屏（~0:00）重画；全部是动画示意，无价格、无品种、无数字</text>
  <rect x="40.0" y="76.0" width="420.0" height="300.0" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
  <text x="250.0" y="106.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Liquidity Run（穿越 / 真突破）</text>
  <line x1="60.0" y1="220.0" x2="440.0" y2="220.0" stroke="#38bdf8" stroke-width="3"/>
  <text x="70.0" y="212.0" font-size="11" fill="#7dd3fc" text-anchor="start" font-weight="400">前高（蓝线）</text>
  <rect x="500.0" y="76.0" width="420.0" height="300.0" rx="10" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
  <text x="710.0" y="106.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">Liquidity Sweep（扫荡）</text>
  <line x1="520.0" y1="220.0" x2="900.0" y2="220.0" stroke="#38bdf8" stroke-width="3"/>
  <text x="530.0" y="212.0" font-size="11" fill="#7dd3fc" text-anchor="start" font-weight="400">前高（蓝线）</text>
  <line x1="170.0" y1="250.0" x2="170.0" y2="350.0" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="157.0" y="270.0" width="26" height="50.0" fill="#16a34a"/>
  <line x1="250.0" y1="140.0" x2="250.0" y2="330.0" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="235.0" y="160.0" width="30" height="130.0" fill="#16a34a"/>
  <text x="300.0" y="180.0" font-size="13" fill="#86efac" text-anchor="start" font-weight="700">实体收在线上</text>
  <line x1="630.0" y1="250.0" x2="630.0" y2="350.0" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="617.0" y="270.0" width="26" height="50.0" fill="#16a34a"/>
  <line x1="710.0" y1="140.0" x2="710.0" y2="330.0" stroke="#16a34a" stroke-width="1.6"/>
  <rect x="695.0" y="250.0" width="30" height="40.0" fill="#16a34a"/>
  <text x="760.0" y="160.0" font-size="13" fill="#fdba74" text-anchor="start" font-weight="700">影线刺过线</text>
  <text x="760.0" y="262.0" font-size="13" fill="#fdba74" text-anchor="start" font-weight="700">实体收回线下</text>
  <text x="250.0" y="404.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">→ 看「延续」（字幕关键词 continuation）</text>
  <text x="710.0" y="404.0" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">→ 拿完止损单就回来，可能反转</text>
  <text x="480.0" y="440.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">字幕：…targeted, and the second is knowing whether the price is going to make a continuation…</text>
  <text x="480.0" y="464.0" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="400">笔者补充：判断「实体收在哪」必须等这根 K 线走完；盘中刺破，收盘可能改写结论。</text>
</svg>

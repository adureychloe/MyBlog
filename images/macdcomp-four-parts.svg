<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Noto Sans CJK SC, Arial, sans-serif">
  <rect width="1000" height="700" fill="#fafafa"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">MACD 四零件（结构示意，非真实 K 线）</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#666">对照片中「Parts of the MACD」：蓝=MACD 线，橙=信号线；无品种、无周期</text>

  <!-- price panel schematic -->
  <rect x="40" y="70" width="600" height="200" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="50" y="90" font-size="12" fill="#555">上方：价格示意（插图，无刻度）</text>
  <!-- fake candles stay inside panel y=100..250 -->
  <rect x="70" y="170" width="10" height="40" fill="#ef5350"/><line x1="75" y1="155" x2="75" y2="220" stroke="#ef5350" stroke-width="1"/>
  <rect x="95" y="160" width="10" height="35" fill="#66bb6a"/><line x1="100" y1="145" x2="100" y2="205" stroke="#66bb6a" stroke-width="1"/>
  <rect x="120" y="150" width="10" height="45" fill="#66bb6a"/><line x1="125" y1="135" x2="125" y2="210" stroke="#66bb6a" stroke-width="1"/>
  <rect x="145" y="145" width="10" height="40" fill="#ef5350"/><line x1="150" y1="130" x2="150" y2="200" stroke="#ef5350" stroke-width="1"/>
  <rect x="170" y="140" width="10" height="40" fill="#66bb6a"/><line x1="175" y1="125" x2="175" y2="195" stroke="#66bb6a" stroke-width="1"/>
  <rect x="195" y="135" width="10" height="35" fill="#66bb6a"/><line x1="200" y1="120" x2="200" y2="185" stroke="#66bb6a" stroke-width="1"/>
  <rect x="220" y="150" width="10" height="40" fill="#ef5350"/><line x1="225" y1="135" x2="225" y2="205" stroke="#ef5350" stroke-width="1"/>
  <rect x="245" y="130" width="10" height="45" fill="#66bb6a"/><line x1="250" y1="115" x2="250" y2="190" stroke="#66bb6a" stroke-width="1"/>
  <rect x="270" y="125" width="10" height="35" fill="#66bb6a"/><line x1="275" y1="110" x2="275" y2="175" stroke="#66bb6a" stroke-width="1"/>
  <rect x="295" y="140" width="10" height="40" fill="#ef5350"/><line x1="300" y1="125" x2="300" y2="195" stroke="#ef5350" stroke-width="1"/>
  <rect x="320" y="120" width="10" height="40" fill="#66bb6a"/><line x1="325" y1="105" x2="325" y2="175" stroke="#66bb6a" stroke-width="1"/>
  <rect x="345" y="115" width="10" height="35" fill="#66bb6a"/><line x1="350" y1="105" x2="350" y2="165" stroke="#66bb6a" stroke-width="1"/>
  <rect x="370" y="130" width="10" height="40" fill="#ef5350"/><line x1="375" y1="115" x2="375" y2="185" stroke="#ef5350" stroke-width="1"/>
  <rect x="395" y="110" width="10" height="45" fill="#66bb6a"/><line x1="400" y1="105" x2="400" y2="170" stroke="#66bb6a" stroke-width="1"/>
  <rect x="420" y="105" width="10" height="35" fill="#66bb6a"/><line x1="425" y1="100" x2="425" y2="155" stroke="#66bb6a" stroke-width="1"/>
  <rect x="445" y="120" width="10" height="40" fill="#ef5350"/><line x1="450" y1="105" x2="450" y2="175" stroke="#ef5350" stroke-width="1"/>
  <rect x="470" y="105" width="10" height="45" fill="#66bb6a"/><line x1="475" y1="100" x2="475" y2="165" stroke="#66bb6a" stroke-width="1"/>
  <rect x="495" y="100" width="10" height="35" fill="#66bb6a"/><line x1="500" y1="100" x2="500" y2="150" stroke="#66bb6a" stroke-width="1"/>
  <text x="560" y="180" font-size="11" fill="#888">结构示意</text>

  <!-- MACD panel -->
  <rect x="40" y="280" width="600" height="240" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="50" y="300" font-size="12" fill="#555">下方：MACD 面板</text>
  <!-- zero line -->
  <line x1="60" y1="400" x2="620" y2="400" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="625" y="404" font-size="11" fill="#616161">零轴</text>
  <!-- histogram -->
  <rect x="80" y="375" width="12" height="25" fill="#26a69a"/><rect x="100" y="355" width="12" height="45" fill="#26a69a"/>
  <rect x="120" y="345" width="12" height="55" fill="#26a69a"/><rect x="140" y="365" width="12" height="35" fill="#26a69a"/>
  <rect x="160" y="385" width="12" height="15" fill="#26a69a"/>
  <rect x="190" y="400" width="12" height="30" fill="#ef5350"/><rect x="210" y="400" width="12" height="45" fill="#ef5350"/>
  <rect x="230" y="400" width="12" height="35" fill="#ef5350"/><rect x="250" y="400" width="12" height="18" fill="#ef5350"/>
  <rect x="290" y="370" width="12" height="30" fill="#26a69a"/><rect x="310" y="350" width="12" height="50" fill="#26a69a"/>
  <rect x="330" y="335" width="12" height="65" fill="#26a69a"/><rect x="350" y="345" width="12" height="55" fill="#26a69a"/>
  <rect x="380" y="400" width="12" height="40" fill="#ef5350"/><rect x="400" y="400" width="12" height="55" fill="#ef5350"/>
  <rect x="420" y="400" width="12" height="30" fill="#ef5350"/>
  <rect x="460" y="375" width="12" height="25" fill="#26a69a"/><rect x="480" y="350" width="12" height="50" fill="#26a69a"/>
  <rect x="500" y="330" width="12" height="70" fill="#26a69a"/><rect x="520" y="320" width="12" height="80" fill="#26a69a"/>
  <!-- MACD blue -->
  <polyline points="80,365 120,335 160,380 210,440 260,410 310,345 360,340 410,445 460,420 510,345 550,310" fill="none" stroke="#1976d2" stroke-width="2.5"/>
  <!-- Signal orange -->
  <polyline points="80,375 120,355 160,370 210,410 260,400 310,365 360,360 410,415 460,400 510,370 550,345" fill="none" stroke="#ef6c00" stroke-width="2.5"/>
  <!-- labels pointing -->
  <rect x="200" y="310" width="100" height="24" rx="3" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="250" y="327" text-anchor="middle" font-size="12" fill="#ef6c00" font-weight="bold">信号线（慢）</text>
  <line x1="250" y1="334" x2="250" y2="365" stroke="#ef6c00" stroke-width="1"/>
  <rect x="480" y="290" width="100" height="24" rx="3" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="530" y="307" text-anchor="middle" font-size="12" fill="#1976d2" font-weight="bold">MACD 线（快）</text>
  <line x1="530" y1="314" x2="530" y2="330" stroke="#1976d2" stroke-width="1"/>
  <rect x="100" y="470" width="130" height="24" rx="3" fill="#e0f2f1" stroke="#26a69a"/>
  <text x="165" y="487" text-anchor="middle" font-size="12" fill="#00695c" font-weight="bold">柱 = 两线之差</text>
  <rect x="260" y="470" width="100" height="24" rx="3" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="310" y="487" text-anchor="middle" font-size="12" fill="#616161" font-weight="bold">零轴（中心）</text>

  <!-- right legend boxes -->
  <rect x="670" y="70" width="300" height="450" rx="8" fill="#fff" stroke="#90a4ae"/>
  <text x="820" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">四个零件怎么读</text>
  <rect x="690" y="120" width="260" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="820" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1976d2">① MACD 线（蓝）</text>
  <text x="820" y="168" text-anchor="middle" font-size="12" fill="#37474f">更快，对价格更敏感</text>
  <rect x="690" y="205" width="260" height="70" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="820" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#ef6c00">② 信号线（橙）</text>
  <text x="820" y="253" text-anchor="middle" font-size="12" fill="#37474f">更慢，反应更平滑</text>
  <rect x="690" y="290" width="260" height="70" rx="6" fill="#e0f2f1" stroke="#26a69a"/>
  <text x="820" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#00695c">③ 柱状图 Histogram</text>
  <text x="820" y="338" text-anchor="middle" font-size="12" fill="#37474f">MACD − 信号；变高/变矮看强弱</text>
  <rect x="690" y="375" width="260" height="70" rx="6" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="820" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#616161">④ 零轴 Zero Line</text>
  <text x="820" y="423" text-anchor="middle" font-size="12" fill="#37474f">面板中心的水平线</text>
  <rect x="690" y="465" width="260" height="40" rx="6" fill="#fff6ec" stroke="#e67e22" stroke-dasharray="6,4"/>
  <text x="820" y="490" text-anchor="middle" font-size="11" fill="#b35400">（笔者补充）片中未写出具体参数</text>

  <text x="500" y="560" text-anchor="middle" font-size="12" fill="#c62828">画面反复出现：CFD 零售账户约 81.31% 亏损；not investment advice</text>
  <text x="500" y="585" text-anchor="middle" font-size="11" fill="#888">来源：Capital.com MACD 入门片 · 结构示意 · 仅供学习</text>
  <text x="500" y="620" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">交叉读法（片中）</text>
  <text x="500" y="645" text-anchor="middle" font-size="12" fill="#37474f">蓝线上穿橙线 ≈ 向上动能；下穿 ≈ 向下动能｜柱变高≈该方向变强，变矮≈变弱</text>
  <text x="500" y="680" text-anchor="middle" font-size="11" fill="#999">对照截图 01 / 03 / 08 / 09 · 无 ticker、无 timeframe</text>
</svg>

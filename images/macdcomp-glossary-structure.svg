<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" font-family="Arial, 'Noto Sans CJK SC', sans-serif" font-size="12">
  <rect width="960" height="640" fill="#fafafa"/>
  <text x="480" y="22" text-anchor="middle" font-size="15" font-weight="bold">MACD 结构示意 + Strategy #1 趋势过滤（Capital.com 片）</text>
  <text x="480" y="40" text-anchor="middle" font-size="11" fill="#555">结构示意，不按实际 K 线绘制；蓝 = MACD 线，橙 = 信号线。图上无品种/周期（与片中插图一致）。非投资建议。</text>

  <!-- ===== Price panel ===== -->
  <rect x="40" y="55" width="560" height="220" fill="#fff" stroke="#ccc"/>
  <text x="46" y="72" font-size="11" fill="#333">价格 + 100 MA（片中 Step 1：识别长期趋势）</text>
  <!-- 100 MA -->
  <polyline points="50,200 120,185 200,160 280,145 360,130 440,120 560,110" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="500" y="108" font-size="11" fill="#1565c0" font-weight="bold">100 MA</text>
  <!-- price above MA (simplified candles as line) -->
  <polyline points="50,190 90,170 130,175 170,150 210,155 250,135 290,140 330,120 370,125 410,105 450,112 500,95 555,100" fill="none" stroke="#333" stroke-width="1.8"/>
  <text x="46" y="250" font-size="10" fill="#333">黑线 ≈ 价格（示意在 100 MA 上方 → 只考虑向上交叉做多）</text>
  <!-- LONG box sketch -->
  <rect x="470" y="70" width="70" height="55" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="470" y="125" width="70" height="35" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
  <text x="505" y="100" text-anchor="middle" font-size="11" fill="#2e7d32" font-weight="bold">TP</text>
  <text x="505" y="118" text-anchor="middle" font-size="9" fill="#2e7d32">1.5×SL</text>
  <text x="505" y="147" text-anchor="middle" font-size="11" fill="#c62828" font-weight="bold">SL</text>
  <text x="505" y="162" text-anchor="middle" font-size="9" fill="#c62828">摆动低下</text>
  <text x="545" y="88" font-size="10" fill="#2e7d32" font-weight="bold">LONG</text>

  <!-- ===== MACD panel ===== -->
  <rect x="40" y="285" width="560" height="200" fill="#fff" stroke="#ccc"/>
  <text x="46" y="302" font-size="11" fill="#333">MACD 面板：四零件</text>
  <!-- zero line -->
  <line x1="50" y1="390" x2="580" y2="390" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="582" y="394" font-size="10" fill="#616161">Zero Line 零轴</text>
  <!-- histogram bars -->
  <rect x="70" y="370" width="14" height="20" fill="#26a69a"/><rect x="90" y="350" width="14" height="40" fill="#26a69a"/>
  <rect x="110" y="340" width="14" height="50" fill="#26a69a"/><rect x="130" y="355" width="14" height="35" fill="#26a69a"/>
  <rect x="150" y="375" width="14" height="15" fill="#26a69a"/>
  <rect x="180" y="390" width="14" height="25" fill="#ef5350"/><rect x="200" y="390" width="14" height="40" fill="#ef5350"/>
  <rect x="220" y="390" width="14" height="30" fill="#ef5350"/><rect x="240" y="390" width="14" height="15" fill="#ef5350"/>
  <rect x="280" y="360" width="14" height="30" fill="#26a69a"/><rect x="300" y="345" width="14" height="45" fill="#26a69a"/>
  <rect x="320" y="330" width="14" height="60" fill="#26a69a"/><rect x="340" y="335" width="14" height="55" fill="#26a69a"/>
  <rect x="360" y="350" width="14" height="40" fill="#26a69a"/>
  <rect x="400" y="390" width="14" height="35" fill="#ef5350"/><rect x="420" y="390" width="14" height="50" fill="#ef5350"/>
  <rect x="440" y="390" width="14" height="28" fill="#ef5350"/>
  <rect x="480" y="365" width="14" height="25" fill="#26a69a"/><rect x="500" y="345" width="14" height="45" fill="#26a69a"/>
  <rect x="520" y="330" width="14" height="60" fill="#26a69a"/><rect x="540" y="320" width="14" height="70" fill="#26a69a"/>
  <!-- MACD blue line -->
  <polyline points="70,360 110,330 150,375 200,430 250,400 300,340 350,335 400,430 450,415 500,350 550,315" fill="none" stroke="#1976d2" stroke-width="2.5"/>
  <!-- Signal orange line -->
  <polyline points="70,370 110,350 150,365 200,400 250,390 300,360 350,355 400,400 450,395 500,370 550,345" fill="none" stroke="#ef6c00" stroke-width="2.5"/>
  <!-- crossover circle (bullish) -->
  <circle cx="520" cy="348" r="14" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="535" y="310" font-size="10" fill="#333">上穿 → 多头交叉</text>
  <!-- labels -->
  <rect x="60" y="455" width="120" height="20" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="120" y="469" text-anchor="middle" font-size="11" fill="#1976d2" font-weight="bold">MACD 线（蓝，快）</text>
  <rect x="200" y="455" width="130" height="20" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="265" y="469" text-anchor="middle" font-size="11" fill="#ef6c00" font-weight="bold">信号线（橙，慢）</text>
  <rect x="350" y="455" width="150" height="20" fill="#e0f2f1" stroke="#26a69a"/>
  <text x="425" y="469" text-anchor="middle" font-size="11" fill="#00695c" font-weight="bold">Histogram = 两线差</text>
  <text x="46" y="500" font-size="10" fill="#555">柱变高 = 动能变强；柱变矮 = 动能变弱（片中 How To Read）</text>

  <!-- ===== Right: Strategy #1 flow ===== -->
  <text x="780" y="70" text-anchor="middle" font-size="13" font-weight="bold">Strategy #1 流程（片中）</text>
  <rect x="630" y="85" width="300" height="50" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="780" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">1. 100 MA 定长期趋势</text>
  <text x="780" y="123" text-anchor="middle" font-size="10" fill="#37474f">价上 → 偏多环境；价下 → 偏空环境</text>

  <line x1="780" y1="135" x2="780" y2="155" stroke="#555" stroke-width="2"/>
  <polygon points="780,160 775,150 785,150" fill="#555"/>

  <rect x="630" y="160" width="300" height="55" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="780" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#f57f17">2. 只做顺势 MACD 交叉</text>
  <text x="780" y="200" text-anchor="middle" font-size="10" fill="#37474f">多头环境只做上穿；空头环境只做下穿</text>

  <line x1="780" y1="215" x2="780" y2="235" stroke="#555" stroke-width="2"/>
  <polygon points="780,240 775,230 785,230" fill="#555"/>

  <rect x="630" y="240" width="300" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="780" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">3. SL / TP</text>
  <text x="780" y="280" text-anchor="middle" font-size="10" fill="#37474f">多：SL 在最近摆动低点下</text>
  <text x="780" y="296" text-anchor="middle" font-size="10" fill="#37474f">空：SL 在最近摆动高点上；TP = 1.5× SL</text>

  <rect x="630" y="330" width="300" height="70" rx="6" fill="#ffebee" stroke="#c62828"/>
  <text x="780" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">弃用（片中反例）</text>
  <text x="780" y="372" text-anchor="middle" font-size="10" fill="#37474f">下跌 Lower Highs / Lower Lows 时</text>
  <text x="780" y="388" text-anchor="middle" font-size="10" fill="#37474f">单靠多头交叉逆势买入</text>

  <rect x="630" y="420" width="300" height="100" rx="6" fill="#f3e5f5" stroke="#7b1fa2"/>
  <text x="780" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#7b1fa2">Strategy #2 背离（摘要）</text>
  <text x="780" y="462" text-anchor="middle" font-size="10" fill="#37474f">看涨：价 LL + MACD HL</text>
  <text x="780" y="478" text-anchor="middle" font-size="10" fill="#37474f">看跌：价 HH + MACD LH</text>
  <text x="780" y="494" text-anchor="middle" font-size="10" fill="#37474f">等交叉确认；不破前 MACD 摆动</text>
  <text x="780" y="510" text-anchor="middle" font-size="10" fill="#37474f">同样 SL + 1.5× TP</text>

  <text x="480" y="560" text-anchor="middle" font-size="11" fill="#c62828">画面免责：81.31% retail CFD accounts lose money；视频 not investment advice</text>
  <text x="480" y="580" text-anchor="middle" font-size="10" fill="#777">出处：Capital.com《MACD Indicator Trading Explained》· 笔记 2026-10-22-browser/01-macd-notes.md</text>
  <text x="480" y="600" text-anchor="middle" font-size="10" fill="#777">仅供学习。Alex 不推仓。</text>
  <text x="480" y="625" text-anchor="middle" font-size="10" fill="#999">结构示意 · glossary/images/macd.svg</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Noto Sans CJK SC, Arial, sans-serif">
  <rect width="1000" height="700" fill="#fafafa"/>
  <text x="500" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">MACD 背离概念：价与动能「分道扬镳」</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#666">对照片中 Strategy #2 概念图（约 6:48）· 结构示意，非真实 K 线</text>

  <rect x="80" y="80" width="840" height="250" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="100" y="110" font-size="16" font-weight="bold" fill="#333">Price</text>
  <!-- price HH -->
  <polyline points="150,280 250,180 350,250 450,120 550,200 650,100 750,160" fill="none" stroke="#8d6e63" stroke-width="3"/>
  <line x1="250" y1="180" x2="650" y2="100" stroke="#333" stroke-width="2.5"/>
  <defs><marker id="upArr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,10 L5,0 L10,10 Z" fill="#333"/></marker></defs>
  <line x1="450" y1="200" x2="450" y2="90" stroke="#333" stroke-width="4" marker-end="url(#upArr)"/>
  <text x="470" y="130" font-size="14" fill="#333" font-weight="bold">价格继续抬高</text>
  <circle cx="250" cy="180" r="6" fill="#8d6e63"/><circle cx="650" cy="100" r="6" fill="#8d6e63"/>

  <rect x="80" y="360" width="840" height="250" fill="#fff" stroke="#ccc" rx="4"/>
  <text x="100" y="390" font-size="16" font-weight="bold" fill="#1976d2">MACD</text>
  <polyline points="150,420 250,450 350,430 450,520 550,480 650,560 750,530" fill="none" stroke="#1976d2" stroke-width="3"/>
  <line x1="250" y1="450" x2="650" y2="560" stroke="#333" stroke-width="2.5"/>
  <defs><marker id="dnArr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L5,10 L10,0 Z" fill="#333"/></marker></defs>
  <line x1="450" y1="480" x2="450" y2="580" stroke="#333" stroke-width="4" marker-end="url(#dnArr)"/>
  <text x="470" y="555" font-size="14" fill="#333" font-weight="bold">指标高点却更低</text>
  <circle cx="250" cy="450" r="6" fill="#1976d2"/><circle cx="650" cy="560" r="6" fill="#1976d2"/>

  <text x="500" y="640" text-anchor="middle" font-size="15" fill="#37474f">CC：「indicator like the MACD moves in a different direction」</text>
  <text x="500" y="670" text-anchor="middle" font-size="13" fill="#888">人话：价格还在往一个方向走，动能指标已经往反方向走了 —— 这叫背离</text>
</svg>

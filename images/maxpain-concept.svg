<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="450" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">期权最大痛点：一句话定义 + 两边怎么算</text>
<rect x="30" y="60" width="940" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="500" y="92" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold">最大痛点（Max Pain）= 假设到期价落在某个行权价 K，</text>
<text x="500" y="122" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold">把所有“实值”期权要付给买方的钱（按 OI 加权）加总；总额最小的那个 K</text>
<text x="500" y="158" font-size="15" fill="#374151" text-anchor="middle">→ 期权买方整体拿到的钱最少、“最痛”</text>
<rect x="30" y="200" width="460" height="150" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="260" y="228" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold">看涨（Call）在 K 下赔付</text>
<text x="260" y="262" font-size="14" fill="#1f2937" text-anchor="middle">行权价 &lt; K 的看涨才实值</text>
<text x="260" y="290" font-size="14" fill="#1f2937" text-anchor="middle">每张赔 (K − 行权价) × 该档 OI</text>
<rect x="510" y="200" width="460" height="150" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="740" y="228" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold">看跌（Put）在 K 下赔付</text>
<text x="740" y="262" font-size="14" fill="#1f2937" text-anchor="middle">行权价 > K 的看跌才实值</text>
<text x="740" y="290" font-size="14" fill="#1f2937" text-anchor="middle">每张赔 (行权价 − K) × 该档 OI</text>
<text x="500" y="390" font-size="14" fill="#374151" text-anchor="middle">片中背景例（截图 01，PANews 2024-03-22）：BTC PCR 0.56、痛点 67,000 美元；ETH PCR 0.51、痛点 3,500 美元</text>
<text x="500" y="420" font-size="14" fill="#6b7280" text-anchor="middle">痛点只是到期周的背景信息，不是价格目标。</text>
</svg>

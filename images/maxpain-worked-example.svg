<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="1000" height="500" fill="#ffffff"/>
<text x="500.0" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f2937">手算一遍最大痛点（示例数据）</text>
<rect x="20" y="52" width="960" height="430" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="8 5"/>
<text x="500" y="80" font-size="16" fill="#9a3412" text-anchor="middle" font-weight="bold">示例数据（推算），非片中内容 —— 只有 3 个行权价的玩具期权链</text>
<text x="90" y="118" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">行权价</text>
<text x="210" y="118" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">看涨 OI</text>
<text x="330" y="118" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="bold">看跌 OI</text>
<text x="90" y="150" font-size="15" fill="#1f2937" text-anchor="middle">60</text>
<text x="210" y="150" font-size="15" fill="#1f2937" text-anchor="middle">10</text>
<text x="330" y="150" font-size="15" fill="#1f2937" text-anchor="middle">30</text>
<text x="90" y="180" font-size="15" fill="#1f2937" text-anchor="middle">65</text>
<text x="210" y="180" font-size="15" fill="#1f2937" text-anchor="middle">20</text>
<text x="330" y="180" font-size="15" fill="#1f2937" text-anchor="middle">20</text>
<text x="90" y="210" font-size="15" fill="#1f2937" text-anchor="middle">70</text>
<text x="210" y="210" font-size="15" fill="#1f2937" text-anchor="middle">30</text>
<text x="330" y="210" font-size="15" fill="#1f2937" text-anchor="middle">10</text>
<text x="40" y="270" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">结算在 60</text>
<text x="140" y="270" font-size="13" fill="#374151" text-anchor="start">看涨全作废；看跌 65、70 实值</text>
<text x="140" y="290" font-size="13" fill="#374151" text-anchor="start">5×20 + 10×10 = 200</text>
<rect x="560" y="252" width="260.0" height="28" fill="#9ca3af"/>
<text x="830.0" y="272" font-size="14" fill="#9ca3af" text-anchor="start" font-weight="bold">买方总赔付 200</text>
<text x="40" y="330" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">结算在 65</text>
<text x="140" y="330" font-size="13" fill="#374151" text-anchor="start">60 看涨 5×10；70 看跌 5×10</text>
<text x="140" y="350" font-size="13" fill="#374151" text-anchor="start">50 + 50 = 100</text>
<rect x="560" y="312" width="130.0" height="28" fill="#16a34a"/>
<text x="700.0" y="332" font-size="14" fill="#16a34a" text-anchor="start" font-weight="bold">买方总赔付 100</text>
<text x="40" y="390" font-size="15" fill="#1f2937" text-anchor="start" font-weight="bold">结算在 70</text>
<text x="140" y="390" font-size="13" fill="#374151" text-anchor="start">看跌全作废；看涨 60、65 实值</text>
<text x="140" y="410" font-size="13" fill="#374151" text-anchor="start">10×10 + 5×20 = 200</text>
<rect x="560" y="372" width="260.0" height="28" fill="#9ca3af"/>
<text x="830.0" y="392" font-size="14" fill="#9ca3af" text-anchor="start" font-weight="bold">买方总赔付 200</text>
<rect x="450" y="90" width="500" height="120" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="700" y="125" font-size="17" fill="#166534" text-anchor="middle" font-weight="bold">最小的是 65 → 最大痛点 = 65</text>
<text x="700" y="155" font-size="13" fill="#374151" text-anchor="middle">注意：65 不是 OI 最少的档（三档总 OI 都是 40）</text>
<text x="700" y="180" font-size="13" fill="#374151" text-anchor="middle">真实计算 = 把这一步铺到整条期权链</text>
<text x="500" y="465" font-size="14" fill="#9a3412" text-anchor="middle">读法：逐个假设结算价 → 算买方能拿多少 → 挑最小</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="620" fill="#ffffff"/>
<text x="450" y="34" font-size="22" text-anchor="middle" font-weight="bold">MFI：带成交量的 0–100 动量振荡器</text>
<text x="450" y="58" font-size="13" text-anchor="middle" fill="#555">对照 Soheil PKO 帧 01/04：EURUSD 1D · 副图标签 MFI (14) · 水平线 80 / 20</text>

<!-- left: chart schematic -->
<rect x="30" y="78" width="520" height="400" rx="8" fill="#fafafa" stroke="#99a"/>
<text x="50" y="104" font-size="14" font-weight="bold">示意：EURUSD 日线 + MFI(14) 副图</text>
<text x="50" y="124" font-size="12" fill="#666">（结构对照帧 04「Overbought &amp; Oversold」；曲线为手绘示意，非复原行情）</text>

<!-- price pane -->
<rect x="50" y="140" width="480" height="140" fill="#fff" stroke="#ccc"/>
<text x="60" y="158" font-size="12" fill="#444">价格（蜡烛示意）</text>
<path d="M70,250 L100,240 L130,220 L160,200 L190,210 L220,180 L250,170 L280,190 L310,160 L340,175 L370,195 L400,185 L430,210 L460,230 L500,245" fill="none" stroke="#2a7" stroke-width="2"/>
<text x="60" y="270" font-size="11" fill="#888">FX_IDC:EURUSD, 1D（片中图例）</text>

<!-- mfi pane -->
<rect x="50" y="290" width="480" height="170" fill="#fff" stroke="#ccc"/>
<text x="60" y="308" font-size="12" fill="#444">MFI (14)</text>
<!-- shaded 20-80 -->
<rect x="70" y="330" width="420" height="90" fill="#d8d4ec" opacity="0.55"/>
<line x1="70" y1="330" x2="490" y2="330" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
<line x1="70" y1="420" x2="490" y2="420" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="500" y="334" font-size="12" fill="#333">80</text>
<text x="500" y="380" font-size="12" fill="#333">50</text>
<text x="500" y="424" font-size="12" fill="#333">20</text>
<text x="500" y="310" font-size="11" fill="#888">100</text>
<text x="500" y="450" font-size="11" fill="#888">0</text>
<path d="M80,400 L110,370 L140,340 L170,320 L200,335 L230,360 L260,390 L290,410 L320,380 L350,350 L380,365 L410,390 L440,400 L470,385" fill="none" stroke="#5b4bb7" stroke-width="2.5"/>
<text x="80" y="322" font-size="11" fill="#555">超买区 &gt;80</text>
<text x="80" y="448" font-size="11" fill="#555">超卖区 &lt;20</text>

<!-- right cards -->
<rect x="570" y="78" width="300" height="120" rx="8" fill="#f3f6fb" stroke="#99a"/>
<text x="590" y="108" font-size="15" font-weight="bold">片中可核对</text>
<text x="590" y="134" font-size="13">· 副图标题：MFI (14)</text>
<text x="590" y="156" font-size="13">· 刻度约 0 / 20 / 40 / 60 / 80 / 100</text>
<text x="590" y="178" font-size="13">· 大标题：Overbought &amp; Oversold</text>

<rect x="570" y="214" width="300" height="130" rx="8" fill="#eef8f0" stroke="#5a9"/>
<text x="590" y="244" font-size="15" font-weight="bold" fill="#1a6b3c">采用（定义背景）</text>
<text x="590" y="270" font-size="13">价 + 量的动量振荡器</text>
<text x="590" y="292" font-size="13">范围 0–100；默认周期 14</text>
<text x="590" y="314" font-size="13">80 / 20 作超买超卖刻度</text>

<rect x="570" y="360" width="300" height="118" rx="8" fill="#fff7ec" stroke="#e8890c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="590" y="388" font-size="14" fill="#b35c00">（笔者补充）常称 volume-weighted RSI</text>
<text x="590" y="412" font-size="13" fill="#b35c00">片中没有公式板；外汇图上的量</text>
<text x="590" y="434" font-size="13" fill="#b35c00">多半是 tick volume，信号要打折。</text>
<text x="590" y="456" font-size="12" fill="#b35c00">以上不是片中原话。</text>

<rect x="30" y="500" width="840" height="100" rx="8" fill="#f8fafc" stroke="#99a"/>
<text x="50" y="530" font-size="14" font-weight="bold">简介/画面语境（非公式板）</text>
<text x="50" y="556" font-size="13">YouTube 简介写 MFI 基于 price and volume；帧 01 标题卡「MFI / Money Flow Index」叠在 EURUSD 日线上。</text>
<text x="50" y="580" font-size="13" fill="#555">缺口：全程无公式板、无设置面板截图；Length=14 只从副图标题读到。</text>
</svg>

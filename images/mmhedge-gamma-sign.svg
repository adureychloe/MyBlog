<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480.0" y="32" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">同样做了 Delta 对冲，Gamma 的正负决定做市商被迫「逆势」还是「顺势」</text>
  <text x="480.0" y="55" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">左：~2:30 short a delta hedged put or call → Negative gamma · 右：~3:37 Positive gamma（现价两侧绿/红对冲块）</text>
  <rect x="30" y="72" width="440" height="340" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="250" y="100" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">卖出期权 + 对冲 → 负 Gamma（short gamma）</text>
  <line x1="60" y1="290" x2="440" y2="290" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="436" y="306" font-size="11" fill="#64748b" text-anchor="end" font-weight="400">标的价格 →</text>
  <line x1="250" y1="115" x2="250" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="254" y="126" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">现价</text>
  <polyline points="80.0,295.6 90.0,282.4 100.0,270.0 110.0,258.4 120.0,247.6 130.0,237.6 140.0,228.4 150.0,220.0 160.0,212.4 170.0,205.6 180.0,199.6 190.0,194.4 200.0,190.0 210.0,186.4 220.0,183.6 230.0,181.6 240.0,180.4 250.0,180.0 260.0,180.4 270.0,181.6 280.0,183.6 290.0,186.4 300.0,190.0 310.0,194.4 320.0,199.6 330.0,205.6 340.0,212.4 350.0,220.0 360.0,228.4 370.0,237.6 380.0,247.6 390.0,258.4 400.0,270.0 410.0,282.4 420.0,295.6" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
  <text x="70" y="150" font-size="12" fill="#7f1d1d" text-anchor="start" font-weight="400">P/L 倒 U：往哪边大动都亏</text>
  <line x1="300" y1="350" x2="400" y2="350" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="372" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">涨 → 追买</text>
  <line x1="200" y1="350" x2="100" y2="350" stroke="#b91c1c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="372" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">跌 → 追卖</text>
  <text x="250" y="398" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">对冲方向与波动同向 → 容易放大波动</text>
  <rect x="490" y="72" width="440" height="340" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="710" y="100" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">买入期权 + 对冲 → 正 Gamma（long gamma）</text>
  <line x1="520" y1="290" x2="900" y2="290" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="896" y="306" font-size="11" fill="#64748b" text-anchor="end" font-weight="400">标的价格 →</text>
  <line x1="710" y1="115" x2="710" y2="330" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="714" y="126" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">现价</text>
  <polyline points="540.0,163.3 550.0,173.2 560.0,182.5 570.0,191.2 580.0,199.3 590.0,206.8 600.0,213.7 610.0,220.0 620.0,225.7 630.0,230.8 640.0,235.3 650.0,239.2 660.0,242.5 670.0,245.2 680.0,247.3 690.0,248.8 700.0,249.7 710.0,250.0 720.0,249.7 730.0,248.8 740.0,247.3 750.0,245.2 760.0,242.5 770.0,239.2 780.0,235.3 790.0,230.8 800.0,225.7 810.0,220.0 820.0,213.7 830.0,206.8 840.0,199.3 850.0,191.2 860.0,182.5 870.0,173.2 880.0,163.3" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round"/>
  <text x="530" y="150" font-size="12" fill="#14532d" text-anchor="start" font-weight="400">P/L 呈 U 形：往哪边大动都赚</text>
  <rect x="640" y="316" width="11" height="14" fill="#22c55e"/>
  <rect x="654" y="308" width="11" height="22" fill="#22c55e"/>
  <rect x="668" y="298" width="11" height="32" fill="#22c55e"/>
  <rect x="682" y="286" width="11" height="44" fill="#22c55e"/>
  <rect x="724" y="286" width="11" height="44" fill="#ef4444"/>
  <rect x="738" y="298" width="11" height="32" fill="#ef4444"/>
  <rect x="752" y="308" width="11" height="22" fill="#ef4444"/>
  <rect x="766" y="316" width="11" height="14" fill="#ef4444"/>
  <text x="610" y="372" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">跌 → 买（绿）</text>
  <text x="810" y="372" font-size="13" fill="#b91c1c" text-anchor="middle" font-weight="700">涨 → 卖（红）</text>
  <text x="710" y="398" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">对冲方向与波动相反 → 起阻尼作用</text>
  <text x="480.0" y="448" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">关键：做市商不是在「看多/看空」，而是被自己的持仓结构逼着买卖。</text>
  <text x="480.0" y="474" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">同一个价格波动，遇到正 Gamma 常被「磨平」，遇到负 Gamma 可能被「放大」——这是条件，不是预言。</text>
  <text x="480.0" y="498" font-size="11" fill="#64748b" text-anchor="middle" font-weight="400">（曲线形状为示意，重画自片中动画；未标数值）</text>
</svg>

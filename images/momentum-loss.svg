<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#111">动量衰减（在关键位才有意义）</text>
  <text x="240" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#166534">好信号：靠近支撑时动量衰减 + 拒绝</text>
  <text x="720" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#b91c1c">坏信号：加速 / 吞没击穿</text>
  <rect x="40" y="70" width="400" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="520" y="70" width="400" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="80" y="280" width="320" height="40" fill="#bbf7d0" fill-opacity=".5" stroke="#16a34a"/>
  <text x="240" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">支撑区</text>
  <rect x="560" y="280" width="320" height="40" fill="#bbf7d0" fill-opacity=".5" stroke="#16a34a"/>
  <text x="720" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">支撑区</text>
  <g fill="#ef4444" stroke="#b91c1c" stroke-width="2">
    <rect x="110" y="140" width="22" height="70"/><line x1="121" y1="130" x2="121" y2="220"/>
    <rect x="160" y="170" width="20" height="55"/><line x1="170" y1="160" x2="170" y2="235"/>
    <rect x="210" y="200" width="18" height="40"/><line x1="219" y1="190" x2="219" y2="250"/>
    <rect x="260" y="230" width="14" height="28"/><line x1="267" y1="250" x2="267" y2="300"/>
  </g>
  <rect x="300" y="160" width="28" height="90" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <text x="240" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#166534">烛变小 → 长下影拒绝 → 可考虑</text>
  <g fill="#ef4444" stroke="#b91c1c" stroke-width="2">
    <rect x="590" y="160" width="18" height="40"/><line x1="599" y1="150" x2="599" y2="210"/>
    <rect x="640" y="140" width="22" height="55"/><line x1="651" y1="130" x2="651" y2="205"/>
    <rect x="700" y="110" width="30" height="100"/><line x1="715" y1="100" x2="715" y2="220"/>
    <rect x="770" y="200" width="36" height="120"/><line x1="788" y1="190" x2="788" y2="330"/>
  </g>
  <text x="720" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#b91c1c">越靠近越大烛 → NO TRADE</text>

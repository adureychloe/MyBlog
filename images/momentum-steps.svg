<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#111">到关键位后怎么走？（学生流程图）</text>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="40" y="70" width="190" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="135" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">① 到关键位</text>
  <text x="135" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e40af">S/R · 前高低 · 供需区</text>

  <path d="M235 115 L275 115" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="280" y="70" width="190" height="90" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="375" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#4338ca">② 实体变小？</text>
  <text x="375" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4f46e5">比前一段推进波收窄</text>

  <path d="M475 115 L515 115" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="520" y="70" width="190" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="615" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#b45309">③ 拒绝影线？</text>
  <text x="615" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#92400e">加分项，不单独当圣杯</text>

  <path d="M715 115 L755 115" stroke="#64748b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="760" y="70" width="160" height="90" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="840" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#166534">④ 再决定</text>
  <text x="840" y="132" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#15803d">评估 / 观望</text>

  <!-- NO TRADE callout -->
  <rect x="120" y="210" width="720" height="70" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="480" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#b91c1c">旁注：加速 / 吞没 = NO TRADE（逆势）</text>
  <text x="480" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#991b1b">实体越靠近关键位越大 → 动能在加强，先别逆着接</text>

  <!-- bottom tips -->
  <rect x="40" y="310" width="430" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="255" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#166534">✓ 关键位 + 收窄 +（可选）拒绝 → 可评估</text>
  <text x="255" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">缺关键位或缺收窄 → 降级为观察</text>

  <rect x="490" y="310" width="430" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="705" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#b91c1c">✗ 到区就盲挂 / 单根长影当反转</text>
  <text x="705" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">位置到了 ≠ 动能也弱了</text>
</svg>

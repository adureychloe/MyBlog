<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#111">周线级对照：支撑区「好接」vs「别硬接」</text>
  <text x="240" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#166534">正例：到区后变小 + 下影拒绝</text>
  <text x="720" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#b91c1c">反例：到区后加速 / 吞没击穿</text>

  <!-- left panel -->
  <rect x="30" y="70" width="440" height="320" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="70" y="300" width="360" height="48" fill="#bbf7d0" fill-opacity=".55" stroke="#16a34a"/>
  <text x="250" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">已知支撑区</text>
  <!-- declining then shrinking candles -->
  <g stroke="#b91c1c" stroke-width="2">
    <rect x="90" y="120" width="24" height="80" fill="#ef4444"/><line x1="102" y1="110" x2="102" y2="210"/>
    <rect x="140" y="160" width="22" height="65" fill="#ef4444"/><line x1="151" y1="150" x2="151" y2="235"/>
    <rect x="190" y="200" width="18" height="48" fill="#ef4444"/><line x1="199" y1="190" x2="199" y2="258"/>
  </g>
  <!-- small body near support -->
  <rect x="245" y="250" width="14" height="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="252" y1="240" x2="252" y2="290" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="285" y="265" width="12" height="18" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="291" y1="255" x2="291" y2="310" stroke="#b91c1c" stroke-width="1.5"/>
  <!-- rejection green -->
  <rect x="330" y="200" width="26" height="70" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <line x1="343" y1="190" x2="343" y2="320" stroke="#15803d" stroke-width="2"/>
  <text x="343" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#166534">拒绝</text>
  <text x="250" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#166534">可评估做多 / 空头止盈</text>
  <text x="250" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#15803d">推进变小 → 再谈反转剧本</text>

  <!-- right panel -->
  <rect x="490" y="70" width="440" height="320" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="530" y="300" width="360" height="48" fill="#bbf7d0" fill-opacity=".45" stroke="#16a34a" stroke-dasharray="5 3"/>
  <text x="710" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#166534">「看起来像」支撑</text>
  <!-- accelerating candles -->
  <g stroke="#b91c1c" stroke-width="2">
    <rect x="560" y="180" width="18" height="45" fill="#ef4444"/><line x1="569" y1="170" x2="569" y2="235"/>
    <rect x="615" y="150" width="24" height="70" fill="#ef4444"/><line x1="627" y1="140" x2="627" y2="230"/>
    <rect x="680" y="110" width="32" height="110" fill="#ef4444"/><line x1="696" y1="100" x2="696" y2="230"/>
    <!-- engulfing through support -->
    <rect x="755" y="200" width="40" height="140" fill="#dc2626"/><line x1="775" y1="190" x2="775" y2="355"/>
  </g>
  <text x="775" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#b91c1c">吞没击穿</text>
  <text x="710" y="370" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#b91c1c">NO TRADE（逆势抄底）</text>
  <text x="710" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">越靠近越大 → 动能还在加强</text>
</svg>

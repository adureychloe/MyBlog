<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Noto Sans CJK SC, sans-serif">
<rect width="960" height="640" fill="#fff"/>
<text x="480" y="40" font-size="24" text-anchor="middle" font-weight="bold">两层周期：4H 定方向和止盈止损，15/30min 找进场</text>
<rect x="40" y="70" width="880" height="230" rx="10" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/>
<text x="60" y="100" font-size="18" fill="#2b6cb0" font-weight="bold">上层：4H 或更高（我的原话）</text>
<polyline points="80,270 200,220 260,240 400,170 470,195 620,145 700,165 860,135" fill="none" stroke="#2b6cb0" stroke-width="4"/>
<line x1="80" y1="122" x2="900" y2="122" stroke="#2f855a" stroke-width="2" stroke-dasharray="8 4"/>
<text x="90" y="117" font-size="15" fill="#2f855a">止盈：4H 结构位</text>
<line x1="80" y1="262" x2="900" y2="262" stroke="#c53030" stroke-width="2" stroke-dasharray="8 4"/>
<text x="560" y="285" font-size="15" fill="#c53030">止损：4H 结构低点之外</text>
<text x="300" y="150" font-size="16">趋势方向：向上</text>
<rect x="40" y="330" width="560" height="280" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
<text x="60" y="360" font-size="18" fill="#2f855a" font-weight="bold">下层：15min / 30min（我的原话）</text>
<text x="60" y="390" font-size="15">只负责“什么时候进”</text>
<polyline points="80,430 130,470 170,450 210,520 250,500 290,540 340,470 390,490 440,420 500,440 560,400" fill="none" stroke="#2f855a" stroke-width="3"/>
<circle cx="340" cy="470" r="9" fill="none" stroke="#d69e2e" stroke-width="3"/>
<text x="300" y="590" font-size="15">回调结束、重新转向 4H 方向 → 进场点</text>
<rect x="630" y="330" width="290" height="280" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/>
<text x="650" y="360" font-size="17" fill="#dd6b20" font-weight="bold">（笔者补充）</text>
<text x="650" y="395" font-size="15">· 大周期噪音少，方向更稳</text>
<text x="650" y="425" font-size="15">· 小周期只做“顺 4H”的单</text>
<text x="650" y="455" font-size="15">· 1H 可作中间过渡（可选）</text>
<text x="650" y="485" font-size="15">· 进场精细 → 同样止损位下</text>
<text x="650" y="510" font-size="15">  更好的盈亏比</text>
<text x="650" y="545" font-size="15">· 止损宽 → 仓位要算小</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <rect width="800" height="360" fill="#fff"/>
  <text x="400" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">期权权利金拆分（学 Greeks 前先懂这个）</text>
  <rect x="220" y="70" width="200" height="100" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text x="320" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#c2410c">外在价值</text>
  <text x="320" y="138" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9a3412">时间 + 波动</text>
  <rect x="220" y="170" width="200" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="320" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#1d4ed8">内在价值</text>
  <text x="320" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e40af">实值部分</text>
  <path d="M440 170 L500 170" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
  <text x="520" y="160" font-family="system-ui,sans-serif" font-size="14" fill="#334155">权利金 = 内在 + 外在</text>
  <text x="520" y="185" font-family="system-ui,sans-serif" font-size="14" fill="#334155">Θ 和 Vega 主要打外在</text>
  <text x="400" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">仓位级 Greeks 计算时别忘 ×100（美股标准期权）</text>
</svg>

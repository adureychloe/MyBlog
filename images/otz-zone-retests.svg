<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">OTZ = 被反复测试的 S/R 区</text>
  <rect x="50" y="60" width="860" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <!-- OTZ zone -->
  <rect x="80" y="240" width="780" height="70" fill="#bbf7d0" fill-opacity=".45" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="280" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#166534">OTZ 供需区（多次测试）</text>
  <!-- price path with multiple touches -->
  <polyline points="100,200 160,255 220,120 280,260 340,100 400,255 460,90 520,250 580,110 640,200 700,130 760,255 820,180" fill="none" stroke="#2563eb" stroke-width="3"/>
  <!-- touch markers -->
  <circle cx="160" cy="255" r="6" fill="#16a34a"/><text x="150" y="310" font-size="11" fill="#166534" font-family="system-ui,sans-serif">测①</text>
  <circle cx="280" cy="260" r="6" fill="#16a34a"/><text x="270" y="310" font-size="11" fill="#166534" font-family="system-ui,sans-serif">测②</text>
  <circle cx="400" cy="255" r="6" fill="#16a34a"/><text x="390" y="310" font-size="11" fill="#166534" font-family="system-ui,sans-serif">测③</text>
  <circle cx="520" cy="250" r="6" fill="#16a34a"/><text x="510" y="310" font-size="11" fill="#166534" font-family="system-ui,sans-serif">测④</text>
  <!-- pullback entry marker -->
  <circle cx="760" cy="255" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="700" y="215" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">回踩入场 ✓</text>
  <!-- chase X -->
  <text x="640" y="95" font-family="system-ui,sans-serif" font-size="12" fill="#b91c1c">远离 OTZ 追价 ✗</text>
  <line x1="700" y1="100" x2="700" y2="125" stroke="#b91c1c" stroke-width="2"/>
  <text x="480" y="410" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">等价格回到被验证过的区，再谈 Entry —— 不追突破瞬间</text>
</svg>

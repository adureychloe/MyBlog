<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">同一个形态，趋势里 vs 逆势里含义不同</text>
  <text x="240" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#166534">左：上升趋势回撤中的看涨吞没</text>
  <text x="720" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#b91c1c">右：强下跌中的同形态</text>
  <rect x="40" y="78" width="400" height="310" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="520" y="78" width="400" height="310" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <!-- left uptrend -->
  <polyline points="70,300 120,240 170,270 220,180 270,210 320,130 370,160" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="90" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">上升趋势</text>
  <!-- pullback bearish small then bullish engulfing -->
  <rect x="250" y="200" width="22" height="45" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="261" y1="190" x2="261" y2="255" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="280" y="155" width="28" height="90" fill="#86efac" stroke="#166534" stroke-width="2"/>
  <line x1="294" y1="145" x2="294" y2="255" stroke="#166534" stroke-width="1.5"/>
  <text x="240" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#166534">可考虑</text>
  <text x="240" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#15803d">顺势回撤 + 价值区附近的吞没</text>
  <!-- right downtrend -->
  <polyline points="560,120 610,170 660,140 710,220 760,190 810,280 860,250" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="570" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">强下跌趋势</text>
  <rect x="730" y="210" width="22" height="45" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
  <line x1="741" y1="200" x2="741" y2="265" stroke="#b91c1c" stroke-width="1.5"/>
  <rect x="760" y="165" width="28" height="90" fill="#86efac" stroke="#166534" stroke-width="2"/>
  <line x1="774" y1="155" x2="774" y2="265" stroke="#166534" stroke-width="1.5"/>
  <text x="720" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#b91c1c">噪声 / 陷阱</text>
  <text x="720" y="352" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">逆势「抄底吞没」失败率更高</text>
</svg>

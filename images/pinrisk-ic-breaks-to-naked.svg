<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="Noto Sans CJK SC, Arial, sans-serif">
  <rect width="1000" height="720" fill="#fafafa"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">教学假票例：60-65-70-75 铁秃鹰钉在 70 后裂开</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#666">数字照抄片中 · ZYX = 教学假票，非真实市场标的</text>

  <!-- LEFT before -->
  <rect x="30" y="65" width="460" height="340" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="260" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">① 开仓（两张 IC）</text>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#555">假票示意 · 同到期四腿</text>
  <rect x="70" y="135" width="220" height="32" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="180" y="156" text-anchor="middle" font-size="13" fill="#1565c0">Long call 75</text>
  <text x="55" y="156" font-size="12" font-weight="bold" fill="#1565c0">75</text>
  <rect x="70" y="180" width="220" height="32" rx="4" fill="#ffebee" stroke="#c62828"/><text x="180" y="201" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">Short call 70</text>
  <text x="55" y="201" font-size="12" font-weight="bold" fill="#c62828">70</text>
  <rect x="70" y="225" width="220" height="32" rx="4" fill="#ffebee" stroke="#c62828"/><text x="180" y="246" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">Short put 65</text>
  <text x="55" y="246" font-size="12" font-weight="bold" fill="#c62828">65</text>
  <rect x="70" y="270" width="220" height="32" rx="4" fill="#e3f2fd" stroke="#1565c0"/><text x="180" y="291" text-anchor="middle" font-size="13" fill="#1565c0">Long put 60</text>
  <text x="55" y="291" font-size="12" font-weight="bold" fill="#1565c0">60</text>
  <rect x="310" y="160" width="150" height="120" rx="6" fill="#fff8e1" stroke="#f9a825"/>
  <text x="385" y="190" text-anchor="middle" font-size="12" fill="#e65100" font-weight="bold">计划风控</text>
  <text x="385" y="215" text-anchor="middle" font-size="13">净贷记 $150</text>
  <text x="385" y="240" text-anchor="middle" font-size="13">翼宽 5 → $500</text>
  <text x="385" y="268" text-anchor="middle" font-size="16" fill="#c62828" font-weight="bold">MaxL $350</text>
  <text x="260" y="340" text-anchor="middle" font-size="13" fill="#2e7d32" font-weight="bold">$500 − $150 = $350（画面大字）</text>
  <text x="260" y="365" text-anchor="middle" font-size="12" fill="#555">前提：两翼保护腿都还在 = 定义风险</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#888">卖了两张 → 周末可能剩两张短 call</text>

  <!-- RIGHT after pin -->
  <rect x="510" y="65" width="460" height="340" rx="8" fill="#fff" stroke="#c62828" stroke-width="2"/>
  <text x="740" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">② 周五钉在 $70</text>
  <text x="740" y="118" text-anchor="middle" font-size="12" fill="#555">收盘 ≈ Short call 行权价</text>
  <rect x="540" y="135" width="180" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="630" y="152" text-anchor="middle" font-size="12" fill="#616161">Long call 75</text>
  <text x="630" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#616161">Expired OTM</text>
  <rect x="740" y="135" width="200" height="55" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="840" y="158" text-anchor="middle" font-size="13" fill="#c62828" font-weight="bold">Short call 70 存活</text>
  <text x="840" y="178" text-anchor="middle" font-size="12" fill="#c62828">Assigned?</text>
  <rect x="540" y="205" width="180" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="630" y="222" text-anchor="middle" font-size="12" fill="#616161">Short put 65</text>
  <text x="630" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#616161">Expired OTM</text>
  <rect x="740" y="205" width="200" height="40" rx="4" fill="#eeeeee" stroke="#9e9e9e"/>
  <text x="840" y="222" text-anchor="middle" font-size="12" fill="#616161">Long put 60</text>
  <text x="840" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#616161">Expired OTM</text>
  <rect x="540" y="270" width="400" height="100" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="740" y="300" text-anchor="middle" font-size="14" fill="#b71c1c" font-weight="bold">周末：两张裸 ATM 短 call @ $70</text>
  <text x="740" y="325" text-anchor="middle" font-size="12" fill="#37474f">每张若被指派 → 按 $70 卖 100 股</text>
  <text x="740" y="350" text-anchor="middle" font-size="12" fill="#37474f">可能：都指派 / 一张 / 都不（部分指派）</text>

  <!-- bottom message -->
  <rect x="30" y="425" width="940" height="100" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="500" y="465" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">定义风险 → 未定义风险</text>
  <text x="500" y="495" text-anchor="middle" font-size="14" fill="#37474f">长 call 75 作废后，上行不再被 75 封顶；原计划 MaxL $350 的前提已经失效</text>

  <rect x="30" y="545" width="940" height="80" rx="8" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="500" y="580" text-anchor="middle" font-size="13" fill="#b35400">（笔者补充）计划 MaxL = 翼宽 − 贷记，默认保护腿还在。短腿钉住、长翼作废后，「定义风险」一夜滑成裸腿 —— 更隐蔽。</text>
  <text x="500" y="605" text-anchor="middle" font-size="12" fill="#b35400">ZYX、$70、$80 全是教学示意，不是今日可交易信号。</text>

  <text x="500" y="660" text-anchor="middle" font-size="12" fill="#888">对照截图 09 / 10 / 11 / 12 · 仅供学习，不构成投资建议</text>
  <text x="500" y="690" text-anchor="middle" font-size="11" fill="#999">Charles Schwab《It's Expiration Day: Do You Know Where Your Pin Risk Is?》</text>
</svg>

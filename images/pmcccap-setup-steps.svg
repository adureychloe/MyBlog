<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">PMCC 开仓指南：两条腿各三项</text><text x="30" y="72" font-size="15" fill="#667">依 7:41 / 8:30 PMCC Setup Guidelines 幻灯与 8:06–8:47 链上示例重画</text><rect x="60" y="90" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">1 长腿 Long Call：Delta 0.70–0.90 · 到期 1–2 年 · Deep ITM</text><text x="72" y="139.2" font-size="16" fill="#222">片中例：Jan 21 2028（656 DTE）50 call，delta 0.81，$34.75</text><line x1="480" y1="203.0" x2="480" y2="217.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="219.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="245.0" font-size="16" fill="#222" font-weight="bold">2 短腿 Short Call：Delta 0.15–0.30 · 30–60 DTE · OTM</text><text x="72" y="268.2" font-size="16" fill="#222">片中例：40 DTE 80 call，delta 0.30，$2.67</text><line x1="480" y1="332.0" x2="480" y2="346.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="348.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="374.0" font-size="16" fill="#222" font-weight="bold">3 检查宽度：总借记 ≤ 两行权价宽度（Strike Width Rule）</text><text x="72" y="397.2" font-size="16" fill="#222">详见姊妹篇《PMCC 三条纪律》</text><line x1="480" y1="461.0" x2="480" y2="475.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="477.0" width="840" height="113.0" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="503.0" font-size="16" fill="#222" font-weight="bold">（笔者补充）长腿越深 ITM 越像股票、越贵；越浅越省钱、但更容易踩宽度规则</text><text x="72" y="526.2" font-size="16" fill="#222">这是理解区间的思路，不是视频给的最优值</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
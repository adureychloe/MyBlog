<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">PMCC 结构：一张 LEAPS call 代替 100 股</text><text x="30" y="72" font-size="15" fill="#667">依 4:28 对照表与 5:43 持仓（HOOD）重画</text><rect x="30" y="95" width="430" height="250" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="121" font-size="16" fill="#222" font-weight="bold">传统备兑 Covered Call</text><text x="42" y="144.2" font-size="16" fill="#222">长：100 股 HOOD @ $68.90</text><text x="42" y="167.39999999999998" font-size="16" fill="#222">短：80 call，40 DTE，收 $267</text><text x="42" y="190.59999999999997" font-size="16" fill="#222">占用 $6,890</text><rect x="500" y="95" width="430" height="250" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/><text x="512" y="121" font-size="16" fill="#222" font-weight="bold">穷人备兑 PMCC</text><text x="512" y="144.2" font-size="16" fill="#222">长：1 张 50-strike call，656 DTE</text><text x="512" y="167.39999999999998" font-size="16" fill="#222">     （entry 34.75，链上 delta 0.81）</text><text x="512" y="190.59999999999997" font-size="16" fill="#222">短：同一张 80 call，40 DTE，收 $267</text><text x="512" y="213.79999999999995" font-size="16" fill="#222">占用 $3,475</text><rect x="30" y="365" width="900" height="200" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="391" font-size="16" fill="#222" font-weight="bold">（笔者补充）怎么理解</text><text x="42" y="414.2" font-size="16" fill="#222">长腿远月、深 ITM → 涨跌像股票；短腿近月 OTM → 收时间价值。</text><text x="42" y="437.4" font-size="16" fill="#222">两腿到期不同、行权价不同 = 对角价差（Diagonal）的一种。</text><text x="42" y="460.59999999999997" font-size="16" fill="#222">和 10-08 对角价差篇是同一家族，只是这里把长腿当「股票替身」。</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
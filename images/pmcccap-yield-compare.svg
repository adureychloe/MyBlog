<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">同一张短 call，占用不同 → yield 不同</text><text x="30" y="72" font-size="15" fill="#667">数字全部来自 4:28 对照表（HOOD $68.90，短 80C 40 DTE）</text><text x="40" y="150" font-size="18" fill="#222" text-anchor="start" font-weight="bold">传统 CC</text><rect x="150" y="120" width="560.0" height="46" rx="6" fill="#3b6fb6"/><text x="720.0" y="150" font-size="16" fill="#333" text-anchor="start">占用 $6,890</text><text x="150" y="192" font-size="15" fill="#444" text-anchor="start">Premium $267 · Yield 3.8% · Max Loss $6,623</text><text x="40" y="270" font-size="18" fill="#222" text-anchor="start" font-weight="bold">PMCC</text><rect x="150" y="240" width="282.43831640058056" height="46" rx="6" fill="#27ae60"/><text x="442.43831640058056" y="270" font-size="16" fill="#333" text-anchor="start">占用 $3,475</text><text x="150" y="312" font-size="15" fill="#444" text-anchor="start">Premium $267 · Yield 7.7% · Max Loss $3,208</text><rect x="30" y="370" width="430" height="200" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="396" font-size="16" fill="#222" font-weight="bold">（推算）核对</text><text x="42" y="419.2" font-size="16" fill="#222">267 ÷ 6,890 ≈ 3.87%</text><text x="42" y="442.4" font-size="16" fill="#222">267 ÷ 3,475 ≈ 7.68%</text><text x="42" y="465.59999999999997" font-size="16" fill="#222">6,890 − 267 = 6,623</text><text x="42" y="488.79999999999995" font-size="16" fill="#222">3,475 − 267 = 3,208</text><rect x="500" y="370" width="430" height="200" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="512" y="396" font-size="16" fill="#222" font-weight="bold">（笔者补充）别误读</text><text x="512" y="419.2" font-size="16" fill="#222">这是单期权利金 ÷ 初始占用，不是年化。</text><text x="512" y="442.4" font-size="16" fill="#222">视频没给年化公式。</text><text x="512" y="465.59999999999997" font-size="16" fill="#222">PMCC 下行仍可能亏掉长腿大部分价值；</text><text x="512" y="488.79999999999995" font-size="16" fill="#222">「yield 高」≠「更安全」。</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
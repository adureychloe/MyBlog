<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">短 call 被指派：两个选项</text><text x="30" y="72" font-size="15" fill="#667">依 15:03 / 15:22 If You Get Assigned 幻灯与 15:58 计算器 15.85 重画</text><rect x="30" y="95" width="900" height="80" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="121" font-size="16" fill="#222" font-weight="bold">被指派 = 按短腿行权价空 100 股；最大风险不变，别慌（幻灯原意）</text><rect x="30" y="195" width="430" height="230" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="42" y="221" font-size="16" fill="#222" font-weight="bold">✗ Option 1：Exercise the LEAPS</text><text x="42" y="244.2" font-size="16" fill="#222">行权长腿拿 100 股补空头</text><text x="42" y="267.4" font-size="16" fill="#222">简单，但烧掉 LEAPS 剩余外在价值</text><text x="42" y="290.59999999999997" font-size="16" fill="#222">幻灯：Likely wasteful</text><rect x="500" y="195" width="430" height="230" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/><text x="512" y="221" font-size="16" fill="#222" font-weight="bold">✓ Option 2 (Best)</text><text x="512" y="244.2" font-size="16" fill="#222">Sell LEAPS + Buy Back Stock</text><text x="512" y="267.4" font-size="16" fill="#222">同时卖掉长 call、买回 100 股</text><text x="512" y="290.59999999999997" font-size="16" fill="#222">保留外在价值</text><text x="512" y="313.79999999999995" font-size="16" fill="#222">幻灯：Best for P/L</text><rect x="30" y="445" width="900" height="120" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="471" font-size="16" fill="#222" font-weight="bold">（推算）烧掉多少？与口播、计算器 15.85 一致</text><text x="42" y="494.2" font-size="16" fill="#222">内在价值 68.90 − 50 = 18.90；外在价值 34.75 − 18.90 = 15.85；× 100 ≈ $1,585</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
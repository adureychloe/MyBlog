<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">管理 PMCC：三种情况三种做法</text><text x="30" y="72" font-size="15" fill="#667">依 10:32 / 11:00 / 11:22 Managing Your PMCC 幻灯与 13:27 滚动建模重画</text><rect x="60" y="90" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">短腿到期仍 OTM → Keep premium, sell a new short call</text><text x="72" y="139.2" font-size="16" fill="#222">Repeat the cycle：留下权利金，再卖下一张</text><line x1="480" y1="177.2" x2="480" y2="191.2" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="193.2" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="219.2" font-size="16" fill="#222" font-weight="bold">股价逼近短腿 → Roll up and out for a credit</text><text x="72" y="242.39999999999998" font-size="16" fill="#222">买回短 call，卖更高行权、更远到期；片中：买回 70C @$2.96 + 卖 85C @$3.20 = +$24 信贷</text><line x1="480" y1="280.4" x2="480" y2="294.4" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="296.4" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="322.4" font-size="16" fill="#222" font-weight="bold">为什么不是 90C？片中 74 DTE 的 90C 只有 $2.33 &lt; 买回 $2.96 → 会变借记</text><text x="72" y="345.59999999999997" font-size="16" fill="#222">所以选仍能收贷记的 85C</text><line x1="480" y1="383.59999999999997" x2="480" y2="397.59999999999997" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="399.59999999999997" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="425.59999999999997" font-size="16" fill="#222" font-weight="bold">Furthest You Can Roll：最远到与 LEAPS 同一到期</text><text x="72" y="448.79999999999995" font-size="16" fill="#222">变成牛市看涨价差（bull call spread）；短腿不能滚过长腿到期</text><line x1="480" y1="486.79999999999995" x2="480" y2="500.79999999999995" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="502.79999999999995" width="840" height="87.2" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="528.8" font-size="16" fill="#222" font-weight="bold">（笔者补充）收不到贷记怎么办？视频没展开</text><text x="72" y="552.0" font-size="16" fill="#222">可能要接受借记或直接平仓 → 本文归入观望</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
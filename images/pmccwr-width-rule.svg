<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">Strike Width Rule：借记 ≤ 宽度</text><text x="30" y="72" font-size="15" fill="#667">依 9:37 幻灯与 10:16 反例（链上 70C delta 0.53 / $6.25）重画</text><rect x="30" y="95" width="430" height="270" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/><text x="42" y="121" font-size="16" fill="#222" font-weight="bold">✓ 幻灯例</text><text x="42" y="144.2" font-size="16" fill="#222">Long 50 call + Short 90 call</text><text x="42" y="167.39999999999998" font-size="16" fill="#222">宽度 = $40</text><text x="42" y="190.59999999999997" font-size="16" fill="#222">付出 ≤ $40 才不违反规则</text><text x="42" y="213.79999999999995" font-size="16" fill="#222">幻灯：付超过 $40 → 股价冲过</text><text x="42" y="236.99999999999994" font-size="16" fill="#222">短腿后有 upside loss</text><rect x="500" y="95" width="430" height="270" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="512" y="121" font-size="16" fill="#222" font-weight="bold">✗ 10:16 反例</text><text x="512" y="144.2" font-size="16" fill="#222">Long 50C @34.75 + Short 70C @6.25</text><text x="512" y="167.39999999999998" font-size="16" fill="#222">宽度 = $20</text><text x="512" y="190.59999999999997" font-size="16" fill="#222">净借记 34.75 − 6.25 = 28.05</text><text x="512" y="213.79999999999995" font-size="16" fill="#222">借记 &gt; 宽度 → Stock $159 时</text><text x="512" y="236.99999999999994" font-size="16" fill="#222">T+0 −$126 / T+40 −$157</text><rect x="30" y="385" width="900" height="180" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="411" font-size="16" fill="#222" font-weight="bold">（笔者补充）别和 75% 宽度规则混用</text><text x="42" y="434.2" font-size="16" fill="#222">10-08 对角价差篇的尺子：借记 ≤ 宽度的 75%（更严）。</text><text x="42" y="457.4" font-size="16" fill="#222">本片尺子：借记 ≤ 全宽（底线）。</text><text x="42" y="480.59999999999997" font-size="16" fill="#222">两者都在防同一件事：上涨到短腿上方后，整笔交易不赚反亏。</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Noto Sans CJK SC, sans-serif">
<rect width="960" height="640" fill="#fff"/>
<text x="480" y="36" font-size="22" text-anchor="middle" font-weight="bold">概念：美股未开盘时交易 → 大概率输多赢少（示意）</text>

<!-- Timeline bar -->
<rect x="40" y="70" width="580" height="48" rx="6" fill="#edf2f7" stroke="#a0aec0"/>
<rect x="40" y="70" width="280" height="48" rx="6" fill="#fed7d7" stroke="#c53030" stroke-width="2"/>
<text x="180" y="100" font-size="15" text-anchor="middle" font-weight="bold" fill="#c53030">未开盘 / 盘前（Premarket）</text>
<text x="460" y="100" font-size="15" text-anchor="middle" fill="#2d3748">常规交易时段（约 9:30 ET 起）</text>
<line x1="320" y1="60" x2="320" y2="130" stroke="#2b6cb0" stroke-width="2" stroke-dasharray="4 3"/>
<text x="320" y="148" font-size="13" text-anchor="middle" fill="#2b6cb0">开盘</text>

<!-- Left panel: premarket trade -->
<rect x="40" y="170" width="400" height="290" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="240" y="200" font-size="17" text-anchor="middle" font-weight="bold" fill="#c53030">未开盘时下单（我的原话场景）</text>

<text x="60" y="235" font-size="14" fill="#4a5568">盘口示意（无真实价）：</text>
<rect x="60" y="250" width="90" height="36" rx="4" fill="#c6f6d5" stroke="#2f855a"/>
<text x="105" y="273" font-size="13" text-anchor="middle">买一</text>
<rect x="220" y="250" width="90" height="36" rx="4" fill="#fed7d7" stroke="#c53030"/>
<text x="265" y="273" font-size="13" text-anchor="middle">卖一</text>
<line x1="155" y1="268" x2="215" y2="268" stroke="#dd6b20" stroke-width="3"/>
<text x="185" y="258" font-size="12" text-anchor="middle" fill="#c05600">价差宽</text>
<text x="60" y="315" font-size="14" fill="#4a5568">参与者少 · 报价薄 · 容易滑点</text>

<text x="60" y="350" font-size="15" font-weight="bold" fill="#c53030">我的经验：基本输多赢少</text>
<!-- Outcome flow: text above, arrow below, circle at right -->
<text x="60" y="385" font-size="14" fill="#c53030">大概率不利结果</text>
<line x1="60" y1="400" x2="200" y2="400" stroke="#c53030" stroke-width="2" marker-end="url(#arrowRed)"/>
<circle cx="270" cy="400" r="32" fill="#fff" stroke="#c53030" stroke-width="3"/>
<text x="270" y="396" font-size="13" text-anchor="middle" fill="#c53030">输多</text>
<text x="270" y="412" font-size="13" text-anchor="middle" fill="#c53030">赢少</text>

<!-- Right: 笔者补充 -->
<rect x="470" y="170" width="450" height="290" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/>
<text x="490" y="205" font-size="17" font-weight="bold" fill="#dd6b20">笔者补充</text>
<text x="490" y="245" font-size="14">· 「未开盘」= 常规时段开盘前</text>
<text x="502" y="268" font-size="14">（美股通常约 9:30 ET 前）</text>
<text x="490" y="305" font-size="14">· 盘前流动性通常更薄，</text>
<text x="502" y="328" font-size="14">买卖价差往往更宽</text>
<text x="490" y="365" font-size="14">· 隔夜消息容易造成跳空，</text>
<text x="502" y="388" font-size="14">价格可能剧烈跳动</text>
<text x="490" y="425" font-size="14">· 「输多赢少」是个人经验，</text>
<text x="502" y="448" font-size="14">不是统计胜率</text>

<text x="480" y="510" font-size="15" text-anchor="middle" fill="#4a5568">示意图，无真实价格 / 无胜率数字；红色区 = 未开盘交易场景</text>
<text x="480" y="540" font-size="14" text-anchor="middle" fill="#718096">原话：「以后不要在做美股未开盘时的交易了，基本输多赢少」</text>
<text x="480" y="580" font-size="13" text-anchor="middle" fill="#a0aec0">红框 = 原话场景；橙色虚线框 = 笔者补充</text>

<defs>
  <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#c53030"/>
  </marker>
</defs>
</svg>

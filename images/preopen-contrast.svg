<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Noto Sans CJK SC, sans-serif">
<rect width="960" height="640" fill="#fff"/>
<text x="480" y="36" font-size="22" text-anchor="middle" font-weight="bold">对比：未开盘下单 vs 等常规开盘后再做（示意）</text>

<!-- LEFT: bad path -->
<rect x="30" y="60" width="440" height="430" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
<text x="250" y="95" font-size="18" text-anchor="middle" font-weight="bold" fill="#c53030">路径 A：未开盘就交易</text>

<text x="50" y="130" font-size="14" fill="#4a5568">盘前稀疏报价（示意）</text>
<g stroke="#a0aec0" stroke-width="1.5">
  <line x1="70" y1="160" x2="70" y2="220"/><rect x="63" y="175" width="14" height="30" fill="#e53e3e" stroke="#c53030"/>
  <line x1="110" y1="150" x2="110" y2="240"/><rect x="103" y="180" width="14" height="40" fill="#38a169" stroke="#2f855a"/>
  <line x1="150" y1="140" x2="150" y2="230"/><rect x="143" y="155" width="14" height="50" fill="#e53e3e" stroke="#c53030"/>
  <line x1="190" y1="130" x2="190" y2="250"/><rect x="183" y="160" width="14" height="55" fill="#38a169" stroke="#2f855a"/>
</g>
<!-- Circle on 3rd candle, label BELOW candles to avoid overlap -->
<circle cx="150" cy="180" r="22" fill="none" stroke="#c53030" stroke-width="3"/>
<text x="50" y="275" font-size="14" fill="#c53030" font-weight="bold">↓ 在此下单 —— 我的原话：基本输多赢少</text>

<rect x="50" y="300" width="390" height="165" rx="6" fill="#fff" stroke="#e53e3e" stroke-dasharray="4 3"/>
<text x="70" y="330" font-size="14" fill="#4a5568">常见不利情形（示意，非统计）：</text>
<text x="70" y="360" font-size="14">· 价差宽 → 一进场就吃亏</text>
<text x="70" y="390" font-size="14">· 消息跳空 → 方向瞬间反转</text>
<text x="70" y="420" font-size="14">· 开盘后流动性涌入，盘前走势作废</text>

<!-- RIGHT: good path -->
<rect x="490" y="60" width="440" height="430" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
<text x="710" y="95" font-size="18" text-anchor="middle" font-weight="bold" fill="#2f855a">路径 B：等常规开盘后再做</text>

<rect x="520" y="120" width="380" height="36" rx="4" fill="#edf2f7"/>
<rect x="520" y="120" width="140" height="36" rx="4" fill="#fed7d7"/>
<text x="590" y="143" font-size="13" text-anchor="middle" fill="#c53030">盘前只看</text>
<text x="780" y="143" font-size="13" text-anchor="middle" fill="#2f855a">开盘后可交易</text>
<line x1="660" y1="110" x2="660" y2="165" stroke="#2b6cb0" stroke-width="2"/>
<text x="660" y="180" font-size="12" text-anchor="middle" fill="#2b6cb0">9:30 ET 开盘</text>

<text x="520" y="210" font-size="14" fill="#4a5568">开盘后更密的报价（示意）</text>
<g stroke="#2f855a" stroke-width="1.5">
  <line x1="540" y1="230" x2="540" y2="290"/><rect x="533" y="245" width="14" height="30" fill="#38a169" stroke="#2f855a"/>
  <line x1="580" y1="235" x2="580" y2="295"/><rect x="573" y="250" width="14" height="35" fill="#38a169" stroke="#2f855a"/>
  <line x1="620" y1="225" x2="620" y2="285"/><rect x="613" y="240" width="14" height="30" fill="#e53e3e" stroke="#c53030"/>
  <line x1="660" y1="220" x2="660" y2="300"/><rect x="653" y="235" width="14" height="45" fill="#38a169" stroke="#2f855a"/>
  <line x1="700" y1="230" x2="700" y2="290"/><rect x="693" y="245" width="14" height="30" fill="#38a169" stroke="#2f855a"/>
</g>
<circle cx="660" cy="250" r="20" fill="none" stroke="#2b6cb0" stroke-width="3"/>
<text x="520" y="325" font-size="14" fill="#2b6cb0" font-weight="bold">↑ 等确认后再进（开盘后）</text>

<rect x="520" y="345" width="380" height="120" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/>
<text x="540" y="375" font-size="15" font-weight="bold" fill="#dd6b20">笔者补充</text>
<text x="540" y="405" font-size="13">· 可等开盘后前几分钟确认方向</text>
<text x="540" y="428" font-size="13">· 盘前可用来标关键位，但不下单</text>
<text x="540" y="451" font-size="13">· 搭配 4H 趋势 + 15/30m 进场规则</text>

<text x="480" y="530" font-size="15" text-anchor="middle" fill="#4a5568">示意图，无真实价格；左红 = 未开盘交易（原话要避免）；右绿 = 等开盘</text>
<text x="480" y="560" font-size="13" text-anchor="middle" fill="#a0aec0">橙色虚线框 = 笔者补充；不是视频或统计结论</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="960" height="540" fill="#fff"/>
<text x="480" y="34" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">正例：跟踪抬高 · 反例：非趋势市假信号</text>
<!-- left good -->
<rect x="30" y="55" width="450" height="300" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="255" y="90" font-size="17" fill="#15803d" text-anchor="middle" font-weight="bold">正例：升势中点列只升不降</text>
<text x="255" y="115" font-size="13" fill="#64748b" text-anchor="middle">像 trailing stop · 抛物抬高（~3:18）</text>
<!-- ascending dots -->
<circle cx="80" cy="300" r="5" fill="#2563eb"/><circle cx="120" cy="280" r="5" fill="#2563eb"/><circle cx="160" cy="255" r="5" fill="#2563eb"/><circle cx="200" cy="225" r="5" fill="#2563eb"/><circle cx="240" cy="200" r="5" fill="#2563eb"/><circle cx="280" cy="175" r="5" fill="#2563eb"/><circle cx="320" cy="155" r="5" fill="#2563eb"/><circle cx="360" cy="140" r="5" fill="#2563eb"/><circle cx="400" cy="130" r="5" fill="#2563eb"/>
<path d="M80,300 L400,130" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="100" y="220" width="14" height="50" fill="#22c55e"/><rect x="180" y="175" width="14" height="55" fill="#22c55e"/><rect x="260" y="140" width="14" height="50" fill="#22c55e"/><rect x="340" y="115" width="14" height="45" fill="#22c55e"/>
<text x="255" y="335" font-size="13" fill="#166534" text-anchor="middle">点在价下且逐步抬高 → 跟踪止损思路</text>
<!-- right bad -->
<rect x="500" y="55" width="430" height="300" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="715" y="90" font-size="17" fill="#b91c1c" text-anchor="middle" font-weight="bold">反例：非趋势市易假信号</text>
<text x="715" y="115" font-size="13" fill="#64748b" text-anchor="middle">字幕 whipsaws / false signals（~2:01–2:04）</text>
<!-- choppy flips -->
<circle cx="540" cy="200" r="4" fill="#2563eb"/><circle cx="570" cy="190" r="4" fill="#2563eb"/>
<circle cx="600" cy="220" r="4" fill="#2563eb"/><circle cx="630" cy="210" r="4" fill="#2563eb"/>
<circle cx="660" cy="240" r="4" fill="#2563eb"/><circle cx="690" cy="200" r="4" fill="#2563eb"/>
<circle cx="720" cy="230" r="4" fill="#2563eb"/><circle cx="750" cy="215" r="4" fill="#2563eb"/>
<circle cx="780" cy="250" r="4" fill="#2563eb"/><circle cx="810" cy="225" r="4" fill="#2563eb"/>
<circle cx="840" cy="245" r="4" fill="#2563eb"/><circle cx="870" cy="220" r="4" fill="#2563eb"/>
<rect x="550" y="205" width="12" height="30" fill="#94a3b8"/><rect x="610" y="200" width="12" height="28" fill="#ef4444"/><rect x="670" y="195" width="12" height="32" fill="#22c55e"/><rect x="730" y="210" width="12" height="28" fill="#ef4444"/><rect x="790" y="205" width="12" height="30" fill="#22c55e"/><rect x="850" y="215" width="12" height="25" fill="#ef4444"/>
<text x="715" y="300" font-size="13" fill="#991b1b" text-anchor="middle">横盘时点频繁翻侧 → 抽鞭</text>
<text x="715" y="325" font-size="13" fill="#991b1b" text-anchor="middle">片中：趋势市更好用；勿单独用</text>
<!-- bottom -->
<rect x="30" y="380" width="900" height="130" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
<text x="50" y="415" font-size="15" fill="#c2410c" font-weight="bold">（笔者补充，非片中原话）</text>
<text x="50" y="445" font-size="14" fill="#7c2d12">许多平台默认 AF：起始 0.02、每次创新高/低 +0.02、上限 0.20。</text>
<text x="50" y="475" font-size="14" fill="#7c2d12">本片 Inputs 对话框写的是 Increment = 0.01（不是 0.02）。对照其他教材时请单独标注来源。</text>
<text x="50" y="500" font-size="13" fill="#9a3412">片中没有展示 AF 公式板；Point Width 2 是点粗细，不是加速因子（推算）。</text>
</svg>
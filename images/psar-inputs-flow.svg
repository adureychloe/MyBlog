<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="960" height="500" fill="#fff"/>
<text x="480" y="36" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">本片 Inputs（画面）与学习步骤</text>
<!-- inputs card -->
<rect x="60" y="70" width="360" height="220" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="240" y="105" font-size="17" fill="#1e293b" text-anchor="middle" font-weight="bold">PSAR Inputs（~4:44）</text>
<rect x="90" y="125" width="300" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="110" y="148" font-size="15" fill="#222">Start</text>
<text x="340" y="148" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold">0.02</text>
<rect x="90" y="170" width="300" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="110" y="193" font-size="15" fill="#222">Increment</text>
<text x="340" y="193" font-size="15" fill="#b45309" text-anchor="end" font-weight="bold">0.01</text>
<rect x="90" y="215" width="300" height="36" rx="6" fill="#fff" stroke="#94a3b8"/>
<text x="110" y="238" font-size="15" fill="#222">Maximum</text>
<text x="340" y="238" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold">0.2</text>
<text x="240" y="275" font-size="12" fill="#64748b" text-anchor="middle">Point Width 2 · 未勾 Buy/Sell Labels</text>
<!-- flow -->
<defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<rect x="480" y="70" width="200" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="580" y="100" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="bold">① 认点位</text>
<text x="580" y="122" font-size="12" fill="#222" text-anchor="middle">跌上 / 涨下</text>
<line x1="680" y1="105" x2="720" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="720" y="70" width="200" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="820" y="100" font-size="14" fill="#15803d" text-anchor="middle" font-weight="bold">② 看翻侧</text>
<text x="820" y="122" font-size="12" fill="#222" text-anchor="middle">趋势可能结束</text>
<rect x="480" y="170" width="200" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="580" y="200" font-size="14" fill="#b45309" text-anchor="middle" font-weight="bold">③ 当跟踪止损</text>
<text x="580" y="222" font-size="12" fill="#222" text-anchor="middle">升势点列抬高</text>
<line x1="680" y1="205" x2="720" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#a2)"/>
<rect x="720" y="170" width="200" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="820" y="200" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="bold">④ 配其他工具</text>
<text x="820" y="222" font-size="12" fill="#222" text-anchor="middle">勿单独决策</text>
<!-- bottom judgments -->
<rect x="60" y="320" width="400" height="150" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="260" y="355" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">采用</text>
<text x="80" y="385" font-size="13" fill="#222">Stop And Reverse 读法；跟踪止损思路</text>
<text x="80" y="410" font-size="13" fill="#222">非趋势市假信号；不要单独用</text>
<text x="80" y="435" font-size="13" fill="#222">Wilder 书 + RSI/ATR/ADX 同列</text>
<text x="80" y="455" font-size="12" fill="#64748b">口播可调 Increment / Maximum</text>
<rect x="500" y="320" width="400" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="700" y="355" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">弃用 / 观望</text>
<text x="520" y="385" font-size="13" fill="#222">弃用：发明公式板；把 0.01 当全球唯一</text>
<text x="520" y="410" font-size="13" fill="#222">弃用：单靠翻点买卖；无价轴示意当入场</text>
<text x="520" y="435" font-size="13" fill="#222">观望：机械翻点出场（无回测）</text>
<text x="520" y="455" font-size="12" fill="#64748b">片尾 VWAP/Doji 推荐未看</text>
</svg>
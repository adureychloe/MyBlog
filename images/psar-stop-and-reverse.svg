<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">
<rect width="960" height="540" fill="#fff"/>
<text x="480" y="36" font-size="22" fill="#222" text-anchor="middle" font-weight="bold">Parabolic SAR = Stop And Reverse（停止并反向）</text>
<text x="480" y="62" font-size="13" fill="#64748b" text-anchor="middle">片中大字卡 · 无价轴示意 · 蓝点跟着价格走</text>
<!-- downtrend left -->
<text x="180" y="100" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="bold">下跌：点在价上方</text>
<!-- dots above -->
<circle cx="80" cy="140" r="5" fill="#2563eb"/><circle cx="110" cy="155" r="5" fill="#2563eb"/><circle cx="140" cy="175" r="5" fill="#2563eb"/><circle cx="170" cy="200" r="5" fill="#2563eb"/><circle cx="200" cy="230" r="5" fill="#2563eb"/><circle cx="230" cy="265" r="5" fill="#2563eb"/>
<!-- red candles -->
<rect x="95" y="170" width="14" height="50" fill="#ef4444"/><line x1="102" y1="160" x2="102" y2="230" stroke="#991b1b" stroke-width="2"/>
<rect x="125" y="190" width="14" height="55" fill="#ef4444"/><line x1="132" y1="180" x2="132" y2="255" stroke="#991b1b" stroke-width="2"/>
<rect x="155" y="215" width="14" height="60" fill="#ef4444"/><line x1="162" y1="205" x2="162" y2="285" stroke="#991b1b" stroke-width="2"/>
<rect x="185" y="245" width="14" height="55" fill="#ef4444"/><line x1="192" y1="235" x2="192" y2="310" stroke="#991b1b" stroke-width="2"/>
<!-- uptrend middle -->
<text x="480" y="100" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">上涨：点在价下方</text>
<circle cx="320" cy="340" r="5" fill="#2563eb"/><circle cx="360" cy="320" r="5" fill="#2563eb"/><circle cx="400" cy="295" r="5" fill="#2563eb"/><circle cx="440" cy="265" r="5" fill="#2563eb"/><circle cx="480" cy="235" r="5" fill="#2563eb"/><circle cx="520" cy="210" r="5" fill="#2563eb"/><circle cx="560" cy="190" r="5" fill="#2563eb"/>
<rect x="340" y="250" width="14" height="45" fill="#22c55e"/><line x1="347" y1="240" x2="347" y2="305" stroke="#166534" stroke-width="2"/>
<rect x="380" y="225" width="14" height="50" fill="#22c55e"/><line x1="387" y1="215" x2="387" y2="285" stroke="#166534" stroke-width="2"/>
<rect x="420" y="195" width="14" height="50" fill="#22c55e"/><line x1="427" y1="185" x2="427" y2="255" stroke="#166534" stroke-width="2"/>
<rect x="460" y="165" width="14" height="50" fill="#22c55e"/><line x1="467" y1="155" x2="467" y2="225" stroke="#166534" stroke-width="2"/>
<rect x="500" y="145" width="14" height="45" fill="#22c55e"/><line x1="507" y1="135" x2="507" y2="200" stroke="#166534" stroke-width="2"/>
<!-- flip arrow -->
<path d="M260,300 Q290,360 320,340" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="290" y="380" font-size="13" fill="#b45309" text-anchor="middle">翻侧</text>
<!-- flip at peak -->
<text x="780" y="100" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">高点翻到上方 → 升势结束示意</text>
<circle cx="640" cy="175" r="5" fill="#2563eb"/><circle cx="680" cy="155" r="5" fill="#2563eb"/><circle cx="720" cy="140" r="5" fill="#2563eb"/>
<!-- flip above -->
<circle cx="760" cy="130" r="6" fill="#2563eb" stroke="#f59e0b" stroke-width="2"/>
<circle cx="800" cy="160" r="5" fill="#2563eb"/><circle cx="840" cy="195" r="5" fill="#2563eb"/><circle cx="880" cy="235" r="5" fill="#2563eb"/>
<rect x="700" y="150" width="14" height="40" fill="#22c55e"/><line x1="707" y1="140" x2="707" y2="200" stroke="#166534" stroke-width="2"/>
<rect x="740" y="155" width="14" height="55" fill="#ef4444"/><line x1="747" y1="145" x2="747" y2="220" stroke="#991b1b" stroke-width="2"/>
<rect x="780" y="185" width="14" height="50" fill="#ef4444"/><line x1="787" y1="175" x2="787" y2="245" stroke="#991b1b" stroke-width="2"/>
<rect x="820" y="220" width="14" height="45" fill="#ef4444"/><line x1="827" y1="210" x2="827" y2="275" stroke="#991b1b" stroke-width="2"/>
<!-- boxes -->
<rect x="40" y="410" width="420" height="100" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="250" y="445" font-size="15" fill="#15803d" text-anchor="middle" font-weight="bold">片中用途</text>
<text x="60" y="475" font-size="14" fill="#222">看趋势可能在哪里结束；翻侧作退出示意</text>
<text x="60" y="500" font-size="13" fill="#64748b">字幕：like a trailing stop loss（~3:10）</text>
<rect x="480" y="410" width="440" height="100" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="700" y="445" font-size="15" fill="#334155" text-anchor="middle" font-weight="bold">出处（画面）</text>
<text x="500" y="475" font-size="13" fill="#222">J. Welles Wilder Jr.《New Concepts…》</text>
<text x="500" y="500" font-size="13" fill="#222">同列：Parabolic SAR, RSI, ATR, ADX</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <text x="480" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">红旗降仓阶梯：黄灯减半，红灯砍到两成五</text>
  <text x="480" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">机械执行 · 先降仓再谈「我还能不能做」</text>

  <!-- step 0 -->
  <rect x="40" y="90" width="200" height="200" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#166534">0 旗</text>
  <text x="140" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">正常仓位</text>
  <text x="140" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#16a34a">100%</text>
  <text x="140" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">仍每周自评</text>
  <text x="140" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">写三行日志</text>

  <path d="M250 190 L285 190" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="285,190 273,182 273,198" fill="#94a3b8"/>

  <!-- yellow -->
  <rect x="300" y="90" width="200" height="200" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#a16207">1–2 旗 · 黄灯</text>
  <text x="400" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">仓位约 −50%</text>
  <text x="400" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#ca8a04">≈50%</text>
  <text x="400" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">逐日复盘红旗</text>
  <text x="400" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">别「再扛一把」</text>

  <path d="M510 190 L545 190" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="545,190 533,182 533,198" fill="#94a3b8"/>

  <!-- red -->
  <rect x="560" y="90" width="180" height="200" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="650" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#c2410c">3–4 旗 · 红灯</text>
  <text x="650" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">仓位 ≤25%</text>
  <text x="650" y="190" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#ea580c">≤25%</text>
  <text x="650" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">逐项修复</text>
  <text x="650" y="255" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">或更低</text>

  <path d="M750 190 L785 190" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="785,190 773,182 773,198" fill="#94a3b8"/>

  <!-- freeze -->
  <rect x="800" y="90" width="140" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
  <text x="870" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#991b1b">≥5 危机</text>
  <text x="870" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">冻结交易</text>
  <text x="870" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#dc2626">STOP</text>
  <text x="870" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">书面计划前</text>
  <text x="870" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">不恢复</text>

  <rect x="40" y="320" width="880" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#0f172a">协议要点：触发即机械降仓 · 冻结时长因人而异 · 满仓无视堆叠红旗 = 弃用</text>
  <text x="480" y="368" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">纪律协议，不是预测指标</text>

  <text x="480" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">SMB 黄/红/危机降仓协议 · 教学示意</text>
</svg>

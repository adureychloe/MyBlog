<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700">两种速算：Straddle×0.85 与 (Straddle+Strangle)/2</text>
  <text x="480" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">画面约 7:01–9:20 · 交叉验证，不当方向信号</text>

  <!-- method 1 -->
  <rect x="40" y="70" width="420" height="240" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="250" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">方法一（约 7:01）</text>
  <text x="250" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">ATM Straddle × 0.85</text>
  <rect x="90" y="160" width="320" height="50" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="250" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1e40af">$10 × 0.85 = $8.50</text>
  <text x="250" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">现价 $100 → 约 $91.50 – $108.50</text>
  <text x="250" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">V 型图：$100 Call$5 + Put$5 = $10</text>

  <!-- method 2 -->
  <rect x="500" y="70" width="420" height="240" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="710" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#166534">方法二（约 8:12）</text>
  <text x="710" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">(Straddle + Strangle) / 2</text>
  <rect x="550" y="160" width="320" height="50" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="710" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#14532d">($10 + $6) / 2 = $8</text>
  <text x="710" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">95/105 Strangle=$6 → 约 $92–$108</text>
  <text x="710" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">交叉验证快筛</text>

  <rect x="40" y="335" width="880" height="70" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="480" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">弃用：当方向预测 / 确定性围栏 / 独立信号；忽略权利金与 BE</text>
  <text x="480" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Straddle BE 例约 90–110（画面约 1:17–3:02）</text>

  <text x="480" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rewatch 教学示意 · 数字为口播例 · 非投资建议</text>
</svg>

  <text x="500" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Nearby</text>
  <text x="500" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">清算簇同侧？</text>
  <text x="500" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Coinglass 密带</text>

  <path d="M585 150 L610 150" stroke="#94a3b8" stroke-width="2"/><polygon points="610,150 600,144 600,156" fill="#94a3b8"/>

  <rect x="620" y="80" width="150" height="140" rx="10" fill="#e0f2fe" stroke="#38bdf8"/>

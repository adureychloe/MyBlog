  <text x="300" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">升/降都要读</text>
  <text x="300" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">永续口径</text>

  <path d="M385 150 L410 150" stroke="#94a3b8" stroke-width="2"/><polygon points="410,150 400,144 400,156" fill="#94a3b8"/>

  <rect x="420" y="80" width="160" height="140" rx="10" fill="#fee2e2" stroke="#f87171"/>

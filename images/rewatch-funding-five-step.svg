  <text x="695" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#0369a1">Losing Mom.</text>
  <text x="695" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">动能转弱？</text>
  <text x="695" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">结构确认</text>

  <path d="M775 150 L800 150" stroke="#94a3b8" stroke-width="2"/><polygon points="800,150 790,144 790,156" fill="#94a3b8"/>


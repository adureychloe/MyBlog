  <text x="875" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#166534">Setup</text>
  <text x="875" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">有 setup</text>
  <text x="875" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">再谈行动</text>

  <rect x="40" y="250" width="880" height="100" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="480" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">弃用：单凭费率正负/极端逆势开仓 · 无 Trade Setup</text>
  <text x="480" y="315" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#166534">采用：Funding×OI + 清算簇 + 价格动能联立；缺确认则观望</text>

  <text x="480" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rewatch 教学示意 · 片尾清单 · 加密高杠杆风险极高</text>

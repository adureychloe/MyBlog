<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">五步清单（画面约 5:49–6:09）</text>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Funding Extreme → OI Rising → Liquidations Nearby → Price Losing Momentum → Trade Setup</text>

  <rect x="20" y="80" width="160" height="140" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="100" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">1. Funding</text>
  <text x="100" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#92400e">Extreme</text>
  <text x="100" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#334155">极端正/负</text>
  <text x="100" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">看持续不只尖刺</text>

  <path d="M185 150 L210 150" stroke="#94a3b8" stroke-width="2"/><polygon points="210,150 200,144 200,156" fill="#94a3b8"/>

  <rect x="220" y="80" width="160" height="140" rx="10" fill="#ede9fe" stroke="#a78bfa"/>

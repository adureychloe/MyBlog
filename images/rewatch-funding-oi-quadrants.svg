<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Funding × OI 四象限（画面约 4:34）</text>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">温度计不是信号 · 必须与清算簇、价格动能联立</text>

  <!-- axes -->
  <line x1="480" y1="80" x2="480" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="230" x2="880" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <text x="900" y="235" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">OI →</text>
  <text x="490" y="75" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">Funding ↑</text>

  <!-- Q1 Funding up OI up -->
  <rect x="500" y="90" width="360" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="680" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#92400e">Funding↑ + OI↑</text>
  <text x="680" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">激进多头加仓</text>
  <text x="680" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">可助涨，也堆脆弱性</text>

  <!-- Q2 Funding down OI up -->
  <rect x="100" y="90" width="360" height="120" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="280" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Funding↓ + OI↑</text>
  <text x="280" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">激进空头加仓</text>
  <text x="280" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">空挤燃料累积</text>

  <!-- Q3 Funding down OI down -->
  <rect x="100" y="250" width="360" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="280" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">Funding↓ + OI↓</text>
  <text x="280" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">投降 / 去杠杆平仓</text>
  <text x="280" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">偏投降平仓语境</text>

  <!-- Q4 Funding up OI down -->
  <rect x="500" y="250" width="360" height="120" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="680" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#047857">Funding↑ + OI↓</text>
  <text x="680" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">获利了结倾向</text>
  <text x="680" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">多头减仓语境</text>

  <text x="200" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">← OI 降</text>
  <text x="760" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">OI 升 →</text>
  <text x="480" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">Coinglass 清算簇（约 5:12）：密带更亮更厚 = 更密潜在清算</text>
  <text x="480" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rewatch 教学示意 · 约 4:34 画面表 · 非交易信号</text>
</svg>

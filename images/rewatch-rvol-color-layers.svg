<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <rect width="960" height="440" fill="#fff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">RVOL 颜色分层（画面约 02:28–03:18）</text>
  <text x="480" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">绿 &gt; 均量 · 黄 ≈ 均量 · 红/橙偏低 · 例 RVOL≈2.05</text>

  <rect x="60" y="90" width="260" height="200" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="190" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#166534">绿层</text>
  <text x="190" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">RVOL &gt; 均量</text>
  <text x="190" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#16a34a">参与高</text>
  <text x="190" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">突破时更可信过滤</text>

  <rect x="350" y="90" width="260" height="200" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="480" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#a16207">黄层</text>
  <text x="480" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">RVOL ≈ 均量</text>
  <text x="480" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#ca8a04">普通</text>
  <text x="480" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">中性 · 需其它确认</text>

  <rect x="640" y="90" width="260" height="200" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="770" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#c2410c">红/橙层</text>
  <text x="770" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">RVOL 偏低</text>
  <text x="770" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#ea580c">参与弱</text>
  <text x="770" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">假突破风险更高</text>

  <rect x="60" y="310" width="840" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="480" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e40af">同时段比较（约 04:08）：亚洲盘 SMALL vs 美开盘 LARGE ——比相对量，勿跨时段比绝对量</text>
  <text x="480" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">相对自身同时段均量，不是「今天柱子比昨晚高就叫放量」</text>

  <text x="480" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rewatch 教学示意 · Part 6 色层 · 非方向水晶球</text>
</svg>

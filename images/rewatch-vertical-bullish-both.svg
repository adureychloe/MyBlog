<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700">看涨两侧：Call Debit + Put Credit（画面约 5:38–6:15）</text>
  <text x="480" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">卖 Put ≠ 看跌 · Put Credit Spread 也是看涨结构</text>

  <!-- CDS -->
  <rect x="40" y="70" width="420" height="260" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="250" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Call Debit Vertical</text>
  <text x="250" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">约 1:32–4:25 · 例买 1250 / 卖 1300</text>
  <rect x="90" y="155" width="320" height="70" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="250" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e40af">50 点宽 · 约 $25 debit</text>
  <text x="250" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">最大毛利≈$50 · 净≈$25 · 风险≈$25（约 1:1）</text>
  <text x="250" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#166534">需要价格上行才赚</text>
  <text x="250" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">更吃方向移动</text>

  <!-- PCS -->
  <rect x="500" y="70" width="420" height="260" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="710" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#166534">Put Credit Vertical</text>
  <text x="710" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">约 6:59–8:15 · 卖≈75Δ / 买≈25Δ</text>
  <rect x="550" y="155" width="320" height="70" rx="8" fill="#dcfce7" stroke="#4ade80"/>
  <text x="710" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#14532d">50 点宽 · 约 $22 credit</text>
  <text x="710" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">风险约 $28 · 横盘/略涨也可赚 Theta</text>
  <text x="710" y="265" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#166534">同样是看涨偏见</text>
  <text x="710" y="295" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#991b1b">✗ 别把 PCS 当看跌</text>

  <rect x="40" y="355" width="880" height="55" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="480" y="390" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#991b1b">弃用：PCS = 看跌 · 只凭 IVR 自动下单 · 忽略最大风险上限</text>

  <text x="480" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rewatch 教学示意 · 数字为口播例 · 期权有到期与流动性风险</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <rect width="960" height="480" fill="#fff"/>
  <text x="480" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700">IV Rank 分段 + Delta 选腿 + DTE 对齐（约 13:58–22:08）</text>
  <text x="480" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">手写分段：1–30 买 / 31–50 皆可 / 51+ 卖 · 非机械开关</text>

  <!-- IVR bars -->
  <rect x="40" y="70" width="280" height="160" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="180" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">IVR 1–30</text>
  <text x="180" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">偏买 premium</text>
  <text x="180" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#1e40af">→ Call Debit</text>
  <text x="180" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">例画面 IVR 16</text>

  <rect x="340" y="70" width="280" height="160" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="480" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#475569">IVR 31–50</text>
  <text x="480" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#334155">中间区（灰）</text>
  <text x="480" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#475569">Debit / Credit 皆可</text>
  <text x="480" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">例画面 IVR 43</text>

  <rect x="640" y="70" width="280" height="160" rx="10" fill="#ffedd5" stroke="#f97316"/>
  <text x="780" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#c2410c">IVR 51+</text>
  <text x="780" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">偏卖 premium</text>
  <text x="780" y="170" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#9a3412">→ Put Credit</text>
  <text x="780" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">IV 相对贵</text>

  <!-- Delta + DTE -->
  <rect x="40" y="250" width="440" height="140" rx="10" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="260" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#7e22ce">Delta 选腿（约 18:15）</text>
  <text x="260" y="320" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">长 50Δ / 短 20Δ</text>
  <text x="260" y="348" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">或长 70Δ / 短 30Δ·20Δ（更稳）</text>
  <text x="260" y="375" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">用 Delta 标准化，别死记某股行权价</text>

  <rect x="500" y="250" width="420" height="140" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="710" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#047857">DTE 对齐结构（约 20:22）</text>
  <text x="710" y="318" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">小时级 ≈ 3–5 天</text>
  <text x="710" y="342" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">日线 squeeze~8–10 根 → 常 14–28 天</text>
  <text x="710" y="366" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#334155">周线 ≈ 40–70 天 · 留缓冲</text>

  <text x="480" y="430" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">采用：IVR 分段偏好 + Delta 选腿 + 期限对齐 + 定义最大风险</text>
  <text x="480" y="460" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#94a3b8">Rewatch 教学示意 · 松散拇指法则 · 非自动交易规则</text>
</svg>

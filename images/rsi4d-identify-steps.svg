<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">认背离四步：先换图，再配对</text><text x="30" y="72" font-size="15" fill="#667">依 2:14「只用折线图」、3:07→3:33 蜡烛改折线、5:39 Note 重画</text><rect x="60" y="90" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">1 换成折线图（line chart）</text><text x="72" y="139.2" font-size="16" fill="#222">3:07 同一例用蜡烛圈低点难辨；3:33 换折线一眼看出</text><line x1="480" y1="177.2" x2="480" y2="191.2" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="193.2" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="219.2" font-size="16" fill="#222" font-weight="bold">2 先定看低点还是高点</text><text x="72" y="242.39999999999998" font-size="16" fill="#222">Positive classical / Hidden bullish 看低点；Negative classical / Hidden bearish 看高点</text><line x1="480" y1="280.4" x2="480" y2="294.4" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="296.4" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="322.4" font-size="16" fill="#222" font-weight="bold">3 价格两点连一条线，RSI 同位置两点连一条线</text><text x="72" y="345.59999999999997" font-size="16" fill="#222">两条线方向相反 = 背离；看价是更高还是更低，RSI 是更高还是更低</text><line x1="480" y1="383.59999999999997" x2="480" y2="397.59999999999997" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="399.59999999999997" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="425.59999999999997" font-size="16" fill="#222" font-weight="bold">4 对号入座四类之一，再等确认</text><text x="72" y="448.79999999999995" font-size="16" fill="#222">classical 偏反转、hidden 偏延续；classical 要等价与 RSI 一起转</text><line x1="480" y1="486.79999999999995" x2="480" y2="500.79999999999995" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="502.79999999999995" width="840" height="87.2" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="528.8" font-size="16" fill="#222" font-weight="bold">（笔者补充）不在画面里的东西不要补</text><text x="72" y="552.0" font-size="16" fill="#222">多数图没有品种代码；不猜代码、不编入场点</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
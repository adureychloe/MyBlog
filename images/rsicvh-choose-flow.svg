<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">拿到一张图：先判断你在找哪一类</text><text x="30" y="72" font-size="15" fill="#667">依 15:17–17:09 四条 Important points 与手写 Swing / Momentum 重画</text><rect x="60" y="90" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">1 换折线图（第 1 条）</text><text x="72" y="139.2" font-size="16" fill="#222">Use only line chart while comparing RSI &amp; price</text><line x1="480" y1="177.2" x2="480" y2="191.2" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="193.2" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="219.2" font-size="16" fill="#222" font-weight="bold">2 想找反转？→ classical：只比 immediate（第 2 条）</text><text x="72" y="242.39999999999998" font-size="16" fill="#222">并记住第 3 条：classical 有时反转，有时只是 slow down</text><line x1="480" y1="280.4" x2="480" y2="294.4" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="296.4" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="322.4" font-size="16" fill="#222" font-weight="bold">3 想找延续？→ hidden：比 immediate &amp; intermediate 的 big ones（第 4 条）</text><text x="72" y="345.59999999999997" font-size="16" fill="#222">片中 Note：hidden 一般给 swing / momentum 交易者用</text><line x1="480" y1="383.59999999999997" x2="480" y2="397.59999999999997" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="399.59999999999997" width="840" height="87.2" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="425.59999999999997" font-size="16" fill="#222" font-weight="bold">（笔者补充）可配合市场结构 HH / HL / LH / LL 一起记</text><text x="72" y="448.79999999999995" font-size="16" fill="#222">classical 常在新高/新低处找拧劲；hidden 常在顺势的更高低点/更低高点处找</text><line x1="480" y1="486.79999999999995" x2="480" y2="500.79999999999995" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="502.79999999999995" width="840" height="87.2" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="528.8" font-size="16" fill="#222" font-weight="bold">4 没有量化标准的地方，靠练习</text><text x="72" y="552.0" font-size="16" fill="#222">「big ones」多大算大？视频没给数字 → 本文归入观望</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
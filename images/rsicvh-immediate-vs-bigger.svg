<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">Classical 比「邻近点」，Hidden 比「大摆动」</text><text x="30" y="72" font-size="15" fill="#667">依 5:39 / 6:22 Note 与 10:38 / 11:47 文案、15:17 Important points 重画</text><rect x="30" y="90" width="440" height="330" rx="8" fill="#fff" stroke="#bbb"/><rect x="490" y="90" width="440" height="330" rx="8" fill="#fff" stroke="#bbb"/><text x="42" y="116" font-size="15" fill="#1f2d3d" text-anchor="start" font-weight="bold">Classical：immediate（挨着的两个低点）</text><polyline points="50,170 120,260 170,200 230,300 290,210 360,250 450,160" fill="none" stroke="#7f8fa6" stroke-width="2"/><polyline points="230,300 360,250" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 4"/><text x="250" y="330" font-size="13" fill="#c0392b" text-anchor="start">✗ 隔太远（6:22 弯箭头）</text><polyline points="120,260 230,300" fill="none" stroke="#c0392b" stroke-width="3"/><text x="60" y="360" font-size="13" fill="#27ae60" text-anchor="start">✓ 只比相邻的两个低点</text><text x="60" y="390" font-size="12" fill="#555" text-anchor="start">Note: Comparison between 2 lows only when they are nearby</text><text x="502" y="116" font-size="15" fill="#1f2d3d" text-anchor="start" font-weight="bold">Hidden：用 bigger ones（中间可夹小波折）</text><polyline points="510,320 560,250 590,290 630,230 660,260 700,200 740,280 780,215 820,250 910,140" fill="none" stroke="#7f8fa6" stroke-width="2"/><polyline points="590,290 740,280" fill="none" stroke="#27ae60" stroke-width="3"/><text x="560" y="330" font-size="14" fill="#27ae60" text-anchor="start" font-weight="bold">1</text><text x="745" y="305" font-size="14" fill="#27ae60" text-anchor="start" font-weight="bold">2</text><text x="505" y="360" font-size="13" fill="#555" text-anchor="start">10:38：can have multiple highs &amp; lows</text><text x="505" y="382" font-size="13" fill="#555" text-anchor="start">in between 2 points. Use the bigger ones.</text><rect x="30" y="440" width="900" height="135" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="465" font-size="15" fill="#222" font-weight="bold">15:17 Important points（第 2、4 条）</text><text x="42" y="486.75" font-size="15" fill="#222">For classical divergences look for immediate highs &amp; lows not intermediate</text><text x="42" y="508.5" font-size="15" fill="#222">For hidden divergences look for immediate &amp; intermediate highs &amp; lows but the big ones</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
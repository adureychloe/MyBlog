<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">同是 Negative classical：一个只是整理，一个是短线顶</text><text x="30" y="72" font-size="15" fill="#667">依 7:46（slowdown 波浪线）与 8:00（Short term top spotted…）两帧重画；纵向形状示意，非原价位</text><rect x="30" y="90" width="440" height="360" rx="8" fill="#fff" stroke="#bbb"/><rect x="490" y="90" width="440" height="360" rx="8" fill="#fff" stroke="#bbb"/><text x="42" y="116" font-size="15" fill="#1f2d3d" text-anchor="start" font-weight="bold">7:46 例 1：背离后横着走一阵再续涨</text><polyline points="50,330 130,250 180,200 210,220 240,190" fill="none" stroke="#7f8fa6" stroke-width="2"/><polyline points="180,200 240,190" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M240,190 q15,-12 30,0 t30,0 t30,0 t30,0 t30,0" fill="none" stroke="#2c4f9e" stroke-width="3"/><polyline points="390,190 450,120" fill="none" stroke="#7f8fa6" stroke-width="2"/><text x="60" y="400" font-size="13" fill="#555" text-anchor="start">Note: At times negative divergence</text><text x="60" y="420" font-size="13" fill="#555" text-anchor="start">is just a slow down</text><text x="502" y="116" font-size="15" fill="#1f2d3d" text-anchor="start" font-weight="bold">8:00 例 2：背离后急跌（短线顶）</text><polyline points="510,340 590,260 650,190 680,230 720,180 760,260 820,340 900,320" fill="none" stroke="#7f8fa6" stroke-width="2"/><polyline points="650,190 720,180" fill="none" stroke="#c0392b" stroke-width="3"/><text x="520" y="400" font-size="13" fill="#555" text-anchor="start">Short term top spotted with</text><text x="520" y="420" font-size="13" fill="#555" text-anchor="start">negative classical divergence</text><rect x="30" y="465" width="900" height="110" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="491" font-size="16" fill="#222" font-weight="bold">（笔者补充）反例的意义</text><text x="42" y="514.2" font-size="16" fill="#222">同一个信号，在强势上涨里可能只是减速。看到 negative classical 不等于「必顶」，更不等于逆势重仓。</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
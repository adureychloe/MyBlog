<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" font-family="Arial, sans-serif" font-size="12">
  <rect width="680" height="360" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold">Short Strangle / 卖出宽跨式（白板结构示意 · 无具体行权价）</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#555">SELLING TWO OTM OPTIONS TO CREATE A PROFIT ZONE · 对照 03 / 06 / 10 帧</text>

  <!-- profit zone bar -->
  <rect x="180" y="70" width="320" height="28" fill="#4db6ac" opacity="0.85"/>
  <text x="340" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PROFIT ZONE（P 与 C 之间）</text>
  <!-- BE labels -->
  <text x="180" y="62" text-anchor="middle" font-size="11" font-weight="bold">BREAK EVEN</text>
  <line x1="180" y1="64" x2="180" y2="70" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="62" text-anchor="middle" font-size="11" font-weight="bold">BREAK EVEN</text>
  <line x1="500" y1="64" x2="500" y2="70" stroke="#333" stroke-width="1.5"/>

  <!-- stock price line -->
  <line x1="60" y1="160" x2="620" y2="160" stroke="#444" stroke-width="2.5"/>
  <!-- ticks -->
  <line x1="180" y1="152" x2="180" y2="168" stroke="#444" stroke-width="2"/>
  <line x1="500" y1="152" x2="500" y2="168" stroke="#444" stroke-width="2"/>
  <line x1="340" y1="152" x2="340" y2="168" stroke="#1f8fb4" stroke-width="2"/>

  <!-- short put P (left) -->
  <path d="M168,168 L180,158 L192,168 L192,190 L168,190 Z" fill="#c62828"/>
  <text x="180" y="185" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">P</text>
  <text x="180" y="210" text-anchor="middle" fill="#c62828" font-weight="bold">Short Put（OTM）</text>
  <text x="180" y="226" text-anchor="middle" font-size="10" fill="#555">现价下方 · 箭头向右</text>
  <!-- arrow right from P -->
  <path d="M200,140 L300,140 L300,132 L320,148 L300,164 L300,156 L200,156 Z" fill="#26a69a"/>

  <!-- stock circle -->
  <circle cx="340" cy="160" r="10" fill="#fff" stroke="#1f8fb4" stroke-width="4"/>
  <text x="340" y="210" text-anchor="middle" font-size="12" font-weight="bold">( STOCK PRICE )</text>

  <!-- short call C (right) -->
  <path d="M488,168 L500,158 L512,168 L512,190 L488,190 Z" fill="#c62828"/>
  <text x="500" y="185" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">C</text>
  <text x="500" y="210" text-anchor="middle" fill="#c62828" font-weight="bold">Short Call（OTM）</text>
  <text x="500" y="226" text-anchor="middle" font-size="10" fill="#555">现价上方 · 箭头向左</text>
  <!-- arrow left from C -->
  <path d="M480,140 L380,140 L380,132 L360,148 L380,164 L380,156 L480,156 Z" fill="#26a69a"/>

  <!-- outside risk labels -->
  <text x="100" y="120" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">← 出界：未定义风险</text>
  <text x="100" y="136" text-anchor="middle" fill="#c62828" font-size="10">（下方像裸卖 put）</text>
  <text x="580" y="120" text-anchor="middle" fill="#c62828" font-size="11" font-weight="bold">出界：未定义风险 →</text>
  <text x="580" y="136" text-anchor="middle" fill="#c62828" font-size="10">（上方像裸卖 call）</text>

  <!-- takeaways strip -->
  <rect x="60" y="250" width="560" height="78" fill="#fff" stroke="#ccc" stroke-width="1" rx="4"/>
  <text x="70" y="270" font-size="11" font-weight="bold" fill="#1565c0">白板 TAKEAWAYS（8:56）</text>
  <text x="70" y="290" font-size="11">1. Strangle = short put + short call → profit zone</text>
  <text x="70" y="308" font-size="11">2. Undefined Risk（两边风险未封顶）</text>
  <text x="70" y="326" font-size="11">3. Max profit：到期两腿仍 OTM</text>

  <text x="640" y="348" text-anchor="end" font-size="10" fill="#777">白板无 strike / credit 数字 · 仅供学习，不构成投资建议</text>
</svg>

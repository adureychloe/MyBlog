<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" font-family="Arial, sans-serif" font-size="12">
  <rect width="680" height="240" fill="#fafafa"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold">为什么叫 Undefined Risk（白板 TAKEAWAYS · 口播举例）</text>
  <line x1="80" y1="100" x2="600" y2="100" stroke="#444" stroke-width="2.5"/>
  <rect x="200" y="70" width="280" height="24" fill="#4db6ac" opacity="0.9"/>
  <text x="340" y="87" text-anchor="middle" fill="#fff" font-weight="bold">利润区（P–C）</text>
  <path d="M188,108 L200,98 L212,108 L212,128 L188,128 Z" fill="#c62828"/>
  <text x="200" y="123" text-anchor="middle" fill="#fff" font-weight="bold">P</text>
  <path d="M468,108 L480,98 L492,108 L492,128 L468,128 Z" fill="#c62828"/>
  <text x="480" y="123" text-anchor="middle" fill="#fff" font-weight="bold">C</text>
  <circle cx="340" cy="100" r="8" fill="#fff" stroke="#1f8fb4" stroke-width="3"/>
  <text x="120" y="160" text-anchor="middle" fill="#c62828" font-weight="bold">↓ 大跌</text>
  <text x="120" y="178" text-anchor="middle" font-size="11">像裸卖 put</text>
  <text x="560" y="160" text-anchor="middle" fill="#c62828" font-weight="bold">↑ 大涨</text>
  <text x="560" y="178" text-anchor="middle" font-size="11">像裸卖 call</text>
  <text x="340" y="160" text-anchor="middle" font-size="12">口播：「It could go from 20 to 80 overnight.」</text>
  <text x="340" y="180" text-anchor="middle" font-size="11" fill="#555">这只是夸张跳空举例，不是片中的行权价或权利金</text>
  <text x="340" y="220" text-anchor="middle" font-size="10" fill="#777">对照 10-breakeven-takeaways、11-undefined-risk-20to80 · 仅供学习，不构成投资建议</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="448" viewBox="0 0 800 448" font-family="sans-serif" font-size="14"><rect width="800" height="448" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">步骤：开仓前的 skew 检查清单</text><rect x="60" y="50" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="75" font-weight="bold">① 扫同一到期日的链</text><text x="80" y="98" font-size="12">看各行权价自己的 IV（不是 Avg IV）；ATM 约 48%，155P 58%，135P ≈70%</text><path d="M400 112 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 122 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="132" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="157" font-weight="bold">② 同等 Δ 比 put 与 call</text><text x="80" y="180" font-size="12">虚值 put vs 虚值 call，判断 put skew / call skew 哪边陡</text><path d="M400 194 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 204 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="214" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="239" font-weight="bold">③ 看期限结构</text><text x="80" y="262" font-size="12">前端高于远端 = backwardation；口诀「bad things happen in backwardation」</text><path d="M400 276 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 286 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="296" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="321" font-weight="bold">④ 别在陡侧当买方</text><text x="80" y="344" font-size="12">片中清单：Buy Low Sell High / Ratio·Backspread / Avoid Buying High Skew / Unbalanced Condors</text><rect x="60" y="378" width="680" height="50" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="80" y="408" fill="#b35c00" font-size="12">（笔者补充）片中只有四个交易标题，没有行权价/盈亏算例；Ratio 与 Unbalanced Condor 列为观望</text></svg>
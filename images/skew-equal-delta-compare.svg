<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="sans-serif" font-size="14"><rect width="800" height="340" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">正例 vs 反例：比 put 和 call 要用同等 Delta 的虚值档</text><rect x="40" y="50" width="340" height="190" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="60" y="80" font-weight="bold">正例：同等 Delta 比（推算）</text><text x="60" y="110" >155 put：Δ −0.149，IV 58.16%</text><text x="60" y="135" >210 call：Δ 0.135，IV 40.20%</text><text x="60" y="165" font-weight="bold">差约 18 个 IV 点</text><text x="60" y="195" font-size="13">= 「Puts generally have higher IV」</text><text x="60" y="220" font-size="13">在这张表上的具体样子</text><rect x="420" y="50" width="340" height="190" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="440" y="80" font-weight="bold">反例：同一行权价比</text><text x="440" y="110" >180 put：IV 48.06%</text><text x="440" y="135" >180 call：IV 47.99%</text><text x="440" y="165" font-weight="bold">只差 0.07 点 → 看不出 skew</text><text x="440" y="195" font-size="13">（同行权价 put/call 本来就</text><text x="440" y="220" font-size="13">被平价关系绑得很近）</text><rect x="40" y="260" width="720" height="60" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="55" y="285" fill="#b35c00" font-size="13">（推算）18 点差与 0.07 点差由表格数字相减得出，片中没做这一步；</text><text x="55" y="307" fill="#b35c00" font-size="13">（笔者补充）同行权价接近的原因 = put-call parity。ASR「112 delta」是误听，画面 155P Δ = −0.14861</text></svg>
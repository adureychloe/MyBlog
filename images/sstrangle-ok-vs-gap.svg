<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 536" width="820" height="536">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a7fb8"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker></defs>
<style>text{font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei','Source Han Sans SC',sans-serif;fill:#222} .t{font-size:22px;font-weight:700} .st{font-size:14px;fill:#2a7fb8} .s{font-size:13px} .m{font-size:15px} .b{font-weight:700} .red{fill:#c62828} .grn{fill:#2e7d32} .blu{fill:#2a7fb8} .org{fill:#b35c00} .gry{fill:#666} .wht{fill:#fff}</style>
<rect width="820" height="536" fill="#ffffff"/>
<text x="24" y="38" class="t">正例 vs 反例：两腿都 OTM 才拿满；一次跳空就可能出界</text>
<text x="24" y="62" class="st">左：TAKEAWAYS 第 3 条（8:56）；右：口播跳空举例（9:49）</text>
<rect x="30" y="84" width="370" height="300" rx="10" fill="#f1f8f1" stroke="#2e7d32" stroke-width="1.5"/>
<text x="46" y="112" class="m b" text-anchor="start">正例：到期时两腿都还是虚值</text>
<rect x="120" y="226" width="190" height="14" fill="#26a69a" opacity="0.8"/>
<line x1="50" y1="260" x2="380" y2="260" stroke="#888" stroke-width="2"/>
<polygon points="120,260 134,272 134,300 106,300 106,272" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
<text x="120" y="292" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c62828">P</text>
<polygon points="310,260 324,272 324,300 296,300 296,272" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
<text x="310" y="292" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c62828">C</text>
<rect x="420" y="84" width="370" height="300" rx="10" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
<text x="436" y="112" class="m b" text-anchor="start">反例：股价跳空冲出利润区</text>
<rect x="510" y="226" width="190" height="14" fill="#26a69a" opacity="0.8"/>
<line x1="440" y1="260" x2="770" y2="260" stroke="#888" stroke-width="2"/>
<polygon points="510,260 524,272 524,300 496,300 496,272" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
<text x="510" y="292" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c62828">P</text>
<polygon points="700,260 714,272 714,300 686,300 686,272" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
<text x="700" y="292" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#c62828">C</text>
<circle cx="215" cy="260" r="9" fill="#2e7d32"/>
<text x="215" y="200" class="s grn b" text-anchor="middle">到期价落在 P–C 之间</text>
<text x="46" y="345" class="s" text-anchor="start">→ 两张卖出的期权都作废</text>
<text x="46" y="365" class="s" text-anchor="start">→ 收到的权利金全部留下 = 最大盈利</text>
<path d="M 560 250 C 620 150, 680 150, 760 200" fill="none" stroke="#c62828" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<circle cx="760" cy="208" r="9" fill="#c62828"/>
<text x="600" y="150" class="s red b" text-anchor="middle">口播：「20 to 80 overnight」</text>
<text x="436" y="345" class="s" text-anchor="start">→ 裸卖的 call 深度价内，越涨亏越多</text>
<text x="436" y="365" class="s" text-anchor="start">→ 亏损可以远大于收到的权利金（Undefined Risk）</text>
<rect x="30" y="398" width="760" height="46" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="42" y="422" class="s" text-anchor="start">「20 to 80」只是口播里说明跳空的夸张例子，不是这笔交易的行权价或权利金；白板上仍然没有任何数字。</text>
<rect x="30" y="452" width="760" height="44" rx="8" fill="#fff7ee" stroke="#f28c28" stroke-width="2" stroke-dasharray="7 4"/>
<text x="42" y="476" class="s org" text-anchor="start">（笔者补充）下跌那一侧同理：short put 深度价内时要按行权价接货，最坏情况看到股价归零。</text>
<text x="804" y="524" text-anchor="end" class="s gry">仅供学习，不构成投资建议</text>
</svg>

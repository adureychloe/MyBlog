<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">在 Trading 212 里加 Fast / Slow（片中画面参数）</text><rect x="20" y="80" width="160" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="100" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">① Indicators</text><text x="100" y="155" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">→ Oscillators（5:10）</text><line x1="180" y1="135" x2="196" y2="135" stroke="#2563eb" stroke-width="3" /><rect x="196" y="80" width="160" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="276" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">② 选 Fast</text><text x="276" y="155" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">D=3 K=15 OB=80 OS=20</text><line x1="356" y1="135" x2="372" y2="135" stroke="#2563eb" stroke-width="3" /><rect x="372" y="80" width="160" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="452" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">③ 看图例</text><text x="452" y="155" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">(3, 15, 80, 20)</text><line x1="532" y1="135" x2="548" y2="135" stroke="#2563eb" stroke-width="3" /><rect x="548" y="80" width="160" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="628" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">④ 再加 Slow</text><text x="628" y="155" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">SlowK=3 D=3 K=15</text><line x1="708" y1="135" x2="724" y2="135" stroke="#2563eb" stroke-width="3" /><rect x="724" y="80" width="160" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="804" y="118" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="bold">⑤ 对比</text><text x="804" y="155" font-size="12" fill="#222" text-anchor="middle" font-weight="normal">Slow 更平滑（11:50）</text><rect x="20" y="220" width="860" height="120" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" /><text x="40" y="250" font-size="16" fill="#15803d" text-anchor="start" font-weight="bold">白板定义（10:40）</text><text x="40" y="282" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Fast 比 Slow 更敏感；Slow 先把 %K 按 d 期平均变平滑，</text><text x="40" y="310" font-size="15" fill="#222" text-anchor="start" font-weight="normal">%D 再对这条更平滑的 %K 取平均。</text><rect x="20" y="360" width="860" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="40" y="390" font-size="16" fill="#b91c1c" text-anchor="start" font-weight="bold">弃用 / 未采用</text><text x="40" y="420" font-size="15" fill="#222" text-anchor="start" font-weight="normal">11:50 图例读数在截图里模糊，无法逐位核实 → 本文不引用具体读数，也不当信号。</text><text x="40" y="450" font-size="15" fill="#222" text-anchor="start" font-weight="normal">图中品种名不可读 → 不讨论标的。单靠 Stochastic 做买卖 → 弃用。</text></svg>
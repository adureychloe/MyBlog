<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Noto Sans CJK SC, PingFang SC, sans-serif"><rect width="900" height="520" fill="#fff"/><text x="450" y="36" font-size="21" fill="#222" text-anchor="middle" font-weight="bold">%K 在量什么：收盘价在近 n 根高低区间里的位置</text><line x1="150" y1="90" x2="150" y2="330" stroke="#888" stroke-width="2" /><line x1="140" y1="90" x2="160" y2="90" stroke="#222" stroke-width="2" /><line x1="140" y1="330" x2="160" y2="330" stroke="#222" stroke-width="2" /><text x="170" y="95" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Hn（n 期最高）→ 100</text><text x="170" y="335" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Ln（n 期最低）→ 0</text><circle cx="150" cy="150" r="7" fill="#06b6d4"/><text x="170" y="155" font-size="15" fill="#0e7490" text-anchor="start" font-weight="normal">C 靠近高点 → %K 高</text><circle cx="150" cy="290" r="7" fill="#f97316"/><text x="170" y="295" font-size="15" fill="#c2410c" text-anchor="start" font-weight="normal">C 靠近低点 → %K 低</text><rect x="470" y="80" width="400" height="160" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" /><text x="490" y="110" font-size="16" fill="#15803d" text-anchor="start" font-weight="bold">白板公式（3:40）</text><text x="490" y="145" font-size="16" fill="#222" text-anchor="start" font-weight="normal">%K = ((C − Ln) / (Hn − Ln)) × 100</text><text x="490" y="180" font-size="16" fill="#222" text-anchor="start" font-weight="normal">%D = %K 在 d 期上的平均</text><text x="490" y="215" font-size="16" fill="#b91c1c" text-anchor="start" font-weight="bold">T212 App 默认：n = 15，d = 3</text><rect x="470" y="260" width="400" height="90" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="490" y="290" font-size="15" fill="#222" text-anchor="start" font-weight="normal">%K 青线，%D 橙线（2:40）</text><text x="490" y="320" font-size="15" fill="#222" text-anchor="start" font-weight="normal">80 = 超买区，20 = 超卖区，范围 0–100</text><rect x="30" y="380" width="840" height="110" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/><text x="42" y="404" font-size="15" fill="#c2410c" text-anchor="start" font-weight="bold">（笔者补充）</text><text x="42" y="428" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">许多教材/平台把 lookback 写成 14（%D=3）；14 未在本片画面出现。</text><text x="42" y="450" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">所以：在 T212 上默认是 15；换平台要先看自己的设置，别把任一数字当"唯一标准"。</text></svg>
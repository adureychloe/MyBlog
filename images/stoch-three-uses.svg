lyline points="630,200 670,180 700,170 740,145 780,120 840,95" fill="none" stroke="#16a34a" stroke-width="3" /><text x="640" y="130" font-size="13" fill="#15803d" text-anchor="start" font-weight="normal">价格：更高高点</text><line x1="625" y1="230" x2="865" y2="230" stroke="#888" stroke-width="1" /><polyline points="630,320 700,300 760,280 810,268 840,268 855,275" fill="none" stroke="#06b6d4" stroke-width="3" /><text x="640" y="255" font-size="13" fill="#0e7490" text-anchor="start" font-weight="normal">振荡器：右侧走平回落</text><rect x="20" y="360" width="860" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="40" y="392" font-size="15" fill="#222" text-anchor="start" font-weight="normal">背离板上没有写 bullish / bearish，也没有反向（看涨）背离图——本文不补画。</text><rect x="20" y="425" width="860" height="75" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/><text x="32" y="449" font-size="15" fill="#c2410c" text-anchor="start" font-weight="bold">（笔者补充）</text><text x="32" y="473" font-size="14" fill="#7c2d12" text-anchor="start" font-weight="normal">单独用交叉或 80/20 在趋势市里容易反复打脸；片中无 caveat 幻灯、CC 关，此条是笔者对照 ADX/MACD 的补充。</text></svg>
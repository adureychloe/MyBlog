<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" font-family="sans-serif" font-size="14"><rect width="800" height="390" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">例子：同一组到期价，跨式与宽跨式各赚亏多少</text><rect x="60" y="50" width="680" height="40" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="76" font-weight="bold">AAPL 到期价</text><text x="330" y="76" font-weight="bold">跨式（借 8.05）</text><text x="540" y="76" font-weight="bold">宽跨式（借 4.13）</text><rect x="60" y="90" width="680" height="34" fill="#fff" stroke="#ddd"/><text x="80" y="112" >130</text><text x="330" y="112" >+$1,195</text><text x="540" y="112" >+$1,087</text><rect x="60" y="124" width="680" height="34" fill="#fafafa" stroke="#ddd"/><text x="80" y="146" >141.95</text><text x="330" y="146" >$0</text><text x="540" y="146" >−$108</text><rect x="60" y="158" width="680" height="34" fill="#fff" stroke="#ddd"/><text x="80" y="180" >150</text><text x="330" y="180" >−$805</text><text x="540" y="180" >−$413</text><rect x="60" y="192" width="680" height="34" fill="#fafafa" stroke="#ddd"/><text x="80" y="214" >159.13</text><text x="330" y="214" >+$108</text><text x="540" y="214" >$0</text><rect x="60" y="226" width="680" height="34" fill="#fff" stroke="#ddd"/><text x="80" y="248" >170</text><text x="330" y="248" >+$1,195</text><text x="540" y="248" >+$1,087</text><rect x="60" y="270" width="680" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="75" y="295" fill="#c0392b" font-size="13">反例：「两边都赚 = 稳赚」✗ —— 到期在 141.95–158.05 之间跨式亏；99.73% 也不是胜率</text><rect x="60" y="320" width="680" height="50" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="75" y="342" fill="#b35c00" font-size="12">（推算）整张表由公式算出，不含手续费；99.73% = 到期价落在 ±3σ 区间的概率，</text><text x="75" y="362" fill="#b35c00" font-size="12">与这笔能否赚钱无关（笔者补充）</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="448" viewBox="0 0 800 448" font-family="sans-serif" font-size="14"><rect width="800" height="448" fill="#fff"/><text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold">步骤：买跨式/宽跨式前怎么算</text><rect x="60" y="50" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="75" font-weight="bold">① 选结构</text><text x="80" y="98" font-size="12">跨式：ATM call + ATM put；宽跨式：OTM call + OTM put（三步：买 call → 买 put → Hope the Stock Moves）</text><path d="M400 112 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 122 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="132" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="157" font-weight="bold">② 算借记与 BE</text><text x="80" y="180" font-size="12">跨式 Dr 8.05 → 141.95/158.05；宽跨式 Dr 4.13 → 140.87/159.13</text><path d="M400 194 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 204 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="214" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="239" font-weight="bold">③ 换算成要动百分之几</text><text x="80" y="262" font-size="12">跨式约 ±5.4%，宽跨式约 ±6.1%（推算），再和 Expected Move 比</text><path d="M400 276 v16" stroke="#4a6fa5" stroke-width="2"/><path d="M394 286 l6 8 l6 -8" fill="#4a6fa5"/><rect x="60" y="296" width="680" height="62" rx="8" fill="#eef4ff" stroke="#4a6fa5" stroke-width="2"/><text x="80" y="321" font-weight="bold">④ 防三大敌人</text><text x="80" y="344" font-size="12">IV Crush、Theta、高 BE；主讲人：别持有到到期；避开宽价差 IPO/SPAC</text><rect x="60" y="378" width="680" height="50" rx="8" fill="#fff6ec" stroke="#e8891c" stroke-width="2" stroke-dasharray="6,4"/><text x="80" y="408" fill="#b35c00" font-size="12">（笔者补充）用限价单挂 mid 附近；片中票曾切到 Market Order，宽价差票上市价开双腿先亏一截</text></svg>
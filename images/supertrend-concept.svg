<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="560" fill="#fff"/>
<text x="450" y="38" font-size="24" text-anchor="middle" font-weight="bold">Supertrend：一条会翻色的 ATR 台阶线</text>
<text x="450" y="64" font-size="15" text-anchor="middle" fill="#555">TradingView 帮助页 Definition / History（帧 02–04）</text>
<polyline points="60,380 110,360 160,330 210,300 250,280 300,260 330,300 360,330 390,310 430,260 480,220 530,190 580,160" fill="none" stroke="#333" stroke-width="3"/>
<polyline points="60,430 160,430 160,400 250,400 250,350 330,350" fill="none" stroke="#27ae60" stroke-width="4"/>
<polyline points="330,250 390,250 390,240" fill="none" stroke="#c0392b" stroke-width="4"/>
<polyline points="410,330 480,330 480,280 580,280 580,240" fill="none" stroke="#27ae60" stroke-width="4"/>
<text x="120" y="458" font-size="15" fill="#1e8449">绿线在价格下方 = 上升趋势</text>
<text x="300" y="228" font-size="15" fill="#c0392b">红线在价格上方 = 下降趋势</text>
<rect x="620" y="100" width="250" height="210" rx="10" fill="#f3f6fb" stroke="#99a"/>
<text x="635" y="130" font-size="15" font-weight="bold">画面可证</text>
<text x="635" y="158" font-size="14">· 基于 ATR 的趋势跟随指标</text>
<text x="635" y="182" font-size="14">· 单线同时给方向与波动</text>
<text x="635" y="206" font-size="14">· 发明者 Olivier Seban</text>
<text x="635" y="230" font-size="14">· 默认 ATR Length 10</text>
<text x="635" y="254" font-size="14">· 默认 Factor 3</text>
<text x="635" y="278" font-size="14">· 收盘穿线 → 翻色</text>
<rect x="60" y="480" width="810" height="60" rx="8" fill="#fff7ec" stroke="#e8890c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="75" y="506" font-size="14" fill="#b35c00">（笔者补充）示意图为简化手绘。这条线天然像一条 ATR 移动止损，</text>
<text x="75" y="528" font-size="14" fill="#b35c00">但视频口播没有记录，不知道片中是否这样用。</text>
</svg>

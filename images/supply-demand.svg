  <rect x="80" y="300" width="740" height="70" fill="#bbf7d0" fill-opacity=".55" stroke="#16a34a"/>
  <text x="100" y="340" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#166534">需求区 Demand</text>
  <polyline points="120,330 180,320 220,310 260,200 320,90 380,80 450,100 520,180 560,280 600,330 680,320 760,250" fill="none" stroke="#334155" stroke-width="3"/>
  <polygon points="600,330 590,310 620,320" fill="#16a34a"/>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700">供需区：画成「区域」不是一根细线</text>
  <rect x="80" y="60" width="740" height="70" fill="#fecaca" fill-opacity=".55" stroke="#dc2626"/>

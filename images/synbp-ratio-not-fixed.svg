<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">省多少不是固定折扣</text><text x="30" y="72" font-size="15" fill="#667">依 6:45 Capital Requirements 幻灯；比例为笔者推算</text><rect x="30" y="95" width="900" height="140" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="120" font-size="15" fill="#222" font-weight="bold">6:45 幻灯：Margin requirements differ based on the stock being traded</text><text x="42" y="141.75" font-size="15" fill="#222">stock’s price, volatility, and outstanding shares influence the margin requirement</text><text x="42" y="163.5" font-size="15" fill="#222">brokers can manage their own risk exposure</text><rect x="30" y="255" width="440" height="105" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="281" font-size="16" fill="#222" font-weight="bold">（推算）SPY 合成 / 持股</text><text x="42" y="304.2" font-size="16" fill="#222">14,318.30 ÷ 31,241.50 ≈ 46%</text><rect x="490" y="255" width="440" height="105" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="502" y="281" font-size="16" fill="#222" font-weight="bold">（推算）NVDA 合成 / 持股</text><text x="502" y="304.2" font-size="16" fill="#222">6,211.50 ÷ 8,567 ≈ 73%</text><rect x="30" y="375" width="440" height="105" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="401" font-size="16" fill="#222" font-weight="bold">（推算）AAPL 合成 / 持股</text><text x="42" y="424.2" font-size="16" fill="#222">5,109.70 ÷ 10,587 ≈ 48%</text><rect x="490" y="375" width="440" height="105" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="502" y="401" font-size="16" fill="#222" font-weight="bold">（推算）MSTR 合成 / 持股</text><text x="502" y="424.2" font-size="16" fill="#222">22,038.20 ÷ 33,214.50 ≈ 66%</text><rect x="30" y="500" width="900" height="70" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="525" font-size="15" fill="#222">→ 同一个「合成」，在不同标的上省下的购买力差别很大；换券商、换账户类型还会再变（笔者补充）</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
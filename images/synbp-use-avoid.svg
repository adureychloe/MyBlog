<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">什么时候用 / 不用（附风险清单）</text><text x="30" y="72" font-size="15" fill="#667">依 8:09 When To Use 与 7:46 Assignment and Expiration Risks 幻灯重画</text><rect x="60" y="90" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">Best Uses：When you want stock exposure with less capital</text><text x="72" y="139.2" font-size="16" fill="#222">You’re bullish on a stock in the shorter-term</text><line x1="480" y1="203.0" x2="480" y2="217.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="219.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="245.0" font-size="16" fill="#222" font-weight="bold">Avoid：long-term buy-and-hold · bearish on the stock · bid-ask spreads too wide</text><text x="72" y="268.2" font-size="16" fill="#222">反例：把它当「永远更便宜的股票」长期拿着</text><line x1="480" y1="332.0" x2="480" y2="346.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="348.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="374.0" font-size="16" fill="#222" font-weight="bold">风险 1 Early Assignment：短 put 随时可能被指派（深 ITM 时；幻灯称 rare）</text><text x="72" y="397.2" font-size="16" fill="#222">风险 2 Expiration Risk：记住到期日并提前管理</text><line x1="480" y1="461.0" x2="480" y2="475.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="477.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="503.0" font-size="16" fill="#222" font-weight="bold">风险 3 Special Events：并购、收购、特别股息可能改变行权行为</text><text x="72" y="526.2" font-size="16" fill="#222">（笔者补充）数字是 2025 年教学快照，不是今天的报价，也不是推荐</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">算合成多头盈亏平衡：先看是借记还是贷记</text><text x="30" y="72" font-size="15" fill="#667">依 2:47 Breakeven and Profit/Loss 幻灯；例中数字为推算</text><rect x="60" y="90" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="116" font-size="16" fill="#222" font-weight="bold">1 看净权利金方向：call 买价 − put 卖价</text><text x="72" y="139.2" font-size="16" fill="#222">正 = 净借记（paid a net debit）；负 = 净贷记（received a net credit）</text><line x1="480" y1="203.0" x2="480" y2="217.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="219.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="245.0" font-size="16" fill="#222" font-weight="bold">2a 净借记：Breakeven = Strike Price + Net Debit</text><text x="72" y="268.2" font-size="16" fill="#222">2b 净贷记：Breakeven = Strike Price − Net Credit</text><line x1="480" y1="332.0" x2="480" y2="346.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="348.0" width="840" height="113.0" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="72" y="374.0" font-size="16" fill="#222" font-weight="bold">（推算）SPY 625 例：625 + 3.18 ≈ 628.18</text><text x="72" y="397.2" font-size="16" fill="#222">视频给了公式，没有把这个数字写在画面上</text><line x1="480" y1="461.0" x2="480" y2="475.0" stroke="#555" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60" y="477.0" width="840" height="113.0" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="72" y="503.0" font-size="16" fill="#222" font-weight="bold">3 再对照 3:37 Key Differences：有到期、短 put 可能被指派、无投票权/股息</text><text x="72" y="526.2" font-size="16" fill="#222">资金更少（保证金账户）——购买力细节见姊妹篇</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
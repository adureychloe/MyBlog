<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><rect width="960" height="620" fill="#fbfbf8"/><text x="30" y="44" font-size="24" font-weight="bold" fill="#1f2d3d">合成多头 = 买 Call + 卖 Put（同行权价、同到期）</text><text x="30" y="72" font-size="15" fill="#667">依 1:06 What Is Synthetic Long Stock? 幻灯重画</text><rect x="30" y="100" width="260" height="170" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/><text x="160.0" y="130" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Buy a Call</text><text x="160.0" y="159.0" font-size="20" text-anchor="middle" fill="#222">买 1 张看涨</text><text x="330" y="195" font-size="36" fill="#333" text-anchor="middle" font-weight="bold">+</text><rect x="370" y="100" width="260" height="170" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="500.0" y="130" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">Sell a Put</text><text x="500.0" y="159.0" font-size="20" text-anchor="middle" fill="#222">卖 1 张看跌</text><text x="670" y="195" font-size="36" fill="#333" text-anchor="middle" font-weight="bold">≈</text><rect x="700" y="100" width="230" height="170" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="815.0" y="130" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">100 股</text><text x="815.0" y="159.0" font-size="20" text-anchor="middle" fill="#222">的盈亏形状</text><rect x="30" y="295" width="900" height="90" rx="10" fill="#eef4ff" stroke="#3b6fb6" stroke-width="2"/><text x="42" y="321" font-size="16" fill="#222" font-weight="bold">条件：Same Strike Price, Same Expiration（只用期权合约复制持有 100 股的 P/L）</text><rect x="30" y="405" width="900" height="160" rx="10" fill="#fff6ec" stroke="#e67e22" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="431" font-size="16" fill="#222" font-weight="bold">（笔者补充）记忆法：put-call parity</text><text x="42" y="454.2" font-size="16" fill="#222">Call − Put ≈ 合成现货；翻过来（卖 call + 买 put）就是合成空头。</text><text x="42" y="477.4" font-size="16" fill="#222">今天另一组盒子篇里，两个行权价上的合成多 + 合成空对冲，就锁成了「宽度」。</text><text x="30" y="606" font-size="12" fill="#999" text-anchor="start">橙色虚线框 = 笔者补充 / 推算，不是视频原话；其余依视频画面重画。仅供学习，不构成投资建议。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#111">反例：脱离结构的大阳 / 假突破</text>
  <text x="240" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#334155">① 脱离结构的大阳（远离 Area）</text>
  <rect x="40" y="70" width="400" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <path d="M70 260 C 140 250, 200 240, 260 235" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="1.5">
    <rect x="80" y="230" width="12" height="30" fill="#94a3b8"/>
    <rect x="110" y="220" width="12" height="28" fill="#ef4444"/>
    <rect x="140" y="215" width="12" height="26" fill="#22c55e"/>
    <rect x="170" y="210" width="12" height="24" fill="#94a3b8"/>
    <rect x="200" y="205" width="12" height="28" fill="#ef4444"/>
  </g>
  <rect x="260" y="90" width="28" height="150" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <line x1="274" y1="80" x2="274" y2="250" stroke="#15803d" stroke-width="2"/>
  <text x="240" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#b91c1c">✕ 噪声：远离 Area</text>
  <text x="720" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#334155">② 假突破（刺穿阻力后收回）</text>
  <rect x="520" y="70" width="400" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="560" y="180" width="300" height="36" fill="#fecdd3" fill-opacity="0.7" stroke="#e11d48"/>
  <text x="710" y="203" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#9f1239">S/R 区</text>
  <g stroke-width="2">
    <rect x="580" y="210" width="14" height="40" fill="#22c55e" stroke="#15803d"/>
    <rect x="620" y="195" width="14" height="45" fill="#22c55e" stroke="#15803d"/>
    <rect x="660" y="140" width="14" height="70" fill="#22c55e" stroke="#15803d"/>
    <line x1="667" y1="110" x2="667" y2="140" stroke="#15803d"/>
    <rect x="700" y="150" width="14" height="55" fill="#ef4444" stroke="#b91c1c"/>
    <line x1="707" y1="120" x2="707" y2="150" stroke="#b91c1c"/>
    <rect x="740" y="200" width="14" height="50" fill="#ef4444" stroke="#b91c1c"/>
    <rect x="780" y="230" width="14" height="55" fill="#ef4444" stroke="#b91c1c"/>
  </g>
  <text x="720" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#b91c1c">✕ 假突破：刺穿收回</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="640" fill="#fff"/><text x="480" y="40" font-size="24" text-anchor="middle" font-weight="bold">放量突破追进：检查清单</text>
<rect x="40" y="70" width="420" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/><text x="60" y="100" font-size="17" font-weight="bold">1.（笔者补充）4H 以上趋势向上？</text><text x="60" y="126" font-size="14">逆大趋势的突破默认跳过</text>
<rect x="40" y="170" width="420" height="70" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="200" font-size="17" font-weight="bold">2. 出现大阳线突破阻力位？</text><text x="60" y="226" font-size="14">实体长、收在阻力上方</text>
<rect x="40" y="270" width="420" height="70" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="300" font-size="17" font-weight="bold">3. 是否放量？</text><text x="60" y="326" font-size="14">（笔者补充：对比近期均量）</text>
<rect x="40" y="370" width="420" height="70" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="400" font-size="17" font-weight="bold">4. 是碰阻力快速回落吗？</text><text x="60" y="426" font-size="14">长上影、收回阻力下 → 不追</text>
<rect x="40" y="470" width="420" height="70" rx="8" fill="#eef4ff" stroke="#2b6cb0" stroke-width="2"/><text x="60" y="500" font-size="17" font-weight="bold">5. 不是 → 第一时间追进</text><text x="60" y="526" font-size="14">我的原话（例外见第 4 步）</text>
<rect x="500" y="70" width="420" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/><text x="520" y="100" font-size="17" font-weight="bold">6.（笔者补充）离突破位太远？</text><text x="520" y="126" font-size="14">已大幅拉开就放弃，不追高</text>
<rect x="500" y="170" width="420" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/><text x="520" y="200" font-size="17" font-weight="bold">7.（笔者补充）止损放哪</text><text x="520" y="226" font-size="14">大阳线低点下 / 跌回区间内</text>
<rect x="500" y="270" width="420" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/><text x="520" y="300" font-size="17" font-weight="bold">8.（笔者补充）算仓位</text><text x="520" y="326" font-size="14">按止损距离和单笔风险金额</text>
<rect x="500" y="370" width="420" height="70" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2" stroke-dasharray="8 5"/><text x="520" y="400" font-size="17" font-weight="bold">9.（笔者补充）事后复盘</text><text x="520" y="426" font-size="14">记录每次追进的结果</text>
<text x="480" y="600" font-size="14" text-anchor="middle" fill="#4a5568">蓝色实线 = 我的原话拆解；橙色虚线 = 笔者补充</text></svg>

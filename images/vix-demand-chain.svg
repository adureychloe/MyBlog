<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="45" font-size="26" fill="#222" text-anchor="middle" font-weight="bold">VIX 链条：担忧 → 买保护 → 期权变贵（0:42–1:30）</text><rect x="30.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="131.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">担忧/不确定</text><text x="131.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">市场情绪偏空</text><line x1="234.5" y1="205" x2="258.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="262.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="363.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">买期权保护</text><text x="363.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">需求上升</text><line x1="467.0" y1="205" x2="491.0" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="495.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="596.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">IV 上升</text><text x="596.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">权利金变贵</text><line x1="699.5" y1="205" x2="723.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="727.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="828.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">VIX 上升</text><text x="828.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">跟踪 S&amp;P 500</text><text x="828.75" y="193" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">期权的隐含波动</text><text x="40" y="370" font-size="17" fill="#222" text-anchor="start" font-weight="normal">反方向同理：需求下降 → 期权变便宜 → VIX 回落（片中 1:19 / 1:25 口播）。</text><text x="40" y="400" font-size="17" fill="#222" text-anchor="start" font-weight="normal">VIX = CBOE Volatility Index®，绰号 Fear Index（0:15 / 0:19）。片中没有给计算公式，本文也不编。</text><rect x="30" y="470" width="900" height="110" rx="10" fill="#fff6ec" stroke="#e8892b" stroke-width="2" stroke-dasharray="8 5"/><text x="44" y="498" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">（笔者补充）VIX 是指数层面的数字；单只股票的 IV / IV Rank 是另一回事，不要混成同一个数。</text></svg>
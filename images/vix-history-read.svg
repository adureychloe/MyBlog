<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="40" font-size="24" fill="#222" text-anchor="middle" font-weight="bold">历史图读法（对照片中 2:38 与 2:56 画面）</text><rect x="30" y="70" width="430" height="300" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="245" y="105" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">2014–15 例（2:38）</text><text x="55" y="150" font-size="16" fill="#222" text-anchor="start" font-weight="normal">蓝线 SPX、金线 VIX</text><text x="55" y="184" font-size="16" fill="#222" text-anchor="start" font-weight="normal">黄色带 = 卖压阶段</text><text x="55" y="218" font-size="16" fill="#222" text-anchor="start" font-weight="normal">每次下跌，VIX 都出现尖刺</text><text x="55" y="252" font-size="16" fill="#222" text-anchor="start" font-weight="normal">VIX 轴约 12–30</text><rect x="500" y="70" width="430" height="300" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="715" y="105" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">2005–2013 例（2:51–3:01）</text><text x="525" y="150" font-size="16" fill="#222" text-anchor="start" font-weight="normal">2008 带内 VIX 冲过 80</text><text x="525" y="184" font-size="16" fill="#222" text-anchor="start" font-weight="normal">虚线约 49–50</text><text x="525" y="218" font-size="16" fill="#222" text-anchor="start" font-weight="normal">口播：此水平“常对应底部”</text><text x="525" y="252" font-size="16" fill="#222" text-anchor="start" font-weight="normal">但片中自己说 2008 是 outlier</text><rect x="30" y="395" width="900" height="80" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2" /><text x="50" y="428" font-size="17" fill="#a02020" text-anchor="start" font-weight="normal">反例提醒：VIX 到 50 ≠ 必然见底；尖刺是事后回看，不能当明天的信号。</text><text x="50" y="456" font-size="15" fill="#a02020" text-anchor="start" font-weight="normal">片中披露（3:33）：过往表现不保证未来，非个性化建议。</text><rect x="30" y="495" width="900" height="80" rx="10" fill="#fff6ec" stroke="#e8892b" stroke-width="2" stroke-dasharray="8 5"/><text x="44" y="523" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">（推算）虚线水平：截图文件名记 49，画面轴刻度接近 50，口播只说“this level”，</text><text x="44" y="549" font-size="16" fill="#a85a10" text-anchor="start" font-weight="normal">所以写作“约 49–50”，不报精确值。</text></svg>
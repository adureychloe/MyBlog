<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Noto Sans CJK SC, sans-serif"><rect width="960" height="600" fill="#fff"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs><text x="480" y="45" font-size="26" fill="#222" text-anchor="middle" font-weight="bold">做市商视角：买盘抬价 → 卖方进场 → IV 回落（1:34–2:14）</text><rect x="30.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="131.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">买单涌入</text><text x="131.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">市场定价“大波动”</text><line x1="234.5" y1="205" x2="258.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="262.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="363.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">权利金变高</text><text x="363.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">吸引期权卖方</text><line x1="467.0" y1="205" x2="491.0" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="495.0" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="596.25" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">卖方/订单流增多</text><text x="596.25" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">供给增加</text><line x1="699.5" y1="205" x2="723.5" y2="205" stroke="#555" stroke-width="2.5" marker-end="url(#a)"/><rect x="727.5" y="90" width="202.5" height="230" rx="10" fill="#eef4ff" stroke="#4a7bd0" stroke-width="2" /><text x="828.75" y="125" font-size="19" fill="#1d3f80" text-anchor="middle" font-weight="bold">IV 倾向回落</text><text x="828.75" y="165" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">VIX 随之降温</text><text x="40" y="370" font-size="17" fill="#222" text-anchor="start" font-weight="normal">片中 3:14 / 3:18 口播“BUY LOW AND SELL HIGH”（针对波动），是定性教学，没有回测。</text><text x="40" y="400" font-size="17" fill="#222" text-anchor="start" font-weight="normal">所以本文把它列为“观望”，不当个人交易模板。</text></svg>
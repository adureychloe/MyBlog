<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="960" height="540" fill="#fff"/>
  <text x="480.0" y="32" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">Volume Profile 解剖：POC · Value Area · VAH / VAL · HVN / LVN</text>
  <text x="480.0" y="55" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">教学示意（按片中 ~1:19 POC 文案、VA≈70% 文案与中段示意图重画；柱长为示意，非真实数据）</text>
  <rect x="40" y="78" width="470" height="426" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>

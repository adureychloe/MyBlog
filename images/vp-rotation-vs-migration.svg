<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="960" height="500" fill="#fff"/>
  <text x="480.0" y="32" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">同一张 Profile，两种日子：区内轮动 vs 趋势日价值迁移</text>
  <text x="480.0" y="55" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">左：#2 Value Area Rotation（片中文案）· 右：#4 Day value migration（片中文案）· 走势线为教学示意</text>
  <rect x="30" y="72" width="440" height="360" rx="10" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="250" y="100" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">例：价格留在 VAH–VAL 内 → 轮动</text>
  <rect x="60" y="160" width="380" height="180" fill="#dbeafe" opacity="0.8"/>
  <line x1="60" y1="160" x2="440" y2="160" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="60" y1="340" x2="440" y2="340" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5,4"/>
  <line x1="60" y1="255" x2="440" y2="255" stroke="#d97706" stroke-width="2.5"/>
  <text x="66" y="154" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">VAH</text>
  <text x="66" y="356" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">VAL</text>
  <text x="436" y="249" font-size="12" fill="#b45309" text-anchor="end" font-weight="700">POC</text>
  <polyline points="70.0,250.0 105.0,185.0 140.0,230.0 175.0,320.0 210.0,270.0 245.0,190.0 280.0,250.0 315.0,325.0 350.0,280.0 385.0,195.0 425.0,245.0" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="250" y="372" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">价在区内来回：边缘附近常被拉回中间</text>
  <text x="250" y="394" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">（NinjaTrader 图示：价格绕橙色 POC 来回摆动）</text>
  <rect x="490" y="72" width="440" height="360" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="710" y="100" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="700">反例：趋势日还死守旧 VA / 旧 POC</text>
  <rect x="515" y="300" width="115" height="80" fill="#e2e8f0" stroke="#93c5fd"/>
  <line x1="515" y1="340.0" x2="630" y2="340.0" stroke="#d97706" stroke-width="2.5"/>
  <text x="572" y="396" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">旧 VA</text>
  <rect x="640" y="220" width="115" height="80" fill="#dbeafe" stroke="#93c5fd"/>
  <line x1="640" y1="260.0" x2="755" y2="260.0" stroke="#d97706" stroke-width="2.5"/>
  <rect x="765" y="135" width="115" height="80" fill="#bfdbfe" stroke="#93c5fd"/>
  <line x1="765" y1="175.0" x2="880" y2="175.0" stroke="#d97706" stroke-width="2.5"/>
  <text x="822" y="231" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">新 VA</text>
  <polyline points="520.0,360.0 560.0,330.0 600.0,345.0 650.0,285.0 690.0,300.0 740.0,235.0 780.0,250.0 830.0,175.0 870.0,190.0 905.0,140.0" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="605" y1="345" x2="605" y2="398" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="590" y="414" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="700">在这里等「回到旧 POC」再逆势摊平 = 危险</text>
  <text x="710" y="125" font-size="12" fill="#334155" text-anchor="middle" font-weight="400">POC 与价值区一路上移（跟随参与者）</text>
  <text x="480.0" y="462" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">二元读法：价值还在原地（区内）→ 按轮动看；价值在搬家（POC/VA 跟着走）→ 承认趋势，别硬做均值回归。</text>
  <text x="480.0" y="484" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">下跌趋势同理：POC/VA 逐段下移。</text>
</svg>

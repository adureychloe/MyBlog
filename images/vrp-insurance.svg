<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700">买保险 vs 卖保险（期权权利金）</text>
  <text x="240" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">买方 = 买保险</text>
  <text x="720" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#c2410c">卖方 = 卖保险</text>
  <rect x="40" y="78" width="400" height="290" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="520" y="78" width="400" height="290" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <!-- buyer -->
  <circle cx="240" cy="160" r="36" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">付保费</text>
  <text x="240" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">付钱换尾部保护 / 凸性</text>
  <text x="240" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#64748b">多数时候：权利金慢慢耗尽</text>
  <text x="240" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#166534">大波动时：赔付可能盖住损失</text>
  <text x="240" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1e40af">在付 VRP（波动偏贵的溢价）</text>
  <!-- seller -->
  <circle cx="720" cy="160" r="36" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="720" y="166" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#c2410c">收保费</text>
  <text x="720" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">收钱，承担尾部赔付义务</text>
  <text x="720" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#166534">多数时候：小赢很多次</text>
  <text x="720" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#b91c1c">尾部爆炸：一次可吞掉长串小赢</text>
  <text x="720" y="330" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9a3412">在收 VRP 租金 · 非「印钞」</text>
  <text x="480" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#334155">正 VRP ≠ 稳赚；高胜率（POP）≠ 正期望（EV）</text>
</svg>

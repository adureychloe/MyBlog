<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect width="960" height="720" fill="#fff"/>
  <text x="480.0" y="32.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">车轮的两个致命风险：跌下去回不来，涨上去拿不到</text>
  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">RIOT 对照 9:18–10:28，ASML 对照 11:33–12:32 画面与口播；两只股票都只是片中教学例子，不是推荐</text>
  <rect x="30.0" y="76.0" width="440.0" height="520.0" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="250.0" y="102.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="700">风险一：股票暴跌（RIOT 例）</text>
  <line x1="80.0" y1="330.0" x2="440.0" y2="330.0" stroke="#475569" stroke-width="1.2"/>
  <line x1="80.0" y1="130.0" x2="80.0" y2="330.0" stroke="#475569" stroke-width="1.2"/>
  <text x="74.0" y="334.0" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400">$0</text>
  <text x="74.0" y="289.6" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400">$10</text>
  <text x="74.0" y="245.1" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400">$20</text>
  <text x="74.0" y="200.7" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400">$30</text>
  <text x="74.0" y="156.2" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400">$40</text>
  <line x1="80.0" y1="152.2" x2="440.0" y2="152.2" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="438.0" y="146.2" font-size="10.5" fill="#dc2626" text-anchor="end" font-weight="700">主讲人假设的被指派成本 ≈ $40（口播 let's say）</text>
  <polyline points="110.0,174.8 260.0,237.7 410.0,219.7" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-opacity="1.0" stroke-dasharray="3 4"/>
  <circle cx="110.0" cy="174.8" r="5" fill="#dc2626"/>
  <text x="110.0" y="164.8" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">$34.92</text>
  <text x="110.0" y="346.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">2021-11-26</text>
  <circle cx="260.0" cy="237.7" r="5" fill="#dc2626"/>
  <text x="260.0" y="227.7" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">$20.76</text>
  <text x="260.0" y="346.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">2022-03-25</text>
  <circle cx="410.0" cy="219.7" r="5" fill="#dc2626"/>
  <text x="410.0" y="209.7" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">$24.81</text>
  <text x="410.0" y="346.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">May 14（录制时）</text>
  <text x="250.0" y="366.0" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400">只连了画面上标出的 3 个价格点；中间的深跌走势请看原片 5 年图</text>
  <text x="48.0" y="400.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">口播要点：</text>
  <text x="48.0" y="421.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 成本约 $40、股价约 $20 → 要赚钱，call 得卖在 $40 以上</text>
  <text x="48.0" y="442.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 离现价太远，call 几乎收不到权利金 → ACB 降得极慢</text>
  <text x="48.0" y="463.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 就算回到 $24.81，也还在成本下方，整轮仍是亏的</text>
  <text x="48.0" y="484.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 底部割肉「亏了接近 90%」</text>
  <text x="48.0" y="505.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 「再多权利金也补不回 90% 的亏损」</text>
  <text x="48.0" y="526.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">→ 所以只做稳定盈利的中大盘公司</text>
  <rect x="44.0" y="552.0" width="412.0" height="34.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="56.0" y="572.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">笔者补充：「拿四年不如标普 15%/年」是主讲人口径，未核实</text>
  <rect x="490.0" y="76.0" width="440.0" height="520.0" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1"/>
  <text x="710.0" y="102.0" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">风险二：上涨被封顶（ASML 例）</text>
  <text x="508.0" y="128.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">主讲人妻子完整跑的一轮（11:33–11:56 画面）：</text>
  <text x="508.0" y="148.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">710 / 710 / 700 put 多次滚动 → 4/25 以 $700 被指派</text>
  <text x="508.0" y="168.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">（当时 ACB $637.61）→ 卖 685 call → 6/6 被叫走</text>
  <text x="508.0" y="188.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">最终 ACB $614.61 · 权利金 $8,539.45 · 股票 −$1,500</text>
  <text x="508.0" y="208.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">Net P&amp;L $7,039.45 · +10.1% · 162 天</text>
  <text x="632.0" y="262.0" font-size="12.5" fill="#334155" text-anchor="end" font-weight="400">跑车轮这一轮</text>
  <rect x="640.0" y="248.0" width="21.4" height="24.0" fill="#16a34a" fill-opacity="0.9" stroke="none"/>
  <text x="667.4" y="265.0" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700">$7,039（画面）</text>
  <text x="632.0" y="312.0" font-size="12.5" fill="#334155" text-anchor="end" font-weight="400">只拿股票不卖 call</text>
  <rect x="640.0" y="298.0" width="270.0" height="24.0" fill="#b45309" fill-opacity="0.85" stroke="none"/>
  <text x="904.0" y="315.0" font-size="12.5" fill="#fff" text-anchor="end" font-weight="700">≈ $88,711</text>
  <rect x="504.0" y="340.0" width="412.0" height="104.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="516.0" y="360.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">推算（按画面数字算）</text>
  <text x="516.0" y="380.0" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400">12:08 画面 ASML 报价 $1,587.11；被指派价 $700</text>
  <text x="516.0" y="396.0" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400">(1,587.11 − 700) × 100 = $88,711 ≈ 8.9 万美元</text>
  <text x="516.0" y="412.0" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400">注：主讲人口播说的是 $80,000（约 8 万），</text>
  <text x="516.0" y="428.0" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400">12:32 的大字卡片也写 $80,000；按画面数字应约 8.9 万</text>
  <text x="508.0" y="468.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">口播要点：</text>
  <text x="508.0" y="489.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 一轮 +10.1% 看着不错，但错过了大部分涨幅</text>
  <text x="508.0" y="510.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· call 进价内后，很多人一直滚动、盼回调（12:56 BAC 帖）</text>
  <text x="508.0" y="531.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 主讲人：你不是在追求最大利润 —— 让股票被叫走</text>
  <text x="508.0" y="552.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">· 不想丢股，就晚点再卖 call，只卖在愿意卖的价格</text>
  <rect x="30.0" y="612.0" width="900.0" height="92.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="42.0" y="632.0" font-size="12.5" fill="#ea580c" text-anchor="start" font-weight="700">笔者补充</text>
  <text x="42.0" y="652.0" font-size="12" fill="#7c2d12" text-anchor="start" font-weight="400">车轮最大的风险，本质就是「承担持股的全部下跌风险，换来有限的权利金」，和直接买股再卖 call 是一回事。</text>
  <text x="42.0" y="670.0" font-size="12" fill="#7c2d12" text-anchor="start" font-weight="400">13:08 的 Exhibit 5 图（权利金收益率越高，卖 call 预期收益越负）没有注明出处，本文只当示意，不当证据。</text>
</svg>

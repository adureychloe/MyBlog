<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Noto Sans CJK SC, Noto Serif CJK SC, sans-serif">
<rect width="900" height="580" fill="#ffffff"/>
<text x="450" y="36" font-size="22" text-anchor="middle" font-weight="bold">Williams %R：收盘落在近 14 根区间的哪个位置</text>
<text x="450" y="62" font-size="14" text-anchor="middle" fill="#555">对照片中 1:21 公式页、1:00 设置 Length 14、1:47 刻度图</text>

<!-- formula box -->
<rect x="40" y="80" width="820" height="88" rx="8" fill="#f3f6fb" stroke="#99a"/>
<text x="60" y="110" font-size="16" font-weight="bold">片中公式（1:21–1:26 画面原文）</text>
<text x="60" y="138" font-size="15">WILLIAMS %R = (HIGHEST HIGH − CLOSE) / (HIGHEST HIGH − LOWEST LOW)</text>
<text x="60" y="158" font-size="13" fill="#555">Highest High / Lowest Low = 回看期（typically 14）内最高/最低；Close = 最近收盘</text>

<!-- scale -->
<rect x="40" y="188" width="420" height="300" rx="8" fill="#111" stroke="#333"/>
<text x="250" y="218" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">OVERBOUGHT</text>
<line x1="70" y1="240" x2="360" y2="240" stroke="#e05a3c" stroke-width="2"/>
<text x="380" y="245" font-size="14" fill="#fff">0</text>
<text x="380" y="275" font-size="14" fill="#fff">−20</text>
<line x1="70" y1="270" x2="360" y2="270" stroke="#e05a3c" stroke-width="2"/>
<rect x="70" y="270" width="290" height="120" fill="#2a3a44" opacity="0.7"/>
<line x1="70" y1="330" x2="360" y2="330" stroke="#e05a3c" stroke-width="2" stroke-dasharray="5,4"/>
<text x="380" y="335" font-size="14" fill="#fff">−50</text>
<line x1="70" y1="390" x2="360" y2="390" stroke="#e05a3c" stroke-width="2"/>
<text x="380" y="395" font-size="14" fill="#fff">−80</text>
<text x="380" y="455" font-size="14" fill="#fff">−100</text>
<text x="250" y="470" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">OVERSOLD</text>
<!-- wiggly %R line -->
<path d="M80,340 L110,360 L140,310 L170,400 L200,280 L230,250 L260,220 L290,300 L330,410 L350,350" fill="none" stroke="#5ec8d8" stroke-width="2.5"/>
<text x="90" y="205" font-size="12" fill="#aaa">0 ~ −20 超买区</text>
<text x="90" y="445" font-size="12" fill="#aaa">−80 ~ −100 超卖区</text>

<!-- right notes -->
<rect x="480" y="188" width="380" height="160" rx="8" fill="#f8fafc" stroke="#99a"/>
<text x="500" y="218" font-size="15" font-weight="bold">TradingView 设置（1:00–1:05）</text>
<text x="500" y="246" font-size="14">Timeframe：Same as chart</text>
<text x="500" y="270" font-size="14">Gaps：☑</text>
<text x="500" y="294" font-size="14">Length：14 · Source：close</text>
<text x="500" y="322" font-size="13" fill="#555">刻度：0 / −20 / −50 / −80 / −100（帧 10）</text>

<rect x="480" y="368" width="380" height="120" rx="8" fill="#fff7ec" stroke="#e8890c" stroke-width="2" stroke-dasharray="7,5"/>
<text x="500" y="398" font-size="14" fill="#b35c00">（笔者补充）常见教材还会再乘 −100，</text>
<text x="500" y="422" font-size="14" fill="#b35c00">把结果压到 0~−100。片中公式页没写 ×−100，</text>
<text x="500" y="446" font-size="14" fill="#b35c00">本文刻度以画面为准，不补写成片中原话。</text>
<text x="500" y="470" font-size="13" fill="#b35c00">与 Stochastic %K 的关系见文末补充。</text>
</svg>

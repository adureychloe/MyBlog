  <text x="60.0" y="500.0" font-size="11" fill="#334155" text-anchor="start" font-weight="400">读顺序：急跌出 SC（下沿）→ 反弹出 AR（上沿）→ ST 回测，这三步 = Phase A「止住下跌」（5:27 字幕：phase A, the stopping of a trend）</text>

  <text x="60.0" y="452.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">片中没有任何价格数字或 R 倍数：工具框的像素高度不能读成「1:2」「1:5」。</text>
  <text x="60.0" y="472.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">派发例 1（9:0x）字幕说 You can enter a trade here，但那一帧没画入场/止损框——本图不画。</text>
  <text x="60.0" y="492.0" font-size="12" fill="#9a3412" text-anchor="start" font-weight="400">Spring 2「不等测试直接买」的定义没截到，片中入场画面里也没用到，本图不画。</text>

  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">7:38 累积例 2 · 10:57 派发例 2 · 12:4x 再累积；红框 = 止损区，箭头 = 目标方向（高度只是示意）</text>

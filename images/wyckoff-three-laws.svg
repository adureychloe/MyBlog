  <style>text{font-family:system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker></defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480.0" y="32.0" font-size="19" fill="#0f172a" text-anchor="middle" font-weight="700">威科夫三大定律：供需、因果、努力与结果</text>
  <text x="480.0" y="55.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">上：1:07 幻灯片「Wyckoff laws」整理 · 下：2:37「努力没结果」画面示意（无品种、周期、价格）</text>
  <rect x="40.0" y="76.0" width="280.0" height="186.0" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1"/>
  <text x="180.0" y="104.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">① 供需 Supply &amp; Demand</text>
  <text x="62.0" y="138.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">需求 &gt; 供给 → 价格涨</text>
  <text x="62.0" y="164.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">需求 &lt; 供给 → 价格跌</text>
  <text x="62.0" y="190.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">两者相等 → 价格不怎么动</text>
  <rect x="340.0" y="76.0" width="280.0" height="186.0" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="480.0" y="104.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">② 因果 Cause &amp; Effect</text>
  <text x="362.0" y="138.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">每个「果」（一段行情）</text>
  <text x="362.0" y="164.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">都由之前市场里发生的</text>
  <text x="362.0" y="190.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">「因」造成；片中图把「因」</text>
  <text x="362.0" y="216.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">画成一段横盘区间</text>
  <rect x="640.0" y="76.0" width="280.0" height="186.0" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="780.0" y="104.0" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">③ 努力与结果 Effort &amp; Result</text>
  <text x="662.0" y="138.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">努力 = 成交量</text>
  <text x="662.0" y="164.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">结果 = 价格变化</text>
  <text x="662.0" y="190.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">拿两者对比：</text>
  <text x="662.0" y="216.0" font-size="13" fill="#334155" text-anchor="start" font-weight="400">对不上就要警惕</text>
  <rect x="40.0" y="280.0" width="520.0" height="196.0" rx="6" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="220.0" y="358.0" width="100.0" height="22.0" fill="#bbf7d0" fill-opacity="0.8" stroke="none"/>

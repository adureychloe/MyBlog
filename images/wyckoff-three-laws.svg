  <text x="60.0" y="296.0" font-size="10" fill="#64748b" text-anchor="start" font-weight="400">价格（相对）</text>
  <rect x="580.0" y="280.0" width="340.0" height="196.0" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="600.0" y="308.0" font-size="14" fill="#dc2626" text-anchor="start" font-weight="700">努力没结果（2:37）</text>
  <text x="600.0" y="336.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">下跌后一小段横盘（绿底）被大红圈圈住，</text>
  <text x="600.0" y="355.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">下方成交量也画了小红圈。</text>
  <text x="600.0" y="374.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">字幕：…is a lack of result. This can serve</text>
  <text x="600.0" y="393.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">as a signal of a possible trend…（后半截断）</text>
  <text x="600.0" y="412.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400"></text>
  <text x="600.0" y="431.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">人话：力气（量）花了，价格却走不动，</text>
  <text x="600.0" y="450.0" font-size="12" fill="#334155" text-anchor="start" font-weight="400">原来的趋势可能没劲了。</text>
  <text x="480.0" y="504.0" font-size="12" fill="#64748b" text-anchor="middle" font-weight="400">1:07 图上的「10 / 20 / SPRING 20」数字含义从画面看不懂，本文不做解释、也不画。</text>
